name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Check tag format
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          re='^v[0-9]+\.[0-9]+(\.[0-9]+(-(beta|rc)\.[0-9]+)?)?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "::error::Tag '$TAG' does not match $re (e.g. v1.2, v1.2.3, v1.2.3-rc.1)"
            exit 1
          fi

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  image:
    needs: ci
    uses: ./.github/workflows/docker.yml

  release:
    name: GitHub Release
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          image="ghcr.io/${REPO}:${version}"

          notes=""
          if [ -f CHANGELOG.md ]; then
            notes="$(awk -v h="## [${version}]" '
              index($0, h) == 1 { on = 1; next }
              on && /^## \[/ { exit }
              on { print }
            ' CHANGELOG.md)"
          fi
          if ! printf '%s' "$notes" | grep -q '[^[:space:]]'; then
            notes=""
          fi

          body="$(mktemp)"
          if [ -n "$notes" ]; then
            printf '%s\n\n' "$notes" > "$body"
          fi
          printf 'Docker image: `%s`\n' "$image" >> "$body"

          flags=()
          case "$TAG" in
            *-beta.*|*-rc.*) flags+=(--prerelease) ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$body" ${flags[@]+"${flags[@]}"}
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$body" --verify-tag ${flags[@]+"${flags[@]}"}
          fi
