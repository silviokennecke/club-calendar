name: Admin docs

on:
  push:
    branches: [main]
    paths:
      - "docs/admin/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/admin/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build admin guide
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Zensical
        run: pip install -r docs/admin/requirements.txt

      - name: Build site
        working-directory: docs/admin
        run: zensical build --clean

      - name: Validate example Compose files
        run: >
          docker compose
          -f docs/admin/docs/examples/docker-compose.yml
          -f docs/admin/docs/examples/docker-compose.override.yml
          --env-file docs/admin/docs/examples/example.env
          config -q

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/admin/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
