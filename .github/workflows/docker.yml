name: Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - "backend/**"
      - "frontend/**"
      - "package*.json"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
    inputs:
      php_version:
        description: "PHP base image version (empty = Dockerfile default)"
        type: string
        default: ""
      node_version:
        description: "Node.js base image version (empty = Dockerfile default)"
        type: string
        default: ""
      caddy_version:
        description: "Caddy base image version (empty = Dockerfile default)"
        type: string
        default: ""
      tag:
        description: "Image tag (empty = manual-<run number>); never latest or a version tag"
        type: string
        default: ""
  workflow_call:
    inputs:
      php_version:
        description: "PHP base image version (empty = Dockerfile default)"
        type: string
        default: ""
      node_version:
        description: "Node.js base image version (empty = Dockerfile default)"
        type: string
        default: ""
      caddy_version:
        description: "Caddy base image version (empty = Dockerfile default)"
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  # Fork PRs get a read-only token: build only
  CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: env.CAN_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Not type=semver: tags like v1.2 are not strict semver
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # pre-release tags (v1.2.3-beta.1, -rc.1) must not move `latest`
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}
            type=ref,event=pr
            type=match,pattern=^v(.+)$,group=1,enable=${{ github.event_name != 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') && github.event_name != 'workflow_dispatch' }}
            type=raw,value=${{ inputs.tag || format('manual-{0}', github.run_number) }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # empty inputs are left out so the Dockerfile defaults apply
          build-args: |
            ${{ inputs.php_version != '' && format('PHP_VERSION={0}', inputs.php_version) || '' }}
            ${{ inputs.node_version != '' && format('NODE_VERSION={0}', inputs.node_version) || '' }}
            ${{ inputs.caddy_version != '' && format('CADDY_VERSION={0}', inputs.caddy_version) || '' }}
          push: ${{ env.CAN_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
