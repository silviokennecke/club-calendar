name: Cleanup container images

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  untagged:
    name: Delete old untagged images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # tag-selection untagged never touches tagged versions; the action also
      # protects the child manifests of kept multi-arch images (v3.1.0+)
      - uses: snok/container-retention-policy@v3.1.0
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: club-calendar
          tag-selection: untagged
          cut-off: 1w
          dry-run: ${{ inputs.dry-run || false }}

  closed-prs:
    name: Delete images of closed pull requests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      # Only pr-<N> tags are considered; main, version tags and latest are never matched
      - name: Delete pr-<N> versions closed for more than 30 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          PACKAGE: club-calendar
          DRY_RUN: ${{ inputs.dry-run || false }}
        run: .github/scripts/cleanup-pr-images.sh
