      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnknownReference' }

  /api/calendars/{calendarId}/templates/{id}:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Event templates]
      summary: One template
      operationId: getTemplate
      responses:
