openapi: 3.1.0
info:
  title: Club Calendar API
  version: '1.0'
  summary: HTTP API of the Club Calendar backend (Symfony, `backend/`).
  description: |
    Hand-written reference of every route under `/api`. It is checked against the Symfony router by
    `backend/tests/Unit/OpenApiSpecTest.php` (every route documented with the same method and path, every
    documented operation exists). It is not served by the application.

    ## Conventions

    - **IDs** are UUID v7 strings (RFC 4122 form, lower case). The database compares IDs case-insensitively.
    - **Dates** are calendar dates `YYYY-MM-DD`, **times** are wall-clock times `HH:MM` (seconds in the input are
      accepted and dropped), **time zones** are IANA names (`Europe/Berlin`), matched case-insensitively and
      returned in their canonical spelling. Timestamps are ISO 8601 (`2026-10-15T12:00:00+00:00`) unless noted.
    - Request bodies are JSON objects (`Content-Type: application/json`), except `POST /api/auth/token`
      (form-encoded). A body that is not valid JSON (or empty) is `400 invalid_request`; a valid JSON value that is not an
      object (`5`, `null`, `"x"`) is `400 invalid_request` on routes that read the body as a map and `422 validation_failed`
      (first required field) on routes that map it onto a DTO; `[]` counts as an empty object.
    - `PATCH` is partial: only the keys present in the body are changed.
    - Deletes answer `200 {"ok": true}` (also logout and holiday calendars); only `DELETE /api/auth/change-email` and
      `DELETE /api/auth/oauth/{provider}` answer `204 No Content`. `DELETE /api/auth/webauthn/{id}` adds a fresh token pair
      to its `ok` body (it ends all sessions).

    ## Authentication

    - **Access token**: a JWT (RS256, 15 minutes, claim `email`, plus `uid` and `tv` = session version), sent as
      `Authorization: Bearer <token>`. Obtained from login, passkey sign-in, SSO, password change or refresh.
    - **Refresh token**: HMAC-signed JWT with `jti` and `fam` (session), stored server-side (table `refresh_token`),
      exchanged at `POST /api/auth/token` with a **form-encoded** body `grant_type=refresh_token&refresh_token=<token>`
      (OAuth 2.0 style). Every token is single-use and **rotated**: a refresh answers with a new access token AND a
      new refresh token of the same session. A token slides 7 days, but a session ends at the latest
      `REFRESH_TOKEN_ABSOLUTE_LIFETIME` (default 30 days) after login, however often it is refreshed. Presenting a token
      that was already rotated revokes the whole session (`401 invalid_refresh_token`), except within
      `REFRESH_TOKEN_REUSE_GRACE` seconds (default 10) after the rotation: such a retry (lost response, parallel
      tabs) gets a further token of the same session. Legacy tokens without `jti` (issued before rotation) are accepted
      exactly once (a replay is `401`) and replaced by a token of a new session; they are not tracked, so logout does not revoke them. `POST /api/auth/logout` revokes the session of one refresh token,
      `POST /api/auth/logout-all` all sessions of the user.
    - Both tokens die when the account's session version changes (password reset/change, e-mail change, passkey
      deletion, sign out everywhere, SSO takeover of an unconfirmed account): `401` on the next request / refresh. Passkey
      sign-in refuses accounts whose e-mail address is not confirmed; password login, registration, refresh and SSO
      give them a **restricted session** (see the e-mail verification gate).
    - **One-time login token**: `POST /api/auth/token` with `grant_type=one_time_token&token=<token>` returns the
      usual token pair. The token is the `code` of the SSO redirect (TTL env `OAUTH_LOGIN_CODE_TTL`, default 180 s);
      it is opaque, single use and bound to the user and the session version. The purposes are not interchangeable
      with any other signed token. The SSO code is also bound to the browser that started the flow (PKCE S256):
      the start request carries `code_challenge`, the redemption must send the matching `code_verifier`.
    - **E-mail verification gate**: a signed-in user whose address is not confirmed has a restricted session
      (`emailVerificationRequired: true` in every token response and in `GET /api/auth/me`) and gets
      `403 email_verification_required` (member `email`) on every `/api/*` route except `GET|PATCH|DELETE /api/auth/me`,
      `POST /api/auth/verify-email`, `POST /api/auth/resend-verification`, `GET|POST /api/auth/consents`,
      `/api/legal*`, `POST /api/auth/logout`, `/token`, `/delete-account/code`, `GET /api/auth/providers`,
      `GET /api/auth/registration`, `GET /api/health` and `/api/feed/*`. Only this session can confirm the address
      (it needs the JWT and the mailed code), so the mailbox owner cannot confirm an account someone else registered.
      The gate runs before the consent gate.
    - Every `/api/*` route except `/api/feed/*` passes the JWT firewall. A route marked "no authentication"
      still rejects an *invalid* `Authorization` header with 401 (send none instead).
    - Authorization: club routes require club membership, calendar routes membership in the calendar's club
      (403 otherwise). Members have one of four **roles** (`member` < `viewer` < `editor` < `admin`, each includes the
      lower ones). Authorization is deny-by-default: a plain *member* belongs to the club but is not staff, so every
      club- or calendar-scoped route is 403 `forbidden` for them except the allow-list `GET /api/auth/me`,
      `GET /api/clubs` (minimal entries: `id`, `name`, `timezone`, `role`), `GET /api/clubs/{clubId}` (same minimal
      fields) and leaving the club; a new route is staff-only unless it is allow-listed on purpose. *Viewer* (the lowest
      staff role) reads (club, calendars, events, reference data, members, `events.ics`, `events.pdf`); *editor* also
      creates, changes and deletes events, series, templates, locations, badges (properties), extras (features), audiences (target groups) and
      holiday calendars (import, bulk and series included) and reads the feeds of the club (their addresses
      and secrets); *admin* also changes and deletes the club, creates/changes/archives/duplicates/deletes
      calendars, manages feeds, invitations, members and roles. A role too low is 403 (`Forbidden`). Anyone, a plain member and a viewer included, may
      leave a club (`DELETE …/members/{ownId}`). A club never has zero members or zero admins: the last admin can
      neither be demoted, removed nor leave (`422 last_admin`) and cannot delete the account
      (`422 last_admin_of_club`) while other members remain. Writes to an **archived** calendar are 403 (reads
      stay possible). Locations and audiences (target groups) belong to the club
      (`/api/clubs/{clubId}/…`, shared by all its calendars): reads need membership, writes the editor role, and
      archiving a calendar does not block them. Their names are unique per club. Badges (properties) and extras (features) stay
      per calendar (`/api/calendars/{calendarId}/…`, names unique per calendar; writes to an archived calendar are 403).
    - **401** is always an RFC 7807 problem with `WWW-Authenticate: Bearer`. For the access token the code is
      `missing_token` (no `Authorization` header on a route that needs a user), `invalid_token` (malformed,
      wrong signature, ended session, user gone) or `token_expired`; the sign-in routes themselves answer
      `invalid_credentials` (login), `invalid_refresh_token` (`POST /api/auth/token`) or `invalid_passkey`.
      Clients may refresh on any 401 of a request that carried an access token.
    - **Consent gate**: a signed-in user who has not consented to the current privacy policy / terms of use
      (see `GET /api/legal`, `pendingConsents` of `GET /api/auth/me`) gets `403 consent_required` (+ `documents`)
      on every `/api/*` route except `GET|DELETE /api/auth/me`, `GET|POST /api/auth/consents`, `/api/legal*`,
      `POST /api/auth/logout`, `/logout-all`, `/token`, `/delete-account/code`, `GET /api/auth/providers`, `GET /api/auth/registration`,
      `GET /api/health` and `/api/feed/*`. Sign-in still returns tokens. Without any provided consent document
      nobody is gated. The gate applies only to sessions that STARTED without up-to-date consents: a new session
      (login, SSO/e-mail code, passkey, legacy refresh token) stores the flag `lc` (consent ok = no pending
      document) in its refresh-token family and access tokens; refresh rotation and re-issuance inside a running
      session (password change, passkey deletion) carry it over. A session that was compliant keeps working
      after a document update (the update reaches it at its next sign-in, at most 30 days later). A gated
      session passes as soon as the user consents (`POST /api/auth/consents`).
    - Every route under `/api/clubs`, `/api/calendars`, `/api/invitations`, `/api/map/geocode/` and `/api/mapbox/` needs a signed-in user before the
      id in the path is looked up: without a token it is `401 missing_token` (never 403 or 404, so ids cannot be
      probed). 403 means signed in but not allowed (no member, archived calendar).

    ### SSO (Google, Microsoft, Apple) - brief

    1. Sign-in: the browser navigates to `GET /api/auth/oauth/{provider}?code_challenge=<base64url SHA-256 of a
       random 32-byte verifier, 43 chars>` (the SPA keeps the verifier in `sessionStorage`; a missing or malformed
       challenge redirects to `?error=invalid_request`). The API sets a short-lived HttpOnly
       cookie `oauth_state_nonce` (path `/api/auth/oauth`, `Secure; SameSite=None`) and redirects to the
       provider with a signed, single-use `state`.
    2. The provider calls back `GET|POST /api/auth/oauth/{provider}/callback`; the API redirects to
       `{FRONTEND_URL}/auth/callback?code=<one-time code>` (redeemed at `POST /api/auth/token`, `grant_type=one_time_token`; no token in the URL) or `?error=<code>` with one of
       `invalid_request`, `invalid_state`, `provider_denied`, `provider_error`, `oauth_failed`, `email_missing`, `account_exists`,
       `email_unverified_at_provider`, `mfa_link_required` (the address belongs to an account with MFA: no
       automatic linking and no session; sign in with password and MFA and link the provider in the profile),
       `registration_restricted` (`RESTRICT_REGISTRATION`: a new account needs an open club
       invitation for the address; existing accounts and linking are not affected). A provider that does not prove the
       address (Microsoft) creates the account unverified and mails the 6-digit code; the redirect is the normal one
       (`?code=`), and the redeemed session is restricted until `POST /api/auth/verify-email`. An existing account is linked by e-mail only when the provider vouches
       for the address (`email_verified`, trusted for Google and Apple, never Microsoft).
    3. Linking while signed in: `POST …/{provider}/link-start` (JWT) → `{url}` (one-time ticket, 60 s) → the
       browser opens it (`GET …/{provider}/link?ticket=`) → provider → callback → redirect to
       `{FRONTEND_URL}/profile?link_provider=<p>&link_proof=<proof>` (or `?link_error=<code>`: `invalid_state`,
       `provider_denied`, `provider_error`, `oauth_failed`) → the signed-in frontend calls
       `POST …/{provider}/link-complete {proof}` (JWT). Only the user who started the flow can complete it.

    ### Passkeys (WebAuthn) - brief

    `POST …/webauthn/register/options` (JWT, re-authentication: `{password}` or, for accounts without a
    password, `{code}` mailed by `POST …/register/code`) or `GET …/webauthn/authenticate/options` returns
    `{options, challengeToken}`; the browser runs `navigator.credentials.create/get` with `options`; the result
    goes to `POST …/register/verify` or `POST …/authenticate/verify` together with the signed, single-use
    `challengeToken`. Allowed origin is `FRONTEND_URL`, RP ID `WEBAUTHN_RP_ID`. The authentication options need no
    e-mail (discoverable credentials, empty `allowCredentials`), so the same options serve the passkey button and
    browser autofill (`mediation: conditional`) on the sign-in page.

    ## Errors

    Errors are RFC 7807 `application/problem+json` bodies `{type, title, status, detail, code?, field?}`
    (schema `Problem`). `detail` is human-readable and **not** a contract; clients match the stable `code`
    (schema `ErrorCode`) and use `field` (path of the input, e.g. `name`, `rule.weekday`, `events[3].date`)
    to place the message. Every error of the API has this shape (also 401 of the JWT check, login 403, holiday
    calendars, the Mapbox proxy). Errors without a `code` are plain HTTP errors (403/404 of access checks,
    405, 502); **every 400 carries a code**: requests the framework rejects are `invalid_request`, and a query
    parameter sent as an array (`?name[]=x`) where a single value is expected is `400 validation_failed` with
    `field` = the parameter name, on every route.

    **Status of input errors** (`validation_failed`):

    - **400**: a malformed input value - missing, wrong JSON type, wrong format (date, time, id list), out of range,
      unknown IANA time zone, location coordinates (type, range, only one of both), times as half a pair. These
      are the typed input checks of all routes that read the body as a map and of all query parameters.
    - **422**: constraint violations of a request DTO (routes that map the body onto a DTO: register, login,
      forgot/reset password, change-password, change-email, create club, add member, create
      calendar, holiday calendar create/update), and well-formed values that conflict with stored state
      (a series rule without events, an e-mail change to the current
      address). Other 422 codes (`unknown_reference`, `duplicate_name`, `too_many_events`, `quota_exceeded`, `ics_fetch_failed`)
      are semantic as well.

    ## Feeds, visibility and robots rules

    A calendar feed (`CalendarFeed`) is published under `/api/feed/{feedId}/…` (web view JSON + ICS) with one
    of three states (`visibility`):

    | State | Access | Search engines |
    | --- | --- | --- |
    | `PUBLIC` | by link, no secret (a sent secret is ignored) | indexable |
    | `CLUB` ("Club-internal", **default** for new feeds) | club members and anyone with the link, no secret | never indexed |
    | `PRIVATE` | only with `?secret=<sharedSecret>` (403 without or with a wrong one, checked first) | never indexed |

    - `indexable` = `visibility == PUBLIC`. There is no separate search engine setting.
    - Every response of `/api/feed/*` (errors included) carries `Referrer-Policy: no-referrer` and
      `X-Robots-Tag: noindex`, **except** successful responses of an indexable feed, which carry no
      `X-Robots-Tag`. The header is set by the backend only (web server configs add nothing).
    - A feed shows the events of **all its selected calendars that are not archived**. An archived calendar
      drops out; when none is left (all archived) the feed is 404 (for `PRIVATE` only after a valid secret).
      Unknown feed: 404.
    - Switching a feed from `PUBLIC`/`CLUB` back to `PRIVATE` always generates a new secret.
    - Feeds only show published events (`isDraft: false`) and, if the feed has audiences (target groups), only events
      with one of them (the `targetGroupIds` query can narrow, never widen, that selection).

    ## Event series

    A series (`EventSeries`) is created with `POST /api/calendars/{id}/events/series` from a rule (`SeriesRule`):
    `weekly` / `biweekly` on one weekday, or `monthly` on the n-th (1-4, 5 = last) weekday; it ends `until` a
    date (inclusive) or after `count` events; `skipHolidays` leaves out dates touching a holiday of the
    calendar's holiday calendars. Dates are computed only by the backend. At most **366 events** per series
    (`422 too_many_events`).

    - `PATCH …/events/{id}` with `scope: "this"` (default) changes only that event (it stays in the series);
      `scope: "all"` applies the sent fields to every event of the series, except `date`, `dateEnd`,
      `eventTemplateId` and `externalUid` (each event keeps its own day).
    - `DELETE …/events/{id}?scope=this|all`: one event, or the whole series with its events. A series without
      events is removed automatically (also after bulk deletes).
    - Changing the rule later (`PATCH …/event-series/{seriesId}`) only touches **future** events (date ≥ today
      in the calendar's zone); past events stay. Preview it with `POST …/preview-update`.
    - ICS imports with `RRULE` create single events, never a series.

    ## Import and export limits

    - Import (`…/events/import/preview`, `…/events/import`): at most **5000 events** and 5000 new locations per
      request (`413 too_many_events`). The import is atomic (one transaction): one invalid entry saves nothing.
    - Bulk (`…/events/bulk`): at most **5000 ids** per request (`413 too_many_events`), all or nothing.
    - **Duplicates**: an entry is a duplicate of an existing event of the calendar with the same `externalUid`
      (ICS UID; the UID of our own export `event-<id>@club-calendar` matches that event), else with the same
      name (trimmed, case-insensitive, leading emoji icons ignored) and the same start date. Entries of the same
      request are not compared with each other.
    - Unknown time zones in an import fall back to the calendar's (else the club's) zone and are reported in
      `warnings` (`code: timezone_replaced`).
    - Member ICS export: `GET /api/calendars/{calendarId}/events.ics`, at most 100 `targetGroupIds`.
    - Member PDF export: `GET /api/calendars/{calendarId}/events.pdf`, `from`/`to` at most 366 days apart (400 on `to`), at most 2000 events (422 `too_many_events`, field `to`), 10 per user and 30 per client IP in 10 minutes (429 `rate_limited` + `Retry-After`).
    - Holiday feed fetch (`POST …/holiday-calendars`, `POST …/holiday-calendars/{hcId}/refresh`): 20 per user and hour (429 `rate_limited` + `Retry-After`), at most 3 redirects.

    ## MCP server and OAuth

    The app is a remote **MCP server** (Model Context Protocol, Streamable HTTP) with its own OAuth 2.1
    authorization server, so AI clients (Claude, ChatGPT, Gemini, ...) can read and draft calendar data on
    behalf of a signed-in user.

    **Discovery (not under `/api`, so not listed in `paths`; the web server must route them to PHP):**

    | Path | Document |
    | --- | --- |
    | `GET /.well-known/oauth-authorization-server` | RFC 8414 metadata: issuer = `APP_URL`; `authorization_endpoint`, `token_endpoint`, `registration_endpoint`, `revocation_endpoint` under `{BACKEND_URL}/api/oauth`; `code_challenge_methods_supported` `["S256"]`; `token_endpoint_auth_methods_supported` `["none"]`; `scopes_supported` |
    | `GET /.well-known/oauth-protected-resource` and `GET /.well-known/oauth-protected-resource/api/mcp` | RFC 9728 metadata: `resource` = `{APP_URL}/api/mcp` (canonical resource), `authorization_servers`, `scopes_supported`, `bearer_methods_supported` `["header"]` |

    Both are public JSON, cacheable for 5 minutes, and built only from `APP_URL` / `BACKEND_URL`.

    **Flow:** register (`POST /api/oauth/register`) -> `GET /api/oauth/authorize` (PKCE S256 only) redirects the
    browser to the SPA consent page -> the signed-in user allows or denies (`POST /api/oauth/authorize/decision`)
    -> the client redeems the single-use code (60 s) at `POST /api/oauth/token` -> calls `/api/mcp` with
    `Authorization: Bearer`. Only public clients, no client secrets. The `resource` parameter, if sent, must be the
    canonical MCP URL; tokens are bound to it.

    **Tokens:** opaque random 256-bit values, only the SHA-256 hash is stored. Access token 1 h
    (`MCP_ACCESS_TOKEN_TTL`); refresh token 7 days sliding (`MCP_REFRESH_TOKEN_LIFETIME`), absolute end
    `MCP_REFRESH_TOKEN_ABSOLUTE_LIFETIME` (30 days), single use and rotated with a reuse grace
    (`MCP_REFRESH_TOKEN_REUSE_GRACE`, 10 s); presenting a rotated token after the grace, or an authorization code
    twice, revokes the whole grant. MCP tokens are valid only on `/api/mcp`, normal JWTs never there. Token
    responses carry `Cache-Control: no-store`.

    **Scopes:** `mcp:read` (read tools) and `mcp:write` (draft and create tools; implies read). The scope is only
    the ceiling: every tool also checks the caller's **current** club role (viewer/editor/admin; a plain `member` is rejected by every tool and `list_clubs` leaves their clubs out).

    **Grants** (connected apps) end by user action (`DELETE /api/auth/mcp-grants/{id}`), by revocation
    (`POST /api/oauth/revoke`), and whenever the user's session version changes (sign out everywhere, password
    change/reset, e-mail change, passkey deletion, SSO takeover, account deletion).

    **Registration policy:** `MCP_ALLOWED_CLIENTS` (comma-separated families `claude`, `openai`, `gemini`;
    default all three; `*` alone = every client; empty = no client; `*` with other entries or unknown entries fail at boot) decides which redirect URIs may register and, re-checked on every authorization, which stored clients may start one. Always: `https`, or
    `http` on a loopback host; no fragment, userinfo or wildcard. The `client_name` is a self-declared claim: the consent page and the connected apps use a `label` derived from the stored family (claude: Claude, openai: ChatGPT, gemini: Gemini) and show the redirect host. A family match proves only the shape of the callback, not who runs the client.

    **MCP tools** (`tools/list` returns exactly these 22; all descriptions state that returned texts are untrusted
    data):

    | Tool | Scope | Role | Notes |
    | --- | --- | --- | --- |
    | `list_clubs` | read | viewer | clubs with the caller's role |
    | `list_calendars` | read | viewer | |
    | `list_events` | read | viewer | `from`/`to`/`q`/`limit`/`offset` with the caps of `GET …/events`; drafts only for editors |
    | `get_event` | read | viewer | drafts only for editors |
    | `list_target_groups`, `list_locations` | read | viewer | club-scoped |
    | `list_properties`, `list_features` | read | viewer | calendar-scoped |
    | `list_event_templates`, `get_event_template` | read | viewer | |
    | `list_feeds`, `get_feed` | read | editor | include the shared secret |
    | `create_event_draft` | write | editor | always a draft; calendar not archived; no series |
    | `update_event_draft` | write | editor | only events that are still drafts (else `event_not_draft`); stays a draft; only this event |
    | `create_target_group`, `create_location` | write | editor | club-scoped |
    | `create_property`, `create_feature` | write | editor | calendar-scoped, calendar not archived |
    | `create_event_template`, `update_event_template`, `delete_event_template` | write | editor | calendar not archived |
    | `create_feed` | write | admin | visibility `CLUB` (default) or `PRIVATE`; `PUBLIC` is refused |

    **Deliberately not available:** deleting or publishing events, series, import, bulk actions, updating or
    deleting target groups, properties, features and locations, updating or deleting feeds, public feeds, and
    everything about members, invitations, accounts and clubs.

    **Errors:** OAuth endpoints answer RFC 6749/7591 bodies (`error`, `error_description`, `no-store`); the consent
    API and `/api/mcp` answer problem+json (`authorization_request_not_found`, `mcp_grant_not_found`,
    `consent_required`, `email_not_verified`, `rate_limited`, `quota_exceeded`, `missing_token`,
    `invalid_token`). Tool failures are MCP tool errors carrying the stable `code` and `detail` of the underlying
    service (e.g. `forbidden`, `validation_failed`, `quota_exceeded`, `event_not_draft`). Rate limits: 120 requests
    per minute per client IP and per grant on `/api/mcp`; 10 registrations per IP and hour; 30 consent decisions
    per user and hour.

    **Browsers:** CORS allows only `FRONTEND_URL`; MCP clients running in a browser on another origin are not
    supported (server-side connectors and CLIs are).

    ## Quotas and input limits

    Per-account growth is bounded (security audit M7; constants in `App\Service\Quota`, generous on purpose).
    A write that would exceed one answers **422 `quota_exceeded`** with the members `resource` (the name below)
    and `limit`; nothing is written. Counts are checked before the write, so parallel requests may overshoot by
    one batch.

    | `resource` | Limit |
    | --- | --- |
    | `clubsPerUser` | 50 clubs a user is a member of (create club) |
    | `calendarsPerClub` | 100 calendars per club (create, duplicate; archived ones count) |
    | `membersPerClub` | 5000 members per club in total (also checked when an invitation is accepted) |
    | `staffPerClub` | 500 members with a staff role (viewer, editor, admin) per club; checked when a staff invitation is accepted and when a `member` is promoted |
    | `pendingInvitationsPerClub` | 200 open (pending or expired, not yet answered) invitations per club |
    | `eventsPerCalendar` | 20000 events per calendar (create, from-template, series create/rule change, import) |
    | `locationsPerClub` | 2000 locations per club (also those an import creates) |
    | `templatesPerCalendar` / `propertiesPerCalendar` / `featuresPerCalendar` | 500 each per calendar |
    | `targetGroupsPerClub` | 500 target groups per club |
    | `feedsPerClub` | 50 feeds per club |
    | `feedMembersPerFeed` | 5000 people with stored access per feed (assign, claim) |
    | `holidayCalendarsPerCalendar` | 20 holiday calendars |
    | `mcpClientsPerUser` | 20 connected apps (MCP grants) per user (consent decision) |

    OAuth client registration (`POST /api/oauth/register`): 10 per client IP and hour, at most 5 redirect URIs
    (2048 characters each), `client_name` at most 100 characters (RFC 7591 errors, not `quota_exceeded`). Unused
    clients are pruned by `app:prune-oauth`.

    Notes: `note` of events and templates at most 2000 characters (422 `validation_failed`, field `note`).

    Further limits: an id list field (`propertyIds`, `featureIds`, `targetGroupIds`, also the `targetGroupIds`
    query of the event list) has at most 500 ids (400 `validation_failed`); `from-template` takes at most 366
    `dates` (422 `too_many_events`, field `dates`); a holiday ICS is read at most 1 MB and 5000 events (else
    `ics_fetch_failed`). Strings have maximum lengths (255, or 100/32/20 for short fields; 400 `validation_failed`).
    The public feed is bounded by the event quota (one constant number of queries per request).
  contact:
    name: Club Calendar
servers:
  - url: http://localhost:3001
    description: Local backend (`symfony serve --port=3001`)
  - url: '{appUrl}'
    description: Deployed app (SPA and API share one origin)
    variables:
      appUrl:
        default: https://example.org
tags:
  - name: Health
    description: Liveness check.
  - name: Auth
    description: Registration, sign-in, tokens, account.
  - name: Legal
    description: Imprint, privacy policy and terms of use (public) and the users' consents.
  - name: OAuth
    description: >-
      OAuth 2.1 authorization server and remote MCP server (`/api/mcp`) for AI clients (public clients, PKCE S256,
      dynamic registration). See "MCP server and OAuth" in the API description.
  - name: Passkeys
    description: WebAuthn registration and sign-in.
  - name: Multi-factor authentication (MFA)
    description: >-
      MFA of the password sign-in (authenticator app, backup codes, passkey) and its management. The
      sign-in routes are public and use the signed `mfaToken` from `POST /api/auth/login` as credential.
  - name: SSO
    description: OAuth 2.0 / OpenID Connect sign-in and account linking (browser redirects).
  - name: Clubs
    description: Clubs, their members and their invitations.
  - name: Invitations
    description: Club invitations of the signed-in user (list, accept, decline); club members manage them under Clubs.
  - name: Calendars
    description: 'Calendars of a club (create, archive, duplicate).'
  - name: Events
    description: Events of a calendar, bulk actions.
  - name: Event series
    description: Recurring events (rule, preview, change).
  - name: Import & export
    description: Event import (JSON) and ICS export.
  - name: Event templates
    description: Reusable event definitions.
  - name: Properties
    description: Badges (properties) of events, with an emoji icon.
  - name: Features
    description: Extras (features), optional add-ons of events.
  - name: Target groups
    description: Audiences (target groups), audience filters of events and feeds.
  - name: Locations
    description: Venues with address and map position.
  - name: Feeds
    description: Feed management (admins; editors may read).
  - name: Public feed
    description: Published feeds (no authentication; `?secret=` for private feeds).
  - name: Holidays
    description: External holiday calendars (ICS) and their holidays.
  - name: Maps
    description: Geocoding, static map images and the Mapbox proxy.
security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------------ Health
  /api/health:
    get:
      tags: [Health]
      summary: Liveness check
      operationId: health
      security: []
      responses:
        '200':
          description: The application is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  # ------------------------------------------------------------------ Legal
  /api/oauth/register:
    post:
      tags: [OAuth]
      summary: Register an OAuth client (RFC 7591)
      description: >-
        Public clients only (`token_endpoint_auth_method` none). Redirect URIs must match an allowed client family
        (`MCP_ALLOWED_CLIENTS`; `*` = any https/loopback URI, empty = nothing). At most 5 redirect URIs, `client_name` at most 100
        characters. 10 registrations per client IP and hour. Errors are RFC 7591 bodies
        (`error`, `error_description`) with `Cache-Control: no-store`.
      operationId: registerOAuthClient
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uris]
              properties:
                client_name: { type: string, maxLength: 100 }
                redirect_uris: { type: array, minItems: 1, maxItems: 5, items: { type: string, maxLength: 2048 } }
                token_endpoint_auth_method: { type: string, enum: [none] }
                grant_types: { type: array, items: { type: string, enum: [authorization_code, refresh_token] } }
                response_types: { type: array, items: { type: string, enum: [code] } }
                scope: { type: string, description: 'Space-separated `mcp:read` / `mcp:write`.' }
      responses:
        '201':
          description: Registered client.
          content:
            application/json:
              schema:
                type: object
                required: [client_id, client_id_issued_at, client_name, redirect_uris, token_endpoint_auth_method, grant_types, response_types]
                properties:
                  client_id: { type: string }
                  client_id_issued_at: { type: integer }
                  client_name: { type: string }
                  redirect_uris: { type: array, items: { type: string } }
                  token_endpoint_auth_method: { type: string, enum: [none] }
                  grant_types: { type: array, items: { type: string } }
                  response_types: { type: array, items: { type: string } }
                  scope: { type: string }
        '400':
          description: '`invalid_redirect_uri` or `invalid_client_metadata`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/oauth/token:
    post:
      tags: [OAuth]
      summary: Token endpoint (RFC 6749)
      description: >-
        Form-encoded. `grant_type` `authorization_code` (`code`, `redirect_uri`, `code_verifier`) or `refresh_token`
        (`refresh_token`, single use, rotated); `client_id` is required, `resource` (if sent) must be the MCP URL.
        Errors are RFC 6749 bodies; an unknown client is 401 `invalid_client`. Never cacheable. Limited to 60 requests per minute per client IP (shared with `/api/oauth/revoke`; 429 `rate_limited` + `Retry-After`).
      operationId: oauthToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token] }
                client_id: { type: string }
                code: { type: string }
                redirect_uri: { type: string }
                code_verifier: { type: string }
                refresh_token: { type: string }
                resource: { type: string }
      responses:
        '200':
          description: Token pair.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, refresh_token, scope]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer }
                  refresh_token: { type: string }
                  scope: { type: string }
        '400':
          description: '`invalid_request`, `invalid_grant`, `invalid_target`, `unsupported_grant_type`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: '`invalid_client`: unknown `client_id`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/oauth/revoke:
    post:
      tags: [OAuth]
      summary: Revoke a token (RFC 7009)
      description: >-
        Form-encoded `token` (access or refresh token), optional `token_type_hint` and `client_id`. Revokes the whole
        grant. 200 with an empty body for any token, known or not.
      operationId: oauthRevoke
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                token_type_hint: { type: string, enum: [access_token, refresh_token] }
                client_id: { type: string }
      responses:
        '200': { description: Done (also for unknown tokens). }
        '400':
          description: '`invalid_request` (no token) or `unsupported_token_type`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/oauth/authorize:
    get:
      tags: [OAuth]
      summary: Authorization endpoint (code flow with PKCE S256)
      description: >-
        Query: `client_id`, `redirect_uri` (registered), `response_type=code`, `code_challenge`,
        `code_challenge_method=S256`, optional `scope` (default `mcp:read`), `state`, `resource`. Always answers 302:
        to the SPA consent page `{FRONTEND_URL}/oauth/consent?request=<id>`, or, for errors other than
        `client_id` / `redirect_uri`, to the verified redirect URI with `error`, `error_description` and `state`.
        An unknown `client_id` or an unregistered `redirect_uri` is never redirected: `400 invalid_request`
        (field `client_id` / `redirect_uri`).
      operationId: oauthAuthorize
      security: []
      responses:
        '302': { description: 'Redirect to the consent page or (error) to the client. The redirect to the consent page sets the HttpOnly cookie `oauth_consent_<requestId>` (SameSite=Lax, path `/api/oauth`, Secure on HTTPS, lifetime 10 minutes) that binds the request to this browser.' }
        '400':
          description: '`invalid_request` for `client_id` / `redirect_uri`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/oauth/authorization-request/{id}:
    get:
      tags: [OAuth]
      summary: Authorization request for the consent page
      description: >-
        Valid 10 minutes, single use. Needs a signed-in user AND the browser that started the flow: the cookie
        `oauth_consent_<id>` set by the authorize redirect must be sent (SPA on another origin: `credentials: include`,
        the exact `FRONTEND_URL` is allowed with credentials on this route only; cookies are same-site only).
      operationId: oauthAuthorizationRequest
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema:
                type: object
                required: [id, label, claimedName, redirectHost, family, callbackRisk, scopes, createdAt, expiresAt]
                properties:
                  id: { type: string }
                  label: { type: [string, 'null'], description: 'Derived from the family (Claude, ChatGPT, Gemini); null = unverified app.' }
                  claimedName: { type: string, description: 'Self-declared client name: an unverified claim, never an identity.' }
                  redirectHost: { type: string }
                  family: { type: [string, 'null'], description: 'Matched client family (claude, openai, ...); null = unverified.' }
                  callbackRisk: { type: [string, 'null'], enum: [loopback, connector, null], description: 'Callback a third party can own: loopback or a chatgpt.com connector id.' }
                  scopes: { type: array, items: { type: string, enum: ['mcp:read', 'mcp:write'] } }
                  createdAt: { type: string, format: date-time }
                  expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`authorization_request_not_found`: unknown, expired, already answered, started in another browser (cookie missing or wrong) or created before the binding existed. All identical; a failed check leaves the request untouched.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/oauth/authorize/decision:
    post:
      tags: [OAuth]
      summary: Allow or deny an authorization request
      description: >-
        Approving needs consent to the current legal documents (`403 consent_required`), a confirmed e-mail address
        (`403 email_not_verified`) and room in the quota of connected apps (`422 quota_exceeded`); a new grant
        replaces the user's open grant of the same client. 30 decisions per user and hour. The SPA navigates the
        browser to `redirectUrl`. Needs the binding cookie like the authorization-request route (404
        `authorization_request_not_found` without it, the request stays); a successful decision clears the cookie.
      operationId: oauthDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, approve]
              properties:
                requestId: { type: string }
                approve: { type: boolean }
      responses:
        '200':
          description: Where to send the browser (`code` + `state`, or `error=access_denied` + `state`).
          content:
            application/json:
              schema:
                type: object
                required: [redirectUrl]
                properties:
                  redirectUrl: { type: string }
        '400': { description: '`invalid_request`: body incomplete.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: '`consent_required` or `email_not_verified`.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: '`authorization_request_not_found`.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: '`quota_exceeded`.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/mcp:
    post:
      tags: [OAuth]
      summary: MCP endpoint (Streamable HTTP)
      description: >-
        Model Context Protocol server (JSON-RPC over Streamable HTTP; `GET` opens the optional event stream, `DELETE`
        ends a session, `OPTIONS` is the unauthenticated preflight). Authenticated only by the opaque OAuth access
        tokens of the MCP server (`Authorization: Bearer`), never by the normal JWTs, and these tokens are valid
        nowhere else. A missing or bad token is `401` with `WWW-Authenticate: Bearer [error="invalid_token", ]resource_metadata="{BACKEND_URL}/.well-known/oauth-protected-resource/api/mcp"`
        (`missing_token` / `invalid_token`). After authentication: `429 rate_limited` (per client IP and per grant),
        `403 consent_required` (current legal documents), `403 email_not_verified`. `Origin` / `Host` must be one
        of the trusted hosts (`403` from the MCP transport otherwise). Tools check the scope and the caller's current
        club role on every call.
      operationId: mcpEndpoint
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, description: A JSON-RPC 2.0 message. }
      responses:
        '200': { description: JSON-RPC response (JSON or event stream). }
        '202': { description: Notification accepted. }
        '401':
          description: Missing or invalid MCP access token.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Consent or e-mail confirmation missing, or a forbidden `Origin`/`Host`.
        '429':
          description: Rate limit.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [OAuth]
      summary: MCP event stream
      operationId: mcpStream
      security: []
      responses:
        '200': { description: Server-sent events. }
        '401': { description: Missing or invalid MCP access token. }
    delete:
      tags: [OAuth]
      summary: End an MCP session
      operationId: mcpEndSession
      security: []
      responses:
        '200': { description: Session ended. }
        '401': { description: Missing or invalid MCP access token. }
    options:
      tags: [OAuth]
      summary: MCP preflight
      operationId: mcpPreflight
      security: []
      responses:
        '204': { description: 'Preflight, no authentication.' }

  /api/auth/mcp-grants:
    get:
      tags: [Auth]
      summary: Connected apps (MCP clients) of the user
      description: Open grants only (not revoked, not expired), newest first.
      operationId: listMcpGrants
      responses:
        '200':
          description: The grants.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, label, claimedName, redirectHost, family, scopes, createdAt, lastUsedAt]
                  properties:
                    id: { type: string }
                    label: { type: [string, 'null'] }
                    claimedName: { type: string }
                    redirectHost: { type: string }
                    family: { type: [string, 'null'] }
                    scopes: { type: array, items: { type: string } }
                    createdAt: { type: string, format: date-time }
                    lastUsedAt: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/mcp-grants/{id}:
    delete:
      tags: [Auth]
      summary: Disconnect an app
      description: Deletes the grant with all its tokens. Own grants only.
      operationId: deleteMcpGrant
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Disconnected. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: '`mcp_grant_not_found`.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /api/legal:
    get:
      tags: [Legal]
      summary: Current legal documents
      description: >-
        The current version of each document (`null` = not provided). A document is either Markdown (`url` null) or
        an external link (`url` set, see `LEGAL_*` env vars: a Markdown file wins over a link; a link is ONE version,
        so changing its URL does not ask for consent again). `Cache-Control: public, max-age=60`.
      operationId: listLegal
      security: []
      responses:
        '200':
          description: One entry per document type.
          content:
            application/json:
              schema:
                type: object
                required: [imprint, privacy, terms]
                properties:
                  imprint: { oneOf: [{ $ref: '#/components/schemas/LegalDocumentSummary' }, { type: 'null' }] }
                  privacy: { oneOf: [{ $ref: '#/components/schemas/LegalDocumentSummary' }, { type: 'null' }] }
                  terms: { oneOf: [{ $ref: '#/components/schemas/LegalDocumentSummary' }, { type: 'null' }] }

  /api/legal/{type}:
    get:
      tags: [Legal]
      summary: Current document of a type
      operationId: getLegalDocument
      security: []
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [imprint, privacy, terms] } }
      responses:
        '200':
          description: The current document (HTML rendered from Markdown by the server).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocument' }
        '404': { $ref: '#/components/responses/LegalDocumentNotFound' }

  /api/legal/documents/{id}:
    get:
      tags: [Legal]
      summary: Any version of a document
      description: Also retired and superseded versions (needed to show what a user consented to). Public.
      operationId: getLegalDocumentVersion
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The document version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocument' }
        '404': { $ref: '#/components/responses/LegalDocumentNotFound' }

  # ------------------------------------------------------------------ Auth
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register with e-mail and password
      description: >-
        Creates an unconfirmed account and mails a 6-digit confirmation code (no link, valid 15 minutes). The response
        carries the usual token pair of a restricted session (`emailVerificationRequired: true`): only
        `POST /api/auth/verify-email` with that session confirms the address.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                email: { type: string, format: email, maxLength: 254 }
                password: { $ref: '#/components/schemas/Password' }
                feedProof:
                  type: object
                  required: [feedId]
                  properties:
                    feedId: { type: string, maxLength: 64 }
                    secret: { type: string, maxLength: 256 }
                  description: >-
                    Optional, read only with `RESTRICT_REGISTRATION=true`. Lifts the restriction when the feed exists, its
                    club currently lets new members in through the feed's visibility (setting `feedSignup`) and, for a
                    PRIVATE feed, the secret is right. An invalid, unknown or malformed proof behaves exactly like none
                    (no extra error, no hint about the feed). It does not join the club; joining stays a claim after
                    sign-in. A proof with a secret counts against the public feed rate limits.
                language: { type: [string, 'null'], examples: [de] }
                acceptedDocuments:
                  type: array
                  maxItems: 20
                  items: { type: string, maxLength: 36 }
                  description: >-
                    Ids of the accepted legal documents. The current document of every consent type that is provided
                    (privacy, terms) must be in the list. Stored as consents with IP address and user agent.
      responses:
        '201':
          description: Account created, confirmation code mailed.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/TokenResponse' }
                  - type: object
                    required: [verificationRequired, email]
                    properties:
                      verificationRequired: { type: boolean, const: true }
                      email: { type: string, format: email }
        '403':
          description: >-
            `registration_restricted` (field `email`): `RESTRICT_REGISTRATION` is set and the address has no open
            club invitation. Checked after the consent check and before `email_taken`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400':
          description: >-
            `email_taken` (field `email`), `invalid_request` (no JSON object) or `validation_failed` (field
            `acceptedDocuments`: unknown id, not a list, more than 20).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: >-
            `validation_failed`, or (checked before `email_taken`) `consent_required` (a current document is missing)
            / `consent_outdated` (an older version of a document was sent), field `acceptedDocuments`, member
            `documents` = the current documents to accept.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in with e-mail and password
      description: >-
        An account whose address is not confirmed gets a restricted session (`emailVerificationRequired: true`). If
        no valid code is waiting and the resend cooldown allows, a fresh code is mailed. An account with MFA
        on gets no tokens but a `MfaChallenge` (200): the sign-in is finished by one of the
        `/api/auth/mfa/*` sign-in routes (see "Multi-factor authentication (MFA)").
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Tokens, or the second-factor challenge of an account with MFA.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - $ref: '#/components/schemas/MfaChallenge'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401':
          description: '`invalid_credentials` (unknown address, wrong password or SSO-only account alike).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/identify:
    post:
      tags: [Auth]
      summary: Identify an address (first step of the e-mail-first sign-in)
      description: >-
        `status` is `login` (an account with this address exists, confirmed or not: the login flow gives an
        unconfirmed account a restricted session), `register` (no account, registration allowed, incl. a restricted setup with an
        open club invitation for the address) or `registration_restricted` (no account, `RESTRICT_REGISTRATION`
        and no open invitation). `email` is the normalized address. Accepted trade-off: this reveals whether an
        account exists; it is mitigated by rate limiting (30 per 15 minutes per client IP and 10 per 15 minutes
        per normalized address, `429 rate_limited`, checked before any database work).
      operationId: identify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                feedProof:
                  type: object
                  required: [feedId]
                  properties:
                    feedId: { type: string, maxLength: 64 }
                    secret: { type: string, maxLength: 256 }
                  description: >-
                    Optional, read only with `RESTRICT_REGISTRATION=true`. Lifts the restriction when the feed exists, its
                    club currently lets new members in through the feed's visibility (setting `feedSignup`) and, for a
                    PRIVATE feed, the secret is right. An invalid, unknown or malformed proof behaves exactly like none
                    (no extra error, no hint about the feed). It does not join the club; joining stays a claim after
                    sign-in. A proof with a secret counts against the public feed rate limits.
      responses:
        '200':
          description: The status of the address.
          content:
            application/json:
              schema:
                type: object
                required: [email, status]
                properties:
                  email: { type: string }
                  status: { type: string, enum: [login, register, registration_restricted] }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/resend-verification:
    post:
      tags: [Auth]
      summary: Send a new confirmation code
      description: >-
        For the signed-in user (the restricted session; no body). Mails a new code (the earlier ones die). Allowed
        when the last code mail of the ACCOUNT is at least 5 minutes old, else `429 verification_resend_too_early`
        with `retryAt` (ISO-8601 UTC) and `Retry-After`. Also limited to 25 requests per client IP and day
        (`429 rate_limited`), and per account to 10 codes and 20 wrong guesses per rolling 24 hours (`429 rate_limited`
        with `Retry-After`, no mail on any path, verify keeps answering `invalid_verification_code`). An already
        confirmed account answers 204 like success.
      operationId: resendVerification
      responses:
        '204': { description: 'Accepted: a code was mailed, or the address is already confirmed.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: >-
            `verification_resend_too_early` (body member `retryAt`, header `Retry-After` in seconds) or
            `rate_limited` (per IP and day, or the account's daily caps).
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Problem' }
                  - type: object
                    properties:
                      retryAt: { type: string, format: date-time, examples: ['2026-10-16T10:05:00Z'] }

  /api/auth/verify-email:
    post:
      tags: [Auth]
      summary: Confirm the e-mail address with the 6-digit code
      description: >-
        Needs the JWT of the user (the restricted session is allowed) and confirms THAT user's address with the code
        from the mail; the mailbox owner without a session cannot confirm an account that someone else registered.
        Marks the address confirmed and returns a fresh token pair in a new session (the restricted one ends). The
        code is valid 15 minutes, works once, a newer code invalidates it, and after 5 wrong attempts it is dead
        (request a new one). Every failure is the same `422 invalid_verification_code` (wrong, expired, used up or
        already confirmed). Whitespace in the code is ignored. Rate limited per client IP.
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, examples: ['048213'] }
      responses:
        '200':
          description: Confirmed; the new session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: '`invalid_verification_code` (field `code`), or `validation_failed` for a malformed body.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset link
      description: >-
        Always 204, whether or not the address has an account, and also over the rate limit (per address and per
        IP). The mail with `{FRONTEND_URL}/reset-password?token=…` (valid 60 minutes) is sent after the response.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 255 }
      responses:
        '204': { description: Accepted. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with a reset token
      description: Ends all sessions and confirms the address; SSO-only accounts get a password this way. A waiting e-mail change is discarded.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, maxLength: 255 }
                password: { $ref: '#/components/schemas/Password' }
      responses:
        '204': { description: Password set; the user signs in again. }
        '400':
          description: '`invalid_reset_token` (field `token`; unknown, used or expired alike) or `invalid_request`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Change the password
      description: Returns new tokens for the calling session; all other sessions end. A notice mail goes to the account.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, maxLength: 4096 }
                newPassword: { $ref: '#/components/schemas/Password' }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400':
          description: '`invalid_credentials` (field `currentPassword`) or `invalid_request`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`no_password`: SSO-only account (set a password via forgot-password first).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/auth/change-email:
    post:
      tags: [Auth]
      summary: Request an e-mail address change
      description: >-
        204 whether or not the new address is free (no oracle). A confirmation link goes to the new address only if
        it is free and the rate limit allows; a notice goes to the current address. The change completes with
        `GET /api/auth/verify-new-email`.
      operationId: requestEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 255 }
                password: { type: [string, 'null'], maxLength: 4096, description: Current password. }
      responses:
        '204': { description: Accepted. }
        '400':
          description: '`invalid_credentials` (field `password`) or `invalid_request`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`no_password`: SSO-only account.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`validation_failed` (field `email`, also when it is already the current address).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Auth]
      summary: Cancel a waiting e-mail change
      operationId: cancelEmailChange
      responses:
        '204': { description: Cancelled (also when nothing was waiting). }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/verify-new-email:
    get:
      tags: [Auth]
      summary: Confirm a new e-mail address (link from the mail)
      description: Ends all sessions on success.
      operationId: verifyNewEmail
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          description: >-
            Redirect to `{FRONTEND_URL}/auth/verify-email?status=email_changed` or
            `?status=error&reason=invalid|expired|already_used|email_taken&flow=email_change`.
          headers:
            Location: { $ref: '#/components/headers/Location' }

  /api/auth/token:
    post:
      tags: [Auth]
      summary: Refresh the tokens
      description: >-
        OAuth 2.0 style refresh with a **form-encoded** body. Returns a new access AND refresh token (rotation: the
        presented refresh token is used up; see Authentication for reuse detection, the grace window and the absolute
        session lifetime).
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - type: object
                  required: [grant_type, refresh_token]
                  properties:
                    grant_type: { type: string, const: refresh_token }
                    refresh_token: { type: string }
                - type: object
                  description: >-
                    One-time login token (the `code` of the SSO redirect): single use, expires after its own
                    TTL, bound to the user's session version; answers like a login.
                  required: [grant_type, token]
                  properties:
                    grant_type: { type: string, const: one_time_token }
                    token: { type: string }
                    code_verifier:
                      type: string
                      description: >-
                        Verifier whose S256 hash is the `code_challenge` of the start request. Required for the
                        SSO code; a missing or wrong one consumes the code (`invalid_code_verifier`).
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400':
          description: >-
            `invalid_grant`: unknown `grant_type`, token missing, or (`one_time_token`) the token is invalid,
            expired, used before or for a user whose sessions ended. `invalid_code_verifier`: (`one_time_token`)
            the `code_verifier` is missing or does not match the challenge of the flow (login started in another
            browser); the code is consumed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: '`invalid_refresh_token`: invalid, expired, unknown, revoked (logout, reuse), session lifetime over, user gone or sessions ended.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out (end the session of a refresh token)
      description: >-
        Revokes the session (all tokens of the family) of the refresh token in the body. Idempotent and uniform: always
        `200 {"ok": true}`, also for an unknown, expired, already revoked or malformed token, a missing token or a
        body that is not JSON (no oracle). Other sessions stay; access tokens stay valid until they expire. No
        authentication needed; clients leave out the access token (an expired one would be answered with 401).
      operationId: logout
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/logout-all:
    post:
      tags: [Auth]
      summary: Sign out everywhere
      description: >-
        Ends all sessions of the user: the session version is raised (every access token, including the caller's,
        stops working) and all refresh tokens are revoked. The caller signs in again.
      operationId: logoutAll
      responses:
        '204': { description: All sessions ended. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/consents:
    get:
      tags: [Legal]
      summary: Own consent history
      description: >-
        All consents of the signed-in user, newest first. IP address and user agent are included (the user's own data).
      operationId: listConsents
      responses:
        '200':
          description: The consents.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Consent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Legal]
      summary: Give consent
      description: >-
        Records one consent per document id (with IP address and user agent). Every id must be a CURRENT privacy or
        terms document; ids already consented to are ignored (no duplicate).
      operationId: giveConsents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentIds]
              properties:
                documentIds: { type: array, minItems: 1, maxItems: 20, items: { type: string, maxLength: 36 } }
      responses:
        '200':
          description: The updated user (`pendingConsents`, `consentRequired`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: '`consent_outdated`: an id is not a current consent document; `documents` = the current documents still pending.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: The signed-in user
      operationId: getMe
      responses:
        '200':
          description: Profile, sign-in methods, preferences and pending consents.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Auth]
      summary: Update name and preferences
      description: >-
        `lastClubId` must be a club the user is a member of; `lastCalendarId` must belong to such a club (and to
        `lastClubId` when both are sent); otherwise `422 unknown_reference` with the `field` and nothing is stored.
        `lastCalendarId` is also remembered at the membership of the calendar's club. A field of the wrong
        JSON type (`dateFormat: 5`, `firstDayOfWeek: "1"` / `1.5` / `true`, `language: null`, `lastClubId: 5`,
        `lastCalendarId: ["x"]`, …) is a 400 `validation_failed` with the `field`; `null` is accepted only for
        `lastClubId` / `lastCalendarId` (clears them). `name` of the wrong type stays a 422.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                dateFormat: { type: string, minLength: 1, maxLength: 20, examples: [dd.MM.yyyy] }
                firstDayOfWeek: { type: integer, minimum: 0, maximum: 6, description: 0 = Sunday. }
                language: { type: string, enum: [en, de] }
                lastClubId: { type: [string, 'null'], maxLength: 36 }
                lastCalendarId: { type: [string, 'null'], maxLength: 36 }
      responses:
        '200':
          description: The updated user (same body as `GET /api/auth/me`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Auth]
      summary: Delete the account
      description: >-
        Needs re-authentication (AUTH-03): an account with a password sends `password`; an account without one
        (SSO-only, passkey-only) sends the 6-digit `code` that `POST /api/auth/delete-account/code` mailed to its
        address. Every attempt counts against 5 per 15 minutes per user (and the per-IP limit): `429 rate_limited`.
        Nothing is deleted before the proof is valid. Then refused with `422 last_member_of_club` while the user is
        the only member of a club (no club is named): delete that club first (`DELETE /api/clubs/{clubId}`) or add
        another member.
      operationId: deleteMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: [string, 'null'], maxLength: 4096, description: Current password (accounts with a password). }
                code: { type: [string, 'null'], maxLength: 32, description: Mailed 6-digit code (accounts without a password). }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400':
          description: >-
            `invalid_credentials` (field `password`: missing or wrong) for an account with a password;
            `invalid_confirmation_code` (field `code`: missing, wrong, expired or of another account) for one without.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: "`last_member_of_club` or `last_admin_of_club` (the only admin of a club that has other members)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: '`rate_limited` (header `Retry-After`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/auth/delete-account/code:
    post:
      tags: [Auth]
      summary: Mail the confirmation code for the account deletion
      description: >-
        Only for accounts without a password. The code is derived from the user, the session version, the address
        and a 10-minute window (nothing is stored): it is valid for 10 to 20 minutes, repeated requests mail the same
        code within a window, and it ends with a password set, a sign-out of all sessions or an address change.
        At most 5 mails per user and hour.
      operationId: sendDeleteAccountCode
      responses:
        '204': { description: The code went to the account's address. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`has_password`: the account has a password, confirm with it.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: '`rate_limited` (header `Retry-After`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/auth/registration:
    get:
      tags: [Auth]
      summary: Whether registration is restricted
      description: >-
        `restricted` is true when `RESTRICT_REGISTRATION` is set: only e-mail addresses with an open club invitation
        (pending, not expired) may create an account, by password or by a first SSO sign-in.
      operationId: getRegistrationPolicy
      security: []
      responses:
        '200':
          description: The registration policy.
          content:
            application/json:
              schema:
                type: object
                required: [restricted, clubCreationAllowed]
                properties:
                  restricted: { type: boolean }
                  clubCreationAllowed:
                    type: boolean
                    description: >-
                      Whether the API creates clubs for signed-in users: true unless `RESTRICT_CLUB_CREATION` is set;
                      then true only for the bootstrap (`RESTRICT_REGISTRATION` set and no club exists yet).

  /api/auth/providers:
    get:
      tags: [SSO]
      summary: Configured SSO providers
      description: Only providers with client id and secret configured are listed.
      operationId: listProviders
      security: []
      responses:
        '200':
          description: Providers for the sign-in buttons.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, icon]
                  properties:
                    id: { type: string, examples: [google] }
                    name: { type: string, examples: [Google] }
                    icon: { type: string, examples: [google] }

  # ------------------------------------------------------------------ Passkeys
  /api/auth/webauthn/register/options:
    post:
      tags: [Passkeys]
      summary: Options to register a passkey (needs re-authentication)
      description: >-
        The account proves itself first: `{password}` for an account with a password, `{code}` (6 digits, mailed by
        `POST …/register/code`) for one without. Only then the options and the signed, single-use challenge token
        are issued; `…/register/verify` is impossible without that token. A deletion code is not valid here (the
        code is bound to its purpose). Every attempt counts: 5 per 15 minutes per user, plus the per-IP limit.
      operationId: passkeyRegistrationOptions
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, maxLength: 4096 }
                code: { type: string, maxLength: 32 }
      responses:
        '200':
          description: '`PublicKeyCredentialCreationOptions` (JSON, base64url) and the signed challenge token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnOptions' }
        '400':
          description: '`invalid_credentials` (password missing or wrong, field `password`), `invalid_confirmation_code` (field `code`), `invalid_request`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/webauthn/register/code:
    post:
      tags: [Passkeys]
      summary: Mail the confirmation code for passkey registration
      description: >-
        Only for accounts without a password. Same derived, stateless code as for the account deletion but bound to
        the passkey purpose (10 to 20 minutes). At most 5 mails per user and hour.
      operationId: sendPasskeyRegistrationCode
      responses:
        '204': { description: The code went to the account's address. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`has_password`: the account has a password, confirm with it.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: '`rate_limited` (header `Retry-After`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/auth/webauthn/register/verify:
    post:
      tags: [Passkeys]
      summary: Register a passkey
      description: Returns the id of the new passkey (for `PATCH …/webauthn/{id}`, e.g. to name it).
      operationId: passkeyRegistrationVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, response]
              properties:
                challengeToken: { type: string }
                response: { type: object, description: The `PublicKeyCredential` (attestation) as JSON. }
                deviceName: { type: [string, 'null'], maxLength: 255 }
      responses:
        '200':
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                required: [ok, id]
                properties:
                  ok: { type: boolean, const: true }
                  id: { type: string, description: Id of the new passkey. }
              example: { ok: true, id: ckx1passkey0000000000000001 }
        '400':
          description: '`invalid_request` (body incomplete), `invalid_passkey_registration`, `passkey_already_registered`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/webauthn/authenticate/options:
    get:
      tags: [Passkeys]
      summary: Options to sign in with a passkey
      operationId: passkeyAuthenticationOptions
      security: []
      responses:
        '200':
          description: '`PublicKeyCredentialRequestOptions` (discoverable credentials, empty `allowCredentials`) and the challenge token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnOptions' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/webauthn/authenticate/verify:
    post:
      tags: [Passkeys]
      summary: Sign in with a passkey
      operationId: passkeyAuthenticationVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, response]
              properties:
                challengeToken: { type: string }
                response: { type: object, description: The `PublicKeyCredential` (assertion) as JSON. }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401':
          description: '`invalid_passkey`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/mfa/verify:
    post:
      tags: [Multi-factor authentication (MFA)]
      summary: Finish a password sign-in with an authenticator app or a backup code
      description: >-
        Public: the signed `mfaToken` of the challenge is the credential (valid 5 minutes, single use, consumed only by
        a successful second factor). A backup code is single use too; MFA stays on and other sessions
        stay, the answer carries `backupCodeUsed: true` and `backupCodesRemaining` and the user is mailed (the app can then offer
        `POST /api/auth/sessions/sign-out-others`). Every attempt counts against 5 per 15 minutes per token and 20 per 15 minutes
        per IP; failed factor checks also count in an exact per-account budget of 5 per 15 minutes (not reset by a success):
        once used up, further attempts get 429 `rate_limited` with `Retry-After` without any code being checked.
      operationId: mfaVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaToken, method, code]
              properties:
                mfaToken: { type: string }
                method: { type: string, enum: [totp, backup_code] }
                code: { type: string, description: '6-digit code of the authenticator app, or a backup code.' }
      responses:
        '200':
          description: The token pair of the sign-in (plus `backupCodeUsed` and `backupCodesRemaining` after a backup code).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - type: object
                    properties:
                      backupCodeUsed: { type: boolean, const: true, description: 'Only after a backup code.' }
                      backupCodesRemaining: { type: integer, minimum: 0, description: 'Only after a backup code: unused backup codes left.' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401':
          description: '`invalid_mfa_token` (challenge expired, used or invalid) or `invalid_mfa_code` (field `code`: wrong or used code; the same answer for an authenticator code and a backup code).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/mfa/passkey/options:
    post:
      tags: [Multi-factor authentication (MFA)]
      summary: Options to finish a sign-in with a passkey
      description: >-
        Public: needs the signed `mfaToken` of the challenge. Only the passkeys of that account are offered. Answers
        `400 invalid_request` when the account has no passkey.
      operationId: mfaPasskeyOptions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaToken]
              properties:
                mfaToken: { type: string }
      responses:
        '200':
          description: '`PublicKeyCredentialRequestOptions` and the challenge token for `POST /api/auth/mfa/passkey/verify`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnOptions' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401':
          description: '`invalid_mfa_token`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/mfa/passkey/verify:
    post:
      tags: [Multi-factor authentication (MFA)]
      summary: Finish a sign-in with a passkey
      description: >-
        Public: the signed `mfaToken` of the challenge and the challenge token of the options are the credentials.
      operationId: mfaPasskeyVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaToken, challengeToken, response]
              properties:
                mfaToken: { type: string }
                challengeToken: { type: string }
                response: { type: object, description: The `PublicKeyCredential` (assertion) as JSON. }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401':
          description: '`invalid_mfa_token` (challenge of the sign-in) or `invalid_passkey` (assertion or challenge token wrong or used).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/mfa/setup:
    post:
      tags: [Multi-factor authentication (MFA)]
      summary: Prepare MFA (authenticator app or passkeys)
      description: >-
        Stores nothing. Returns the secret and backup codes of the new setup and a signed `setupToken` (15 minutes)
        that binds them; `POST /api/auth/mfa/enable` needs it back unchanged. The authenticator app's secret and
        `otpauthUri` are shown once. Backup codes are issued only while MFA is off (`null` otherwise).
      operationId: mfaSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [totp, passkeys], description: '`totp` = authenticator app, `passkeys` = passkeys as second factor.' }
      responses:
        '200':
          description: The setup to confirm.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaSetupResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`totp_already_set` (an authenticator app is already set up) or `mfa_already_enabled` (MFA is on).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`mfa_passkey_required` (passkeys method without a registered passkey).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/mfa/enable:
    post:
      tags: [Multi-factor authentication (MFA)]
      summary: Turn MFA on
      description: >-
        Needs re-authentication: `password`, or `confirmationCode` for an account without one (see
        `POST /api/auth/mfa/code`). Sending the `setupToken` again with the same secret/codes proves the setup. An
        authenticator app needs a current 6-digit `code` (the first accepted step is spent). Backup codes need
        `backupCodesAcknowledged: true`. Other sessions stay signed in.
      operationId: mfaEnable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setupToken, method]
              properties:
                setupToken: { type: string }
                method: { type: string, enum: [totp, passkeys] }
                secret: { type: [string, 'null'], description: 'Authenticator app: the secret of the setup.' }
                code: { type: [string, 'null'], maxLength: 16, description: 'Authenticator app: the current 6-digit code.' }
                backupCodes: { type: [array, 'null'], maxItems: 50, items: { type: string }, description: 'The backup codes of the setup, exactly as issued.' }
                backupCodesAcknowledged: { type: boolean, description: 'Confirms the backup codes were stored.' }
                password: { type: [string, 'null'], maxLength: 4096 }
                confirmationCode: { type: [string, 'null'], maxLength: 32 }
      responses:
        '200':
          description: MFA is on.
          content:
            application/json:
              schema:
                type: object
                required: [mfa]
                properties:
                  mfa: { $ref: '#/components/schemas/MfaStatus' }
        '400':
          description: '`invalid_mfa_setup` (setup token wrong, expired or not matching; also used), `invalid_request`, `invalid_credentials` (field `password`) or `invalid_confirmation_code` (field `code`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`totp_already_set` or `mfa_already_enabled`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`invalid_totp_code` (field `code`), `backup_codes_not_acknowledged`, or `mfa_passkey_required`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/mfa/disable:
    post:
      tags: [Multi-factor authentication (MFA)]
      summary: Turn MFA off
      description: >-
        Needs re-authentication (`password`, or `confirmationCode` for an account without one). Removes the authenticator
        app and the backup codes, keeps the passkeys, and ends all other sessions and MCP connections. The answer is
        a fresh token pair, so the calling session continues.
      operationId: mfaDisable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: [string, 'null'], maxLength: 4096 }
                confirmationCode: { type: [string, 'null'], maxLength: 32 }
      responses:
        '200':
          description: MFA is off; the new token pair of this session.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - type: object
                    required: [mfa]
                    properties:
                      mfa: { $ref: '#/components/schemas/MfaStatus' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`mfa_not_enabled`: MFA is not on.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/sessions/sign-out-others:
    post:
      tags: [Multi-factor authentication (MFA)]
      summary: Sign out all other sessions
      description: >-
        No body and no re-authentication. Ends every other session and all MCP connections of the user (token version
        bump, refresh token families revoked) and returns a fresh token pair of a new family, so the calling session
        continues. Shares the rate limit of MFA management (5 per 15 minutes per user).
      operationId: signOutOtherSessions
      responses:
        '200':
          description: Other sessions ended; the new token pair of this session.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - type: object
                    required: [ok]
                    properties:
                      ok: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/mfa/backup-codes:
    post:
      tags: [Multi-factor authentication (MFA)]
      summary: Replace the backup codes
      description: >-
        Needs re-authentication (`password`, or `confirmationCode` for an account without one). The old codes stop
        working at once. The new codes are shown once.
      operationId: mfaRegenerateBackupCodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: [string, 'null'], maxLength: 4096 }
                confirmationCode: { type: [string, 'null'], maxLength: 32 }
      responses:
        '200':
          description: The new backup codes and the status.
          content:
            application/json:
              schema:
                type: object
                required: [backupCodes, mfa]
                properties:
                  backupCodes: { type: array, items: { type: string }, minItems: 10, maxItems: 10 }
                  mfa: { $ref: '#/components/schemas/MfaStatus' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`mfa_not_enabled`: MFA is not on.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/mfa/code:
    post:
      tags: [Multi-factor authentication (MFA)]
      summary: Mail the confirmation code for MFA changes
      description: >-
        For accounts without a password only (they confirm with a code instead of a password). Same stateless code as
        for account deletion, bound to this purpose. Counts against the per-user and per-IP limits.
      operationId: mfaSendCode
      responses:
        '204': { description: The code went to the account's address. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`has_password`: the account has a password, confirm with it.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/webauthn/{id}:
    patch:
      tags: [Passkeys]
      summary: Rename one of the user's passkeys
      description: The signed-in user only; no re-authentication.
      operationId: renamePasskey
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceName]
              properties:
                deviceName: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`passkey_not_found` (unknown or another user''s).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Passkeys]
      summary: Delete one of the user's passkeys
      description: >-
        Needs re-authentication: `password`, or `confirmationCode` for an account without one (see
        `POST /api/auth/mfa/code`); the body may be empty only when neither applies. Ends all sessions (session
        version, refresh tokens) and answers with `{"ok": true}` plus a fresh token pair (`access_token`,
        `refresh_token`, ... like login), so the calling session continues. While MFA is on, the last
        passkey cannot be deleted (422 `mfa_last_passkey`).
      operationId: deletePasskey
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: [string, 'null'], maxLength: 4096 }
                confirmationCode: { type: [string, 'null'], maxLength: 32 }
      responses:
        '200':
          description: Done, with a fresh token pair.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - type: object
                    required: [ok]
                    properties:
                      ok: { type: boolean, const: true }
        '400':
          description: '`invalid_credentials` (field `password`) or `invalid_confirmation_code` (field `code`); `invalid_request` for a malformed body.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`passkey_not_found` (unknown or another user''s).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`mfa_last_passkey`: the last passkey while MFA is on.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  # ------------------------------------------------------------------ SSO
  /api/auth/oauth/{provider}:
    get:
      tags: [SSO]
      summary: Start SSO sign-in (browser navigation)
      operationId: oauthStart
      security: []
      parameters:
        - { $ref: '#/components/parameters/Provider' }
        - name: code_challenge
          in: query
          required: true
          description: Base64url (no padding) SHA-256 of the browser's random verifier, 43 characters.
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        - name: feed_id
          in: query
          required: false
          description: >-
            Feed proof for a NEW account under `RESTRICT_REGISTRATION=true` (see `feedProof` of register). Checked at
            the start and again at the callback; the signed state carries only the SHA-256 of the secret. Invalid
            proofs are ignored silently (the callback then ends in `registration_restricted`).
          schema: { type: string, maxLength: 64 }
        - name: secret
          in: query
          required: false
          description: Secret of a PRIVATE proof feed.
          schema: { type: string, maxLength: 256 }
      responses:
        '302':
          description: >-
            Redirect to the provider; sets the `oauth_state_nonce` cookie. A missing or malformed
            `code_challenge` redirects to `{FRONTEND_URL}/auth/callback?error=invalid_request` instead.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Set-Cookie: { $ref: '#/components/headers/StateCookie' }
        '404': { $ref: '#/components/responses/UnknownProvider' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }
    delete:
      tags: [SSO]
      summary: Unlink an SSO provider
      operationId: oauthUnlink
      parameters:
        - { $ref: '#/components/parameters/Provider' }
      responses:
        '204': { description: Unlinked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`oauth_account_not_found`: the provider is not linked.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`last_login_method`: no sign-in method would remain.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/auth/oauth/{provider}/callback:
    get:
      tags: [SSO]
      summary: SSO callback (from the provider)
      description: >-
        Sign-in mode: redirect to `{FRONTEND_URL}/auth/callback?code=<one-time code>` (no access or refresh token in the URL) or `?error=<code>`. Link
        mode: redirect to `{FRONTEND_URL}/profile?link_provider=…&link_proof=…` or `?link_error=<code>`. Codes: see
        the API description (SSO). The state cookie is cleared.
      operationId: oauthCallback
      security: []
      parameters:
        - { $ref: '#/components/parameters/Provider' }
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string }, description: Provider error (e.g. `access_denied`). }
      responses:
        '302':
          description: Redirect to the frontend.
          headers:
            Location: { $ref: '#/components/headers/Location' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }
    post:
      tags: [SSO]
      summary: SSO callback (form POST, Apple)
      description: Same as the GET callback; Apple returns with a cross-site form POST (`state`, `code`, `error` in the body).
      operationId: oauthCallbackPost
      security: []
      parameters:
        - { $ref: '#/components/parameters/Provider' }
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                state: { type: string }
                code: { type: string }
                error: { type: string }
      responses:
        '302':
          description: Redirect to the frontend.
          headers:
            Location: { $ref: '#/components/headers/Location' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/oauth/{provider}/link-start:
    post:
      tags: [SSO]
      summary: Start linking an SSO provider
      description: Returns a one-time ticket URL on this API (60 s, bound to user and session) that the browser opens.
      operationId: oauthLinkStart
      parameters:
        - { $ref: '#/components/parameters/Provider' }
      responses:
        '200':
          description: Ticket URL.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri, examples: ['https://example.org/api/auth/oauth/google/link?ticket=eyJuIjoi.c2ln'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`unknown_provider`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/auth/oauth/{provider}/link:
    get:
      tags: [SSO]
      summary: Open a link ticket (browser navigation)
      operationId: oauthLinkRedirect
      security: []
      parameters:
        - { $ref: '#/components/parameters/Provider' }
        - { name: ticket, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          description: >-
            Redirect to the provider (sets the state cookie), or to `{FRONTEND_URL}/profile?link_error=invalid_state`
            for an invalid, used or expired ticket.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Set-Cookie: { $ref: '#/components/headers/StateCookie' }
        '404': { $ref: '#/components/responses/UnknownProvider' }

  /api/auth/oauth/{provider}/link-complete:
    post:
      tags: [SSO]
      summary: Complete linking an SSO provider
      operationId: oauthLinkComplete
      parameters:
        - { $ref: '#/components/parameters/Provider' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proof]
              properties:
                proof: { type: string, description: '`link_proof` from the redirect (5 minutes, single use).' }
      responses:
        '204': { description: Linked (also when it already was linked to this user). }
        '400':
          description: '`invalid_state`: proof forged, expired, used, or for another user / session.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`account_in_use` (provider account belongs to another user) or `already_linked` (another account of this provider is linked).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------------ Clubs
  /api/clubs:
    get:
      tags: [Clubs]
      summary: The user's clubs
      operationId: listClubs
      responses:
        '200':
          description: Clubs with counters.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClubListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Clubs]
      summary: Create a club
      description: >-
        The creator becomes an admin. With `RESTRICT_CLUB_CREATION` the route answers 403 `club_creation_restricted`,
        except while `RESTRICT_REGISTRATION` is also set and no club exists yet (bootstrap); operators use
        `app:club:create`.
      operationId: createClub
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                timezone: { type: string, default: Europe/Berlin }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/clubs/{clubId}:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
    get:
      tags: [Clubs]
      summary: One club with counters
      description: 'Plain members get only `id`, `name`, `timezone` and `role` (staff also get `feedSignup`). `eventCount` includes archived calendars; `feedCount` counts the feeds of the club (what deleting the club removes).'
      operationId: getClub
      responses:
        '200':
          description: The club.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClubDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Clubs]
      summary: Update a club
      description: >-
        Admins only. `feedSignup` is the club setting for self-join through feeds (see `FeedSignup`); an unknown
        value is 400 `validation_failed` (field `feedSignup`). The response carries `feedSignup`.
      operationId: updateClub
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                timezone: { type: string }
                feedSignup: { $ref: '#/components/schemas/FeedSignup' }
      responses:
        '200':
          description: The updated club.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Clubs]
      summary: Delete a club with all calendars
      description: Admins only.
      operationId: deleteClub
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/clubs/{clubId}/members:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
    get:
      tags: [Clubs]
      summary: Members of a club (paginated, searchable)
      description: >-
        Viewers and above may read. Ordered by name, then id. The body stays a plain list of one page; the number of
        all matches is in the `X-Total-Count` header. `q` matches name or e-mail (case-insensitive, at most 100
        characters, `%` and `_` are literal). Invalid values are a 400 `validation_failed` with the field.
      operationId: listMembers
      parameters:
        - { name: page, in: query, description: 'Page number, 1-based (default 1).', schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, description: 'Page size, 1..100 (default 10).', schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
        - { name: q, in: query, description: 'Search in name and e-mail.', schema: { type: string, maxLength: 100 } }
        - { name: role, in: query, description: 'Only members with this role.', schema: { $ref: '#/components/schemas/ClubRole' } }
      responses:
        '200':
          description: One page of members.
          headers:
            X-Total-Count:
              description: Number of all members matching `q` and `role` (before `page`/`perPage`).
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/clubs/{clubId}/invitations:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
    get:
      tags: [Clubs]
      summary: Open and expired invitations of a club
      description: >-
        Newest first. `status` is `pending` (valid) or `expired` (older than 7 days and unanswered). Accepted,
        declined and revoked invitations are not listed. Only admins may read, create, re-send and revoke
        invitations.
      operationId: listClubInvitations
      responses:
        '200':
          description: Invitations.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClubInvitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Clubs]
      summary: Invite an e-mail address to the club
      description: >-
        Replaces the former direct "add member" route (nobody is added without consent, and the answer no longer
        tells whether an address has an account). **204 with an empty body for every well-formed address**:
        unknown, registered, unconfirmed, already a member, already invited. An address that already is a member
        is ignored silently (nothing stored, no mail); an open invitation of this club for the address is kept
        (idempotent, no second mail); an expired one is renewed like a re-send (new token, new 7 days, new mail);
        otherwise an invitation is stored (address normalized to lower case, valid 7 days, SHA-256 hash of a
        random one-time token) and the mail with `{FRONTEND_URL}/invitations?token=…` plus a link to
        `{FRONTEND_URL}/signup` is sent after the response. The mail names the club and the inviter and contains no
        other club data. Over 5 mails per address and day the mail is dropped silently (same answer).
        Limits: 20 invitations/re-sends per user and day and 50 per club and day (`429 rate_limited`, `Retry-After`),
        at most 200 open invitations per club (`422 quota_exceeded`, resource `pendingInvitationsPerClub`;
        independent of the address). Nobody is auto-accepted: after registering with the address and confirming
        it, the invitee finds the invitation via `GET /api/invitations`.
      operationId: inviteMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '204': { description: Accepted (same answer for every address). }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: '`validation_failed` (field `email`) or `quota_exceeded` (`pendingInvitationsPerClub`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/clubs/{clubId}/invitations/{invitationId}/resend:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { $ref: '#/components/parameters/InvitationId' }
    post:
      tags: [Clubs]
      summary: Send an invitation again
      description: >-
        Works for every pending or expired invitation: new token (the old link stops working), new 7 days, new mail
        after the response. At most one re-send per invitation per 60 seconds (`429 rate_limited` + `Retry-After`). Accepted, declined, revoked and unknown invitations
        (also of another club) are `404 invitation_not_found`. Counts against the invitation rate limits of
        `POST /api/clubs/{clubId}/invitations`.
      operationId: resendClubInvitation
      responses:
        '204': { description: Renewed and mailed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Club unknown (no `code`), or `invitation_not_found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/clubs/{clubId}/invitations/{invitationId}:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { $ref: '#/components/parameters/InvitationId' }
    delete:
      tags: [Clubs]
      summary: Revoke an invitation
      description: >-
        Deletes an open or expired invitation; its link stops working. Answered and unknown invitations are
        `404 invitation_not_found`.
      operationId: revokeClubInvitation
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Club unknown (no `code`), or `invitation_not_found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/invitations:
    get:
      tags: [Invitations]
      summary: Own pending invitations
      description: >-
        The open, not expired invitations for the signed-in user's VERIFIED e-mail address (compared case
        insensitively); a user whose address is not confirmed gets an empty list. Only the club name, the inviter's
        name and the expiry are disclosed (no club id, no other club data). One indexed query; also fine for users
        without any club.
      operationId: listOwnInvitations
      responses:
        '200':
          description: Invitations, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OwnInvitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/invitations/preview:
    post:
      tags: [Invitations]
      summary: Preview an invitation by the token of the mail (public)
      description: >-
        No sign-in needed: the SPA opens `{FRONTEND_URL}/invitations?token=…` for signed-out visitors, shows the
        club and prefills the sign-in form with the invited address. The token is the credential and is sent in
        the body so it stays out of URLs and logs. Unknown, answered and expired invitations are the same
        `404 invitation_not_found`. Rate limit: 30 per client IP and 15 minutes (`429 rate_limited`,
        `Retry-After`), checked before any lookup.
      operationId: previewInvitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationToken' }
      responses:
        '200':
          description: The pending invitation.
          content:
            application/json:
              schema:
                type: object
                required: [email, clubName, invitedByName, expiresAt]
                properties:
                  email: { type: string }
                  clubName: { type: string }
                  invitedByName: { type: [string, 'null'] }
                  expiresAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/InvitationNotFound' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/invitations/accept:
    post:
      tags: [Invitations]
      summary: Accept an invitation by the token of the mail
      description: >-
        The SPA calls this after sign-in with the `token` of `{FRONTEND_URL}/invitations?token=…`. The token only
        identifies the invitation: the signed-in user's verified address must equal the invited one, otherwise
        (also for unknown tokens, answered invitations and unconfirmed users) the answer is the same
        `404 invitation_not_found`. Creates the membership in a transaction under the club lock (member quota
        respected, a user who already is a member is not added twice) and returns the club.
      operationId: acceptInvitationByToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationToken' }
      responses:
        '200':
          description: The club the user joined.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/InvitationNotFound' }
        '422': { $ref: '#/components/responses/InvitationUnprocessable' }

  /api/invitations/decline:
    post:
      tags: [Invitations]
      summary: Decline an invitation by the token of the mail
      description: Same identification and errors as `POST /api/invitations/accept`; nobody is added and the invitation disappears from the club's list.
      operationId: declineInvitationByToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationToken' }
      responses:
        '204': { description: Declined. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/InvitationNotFound' }
        '422': { $ref: '#/components/responses/InvitationUnprocessable' }

  /api/invitations/{invitationId}/accept:
    parameters:
      - { $ref: '#/components/parameters/InvitationId' }
    post:
      tags: [Invitations]
      summary: Accept an invitation from the own list
      description: Like `POST /api/invitations/accept`, identified by the `id` of `GET /api/invitations`.
      operationId: acceptInvitation
      responses:
        '200':
          description: The club the user joined.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/InvitationNotFound' }
        '422': { $ref: '#/components/responses/InvitationUnprocessable' }

  /api/invitations/{invitationId}/decline:
    parameters:
      - { $ref: '#/components/parameters/InvitationId' }
    post:
      tags: [Invitations]
      summary: Decline an invitation from the own list
      description: Like `POST /api/invitations/decline`, identified by the `id` of `GET /api/invitations`.
      operationId: declineInvitation
      responses:
        '204': { description: Declined. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/InvitationNotFound' }
        '422': { $ref: '#/components/responses/InvitationUnprocessable' }

  /api/clubs/{clubId}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { name: userId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Clubs]
      summary: Change the role of a member
      description: >-
        Admins only (`403`, checked again under the club lock). Demoting the last admin is `422 last_admin`;
        an unknown role is `422 invalid_role` (field `role`). An id that is no member is `404 member_not_found`.
      operationId: changeMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [member, viewer, editor, admin] }
      responses:
        '200':
          description: The member with the new role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Club unknown (no `code`), or `member_not_found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`invalid_role` or `last_admin`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Clubs]
      summary: Remove a member
      description: >-
        Removes the membership. Leaving the club oneself is open to every role; removing somebody else needs an
        admin (`403`). An id that is no member of the club is
        `404 member_not_found`, the same answer for unknown ids and for users outside the club. The last
        member can neither be removed nor leave: `422 last_member` (a club never has zero members; the
        club row is locked for the check, so concurrent removals cannot empty it). Delete the club instead.
        The last admin cannot be removed or leave while other members remain: `422 last_admin` (promote
        somebody first).
      operationId: removeMember
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Club unknown (no `code`), or `member_not_found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`last_member`: the user is the only member of the club; `last_admin`: the user is the only admin."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------------ Calendars
  /api/clubs/{clubId}/calendars:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
    get:
      tags: [Calendars]
      summary: Calendars of a club
      description: Active calendars first, then by name.
      operationId: listCalendars
      parameters:
        - { name: includeArchived, in: query, schema: { type: string, enum: ['true', 'false'], default: 'false' } }
      responses:
        '200':
          description: Calendars with counters.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Calendar' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Calendars]
      summary: Create a calendar
      operationId: createCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                timezone: { type: [string, 'null'], maxLength: 100, description: Null = the club's zone. }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendar' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/clubs/{clubId}/calendars/{calendarId}:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { $ref: '#/components/parameters/CalendarId' }
    get:
      tags: [Calendars]
      summary: One calendar
      operationId: getCalendar
      responses:
        '200':
          description: The calendar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Calendars]
      summary: Rename a calendar or change its zone
      description: >-
        Denied (403) for archived calendars, which are read-only. Deleting and duplicating an archived
        calendar stays allowed on purpose, as do archive and unarchive.
      operationId: updateCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                timezone: { type: [string, 'null'] }
      responses:
        '200':
          description: The updated calendar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendar' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Calendars]
      summary: Delete a calendar with all its data
      description: >-
        Also allowed for archived calendars (deliberate). Feeds whose only calendar this is are deleted too
        (`exclusiveFeedCount`); feeds that select further calendars just lose this one.
      operationId: deleteCalendar
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/clubs/{clubId}/calendars/{calendarId}/archive:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { $ref: '#/components/parameters/CalendarId' }
    post:
      tags: [Calendars]
      summary: Archive a calendar (read-only, feeds 404)
      operationId: archiveCalendar
      responses:
        '200':
          description: The archived calendar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/clubs/{clubId}/calendars/{calendarId}/unarchive:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { $ref: '#/components/parameters/CalendarId' }
    post:
      tags: [Calendars]
      summary: Restore an archived calendar
      operationId: unarchiveCalendar
      responses:
        '200':
          description: The calendar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/clubs/{clubId}/calendars/{calendarId}/duplicate:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { $ref: '#/components/parameters/CalendarId' }
    post:
      tags: [Calendars]
      summary: Duplicate a calendar
      description: >-
        Copies the badges (properties), extras (features) and templates (the copied templates reference the copy's own badges and
        extras, but keep the same club-level locations and audiences (target groups)), but no events, series or feeds. The body is optional. Also allowed for archived calendars (deliberate).
      operationId: duplicateCalendar
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: [string, 'null'], maxLength: 255, description: 'Name of the copy (localized by the client); default "Copy of …".' }
      responses:
        '201':
          description: The copy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendar' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/QuotaExceeded' }

  # ------------------------------------------------------------------ Events
  /api/calendars/{calendarId}/events:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    get:
      tags: [Events]
      summary: Events of a calendar (drafts included)
      description: >-
        Ordered by date and start time. `from`/`to` select by overlap (multi-day events reaching into the range are
        included); both strictly `YYYY-MM-DD` (a real day; `now`, `2026-02-31` or an array are a 400
        `validation_failed` with field `from`/`to`), `to` before `from` is a 400 on `to`, and a range longer than
        1830 days (about five years) a 400 on `to`. At most `limit` (default and maximum 5000) events are returned
        per request; page with `offset`. The body stays a plain list, the number of all matches is in the
        `X-Total-Count` header. Without `from`/`to` the first 5000 events are returned. Draft events (`isDraft`) are
        returned (and counted) only to editors and admins; for viewers they are left out everywhere, search included.
      operationId: listEvents
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, description: 'Page size, 1..5000 (default 5000); outside → 400 `validation_failed` field `limit`.', schema: { type: integer, minimum: 1, maximum: 5000, default: 5000 } }
        - { name: offset, in: query, description: 'Events to skip (default 0).', schema: { type: integer, minimum: 0, default: 0 } }
        - { name: targetGroupIds, in: query, description: Comma-separated audience (target group) ids (events with at least one)., schema: { type: string } }
        - { name: q, in: query, description: 'Text search (trimmed, empty = no filter, at most 100 characters, else 400 `validation_failed` field `q`): case-insensitive substring of the event name, note, location name or the name of one of its extras (features). Combines with the other filters; without `from`/`to` the whole calendar is searched.', schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Events.
          headers:
            X-Total-Count:
              description: Number of all events matching `from`/`to`/`targetGroupIds`/`q` (before `limit`/`offset`).
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Events]
      summary: Create an event
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnknownReference' }

  /api/calendars/{calendarId}/events/{id}:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Events]
      summary: One event with its series
      operationId: getEvent
      responses:
        '200':
          description: The event; `series` is the series (rule + `eventCount`) or null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventWithSeries' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Events]
      summary: Update an event (or all events of its series)
      description: >-
        Partial. `scope: "this"` (default) changes only this event; `scope: "all"` applies the sent fields to every
        event of the series in one transaction, except `date`, `dateEnd`, `eventTemplateId`, `externalUid` (each
        event keeps its day). A missing or null id list leaves the assignments unchanged. The response is the edited
        event.
      operationId: updateEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventPatch' }
      responses:
        '200':
          description: The updated event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnknownReference' }
    delete:
      tags: [Events]
      summary: Delete an event (or its whole series)
      operationId: deleteEvent
      parameters:
        - name: scope
          in: query
          description: '`this` (default) deletes the event (its series goes once empty); `all` deletes the series with all its events.'
          schema: { $ref: '#/components/schemas/Scope' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/calendars/{calendarId}/events/from-template:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    post:
      tags: [Events]
      summary: Create events from a template on given dates
      description: >-
        One event per date with the template's values (name, zone, times, assignments, location), as drafts unless
        `overrides.isDraft` says otherwise. A template without times creates all-day events (00:00-23:59) unless the
        overrides bring times. Not linked as a series. Without `templateId` / with missing or empty `dates`:
        `400 validation_failed` field `templateId` / `dates`.
      operationId: createEventsFromTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateId, dates]
              properties:
                templateId: { type: string }
                dates: { type: array, minItems: 1, items: { type: string, format: date } }
                overrides:
                  type: object
                  description: Values replacing the template's.
                  properties:
                    name: { type: string }
                    timezone: { type: [string, 'null'] }
                    timeBegin: { $ref: '#/components/schemas/Time' }
                    timeEnd: { $ref: '#/components/schemas/Time' }
                    isAllDay: { type: boolean }
                    isDraft: { type: boolean }
                    note: { type: [string, 'null'], maxLength: 2000, description: 'Plain-text note (multi-line). Trimmed; empty or whitespace-only becomes null; more than 2000 characters is 422 `validation_failed`, field `note`. PATCH: omitted = unchanged, null or empty clears.' }
                    locationId: { type: [string, 'null'] }
                    propertyIds: { $ref: '#/components/schemas/IdList' }
                    featureIds: { $ref: '#/components/schemas/IdList' }
                    targetGroupIds: { $ref: '#/components/schemas/IdList' }
      responses:
        '201':
          description: The created events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404':
          description: Calendar or template unknown (no `code`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/UnknownReference' }

  /api/calendars/{calendarId}/events/bulk:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    post:
      tags: [Events]
      summary: Publish, unpublish, delete or assign several events
      description: >-
        All or nothing in one transaction. Every id must belong to the calendar (unknown and foreign ids alike → 422
        `unknown_reference` field `ids`, nothing happens); duplicate ids count once. At most 5000 ids (413
        `too_many_events`). Series left without events are removed. Action `assign` adds the given audiences (target groups)
        (club-scoped), extras (features) and badges (properties) (calendar-scoped) to every event and keeps existing assignments
        (duplicates are ignored); at least one of the three lists is required (400 otherwise), unknown or foreign
        ids are 422 `unknown_reference` with the list's field.
      operationId: bulkEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids: { type: array, minItems: 1, maxItems: 5000, items: { type: string, maxLength: 36 } }
                action: { type: string, enum: [publish, draft, delete, assign] }
                targetGroupIds: { type: array, maxItems: 500, items: { type: string }, description: Only for `assign`. }
                featureIds: { type: array, maxItems: 500, items: { type: string }, description: Only for `assign`. }
                propertyIds: { type: array, maxItems: 500, items: { type: string }, description: Only for `assign`. }
      responses:
        '200':
          description: Number of events of the request (also when a value did not change).
          content:
            application/json:
              schema:
                type: object
                required: [affected]
                properties:
                  affected: { type: integer }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooManyEvents' }
        '422': { $ref: '#/components/responses/UnknownReference' }

  # ------------------------------------------------------------------ Event series
  /api/calendars/{calendarId}/events/series/preview:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    post:
      tags: [Event series]
      summary: Preview the dates of a series rule
      description: Same validation as creating; writes nothing. A rule without dates is no error here (`count` 0).
      operationId: previewSeries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule]
              properties:
                rule: { $ref: '#/components/schemas/SeriesRuleInput' }
                event:
                  type: object
                  properties:
                    durationDays: { $ref: '#/components/schemas/DurationDays' }
      responses:
        '200':
          description: Dates and holidays.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesPreview' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/SeriesTooMany' }

  /api/calendars/{calendarId}/events/series:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    post:
      tags: [Event series]
      summary: Create a series with all its events
      description: >-
        Atomic: an invalid field or a reference of another calendar saves nothing. Template values are taken like
        `from-template` (template without times → all-day); `event` fields override them. Events are drafts unless
        `isDraft` / `event.isDraft` is false. `event.date`/`event.dateEnd` are not allowed (set by the rule and
        `event.durationDays`). Errors of event fields carry `field: event.<name>`.
      operationId: createSeries
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeriesCreateInput' }
      responses:
        '201':
          description: The series and its events.
          content:
            application/json:
              schema:
                type: object
                required: [series, events]
                properties:
                  series: { $ref: '#/components/schemas/Series' }
                  events: { type: array, items: { $ref: '#/components/schemas/Event' } }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: >-
            `too_many_events` (more than 366), `validation_failed` field `rule` (the rule creates no events) or
            `unknown_reference` (e.g. `templateId`, `event.locationId`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/calendars/{calendarId}/event-series/{seriesId}:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
      - { $ref: '#/components/parameters/SeriesId' }
    get:
      tags: [Event series]
      summary: Rule and event count of a series
      description: Also readable in archived calendars. A series of another calendar is 404.
      operationId: getSeries
      responses:
        '200':
          description: The series.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Event series]
      summary: Change the rule of a series (future events only)
      description: >-
        Applies the new rule to the future events (date ≥ today in the calendar's zone); past events stay. The new
        rule yields its full set of dates from its start (`count`/`until` count over the whole series). Future
        events on a date of the set stay unchanged (also individually edited ones), missing dates get new events
        with the values of the prototype (earliest future event, else the latest one), future events on other dates
        are deleted. `durationDays` keeps the series' value. One transaction with the series row locked.
      operationId: updateSeries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule]
              properties:
                rule: { $ref: '#/components/schemas/SeriesRuleInput' }
      responses:
        '200':
          description: The series and counts of the change.
          content:
            application/json:
              schema:
                type: object
                required: [series, created, deleted, kept]
                properties:
                  series: { $ref: '#/components/schemas/Series' }
                  created: { type: integer }
                  deleted: { type: integer }
                  kept: { type: integer }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SeriesConflict' }
        '422': { $ref: '#/components/responses/SeriesTooMany' }

  /api/calendars/{calendarId}/event-series/{seriesId}/preview-update:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
      - { $ref: '#/components/parameters/SeriesId' }
    post:
      tags: [Event series]
      summary: Preview a rule change
      description: What `PATCH` with the same rule would do now; writes nothing.
      operationId: previewSeriesUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule]
              properties:
                rule: { $ref: '#/components/schemas/SeriesRuleInput' }
      responses:
        '200':
          description: Planned changes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesUpdatePreview' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SeriesConflict' }
        '422': { $ref: '#/components/responses/SeriesTooMany' }

  # ------------------------------------------------------------------ Import & export
  /api/calendars/{calendarId}/events/import/preview:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    post:
      tags: [Import & export]
      summary: Dry run of an import
      description: >-
        Status per entry (`new`, `duplicate`, `invalid`) with the same validation as the import; writes nothing.
        The ICS file is parsed in the browser; the API gets the reviewed events as JSON.
      operationId: previewImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportInput' }
      responses:
        '200':
          description: Result per entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportPreview' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooManyEvents' }
        '422': { $ref: '#/components/responses/UnknownReference' }

  /api/calendars/{calendarId}/events/import:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    post:
      tags: [Import & export]
      summary: Import events (atomic)
      description: >-
        All or nothing in one transaction. New places in `locations` are referenced by `locationTempId` and only
        created when an imported event uses them. With `skipDuplicates` duplicates are skipped (still validated).
        The first invalid entry fails the request with `field: events[n].<field>`.
      operationId: importEvents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportInput' }
      responses:
        '201':
          description: Imported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooManyEvents' }
        '422': { $ref: '#/components/responses/UnknownReference' }

  /api/calendars/{calendarId}/events.ics:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    get:
      tags: [Import & export]
      summary: ICS download of a calendar's events (members)
      description: >-
        Built like the feeds (VTIMEZONE, property icons, Apple location); series events are single VEVENTs. Drafts
        only with `includeDrafts` (as `STATUS:TENTATIVE`). The event `note` is the first lines of `DESCRIPTION`. The `SUMMARY` is `<badge emojis> <name> (<extras>)` (emojis and parentheses omitted when there are none); `DESCRIPTION` holds the `note`, the extras, the audiences and a legend `<emoji> <badge name>` of the emojis used. Allowed for archived calendars.
      operationId: exportIcs
      parameters:
        - { name: from, in: query, description: Events ending on or after this day., schema: { type: string, format: date } }
        - { name: to, in: query, description: Events starting on or before this day (not before `from`)., schema: { type: string, format: date } }
        - { name: includeDrafts, in: query, schema: { type: string, enum: ['true', 'false', '1', '0'], default: 'false' } }
        - name: 'targetGroupIds[]'
          in: query
          description: Ids of audiences (target groups) of this calendar (at most 100); a comma-separated `targetGroupIds` is accepted too.
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
      responses:
        '200':
          description: 'iCalendar file (`Content-Disposition: attachment; filename="<calendar-slug>.ics"`).'
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            text/calendar:
              schema: { type: string }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnknownReference' }

  /api/calendars/{calendarId}/events.pdf:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    get:
      tags: [Import & export]
      summary: PDF download of a calendar's events (members)
      description: >-
        `from`, `to` (YYYY-MM-DD, at most 366 days apart) and `layout` are required. Same event filter as
        `events.ics` (drafts only with `includeDrafts`, `targetGroupIds[]` must be audiences of this club; allowed for
        archived calendars and for viewers). Layouts: `month-grid` (one page per month), `quarter-overview` (needs a
        period of at least 3 calendar months; one page per three months, one column per month with one row per
        day and one line per event: time, icons, name, features in parentheses; weekends tinted, days outside
        the period grey; the icon legend is printed per page), `annual-overview` (only a full calendar year, 1 Jan to 31 Dec) and
        `agenda` (list). `orientation=auto` is portrait for `month-grid`/`agenda`, landscape for the overviews.
        The output language (`de`/`en`) and the first weekday come from the signed-in user's stored preferences
        (`language`, `firstDayOfWeek`), not from a parameter. Property icons are printed as bundled emoji images
        and explained in a legend; unknown icons are omitted. At most 2000 events per PDF (422 `too_many_events`,
        field `to`). Rate limited: 10 per user and 30 per client IP in 10 minutes (checked first, before any
        validation). The response is built in memory (no streaming) with a raised memory and time limit for this route.
      operationId: exportPdf
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: layout, in: query, required: true, schema: { type: string, enum: [month-grid, quarter-overview, annual-overview, agenda] } }
        - { name: paper, in: query, schema: { type: string, enum: [a4, a3], default: a4 } }
        - { name: orientation, in: query, schema: { type: string, enum: [auto, portrait, landscape], default: auto } }
        - { name: includeDrafts, in: query, schema: { type: string, enum: ['true', 'false', '1', '0'], default: 'false' } }
        - name: 'targetGroupIds[]'
          in: query
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: 'holidayCalendarIds[]'
          in: query
          description: >-
            Holiday calendars of this calendar (at most 20) whose holidays are printed; default none. Public holidays
            (type `public`/`other`) shade the day and print their name; school holidays shade the range and print the name
            only on its first visible day. Colour priority per day: days outside the period (grey), public holiday,
            weekend, school holiday. In `annual-overview` days with events keep their event colour. Stale
            OpenHolidays calendars are refreshed first (a failure is not fatal). A legend entry is added for the colours used.
          schema: { type: array, items: { type: string }, maxItems: 20 }
          style: form
          explode: true
      responses:
        '200':
          description: 'PDF file (`Content-Disposition: attachment; filename="<calendar-slug>.pdf"`).'
          headers:
            Content-Disposition: { schema: { type: string } }
            Content-Length: { schema: { type: integer } }
            Cache-Control: { schema: { type: string, example: 'no-cache, no-store' } }
            X-Content-Type-Options: { schema: { type: string, example: nosniff } }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '400':
          description: >-
            `validation_failed` with `field`: `from`/`to` (missing or not a real day, `from` after `to`, `to` more than
            366 days after `from`, `targetGroupIds` malformed), `layout` (missing, unknown, `quarter-overview` for
            less than 3 months, `annual-overview` for anything but a full calendar year), `paper` (not `a4`/`a3`),
            `orientation` (not `auto`/`portrait`/`landscape`), `holidayCalendarIds` (malformed or more than 20).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: '`unknown_reference` (field `targetGroupIds`: not an audience of this club; field `holidayCalendarIds`: not a holiday calendar of this calendar) or `too_many_events` (field `to`: more than 2000 events in the selection).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

