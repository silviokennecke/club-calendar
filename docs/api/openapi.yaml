openapi: 3.1.0
info:
  title: Club Calendar API
  version: '1.0'
  summary: HTTP API of the Club Calendar backend (Symfony, `backend/`).
  description: |
    Hand-written reference of every route under `/api`. It is checked against the Symfony router by
    `backend/tests/Unit/OpenApiSpecTest.php` (every route documented with the same method and path, every
    documented operation exists). It is not served by the application.

    ## Conventions

    - **IDs** are UUID v7 strings (RFC 4122 form, lower case). The database compares IDs case-insensitively.
    - **Dates** are calendar dates `YYYY-MM-DD`, **times** are wall-clock times `HH:MM` (seconds in the input are
      accepted and dropped), **time zones** are IANA names (`Europe/Berlin`), matched case-insensitively and
      returned in their canonical spelling. Timestamps are ISO 8601 (`2026-10-15T12:00:00+00:00`) unless noted.
    - Request bodies are JSON objects (`Content-Type: application/json`), except `POST /api/auth/token`
      (form-encoded). A body that is not valid JSON (or empty) is `400 invalid_request`; a valid JSON value that is not an
      object (`5`, `null`, `"x"`) is `400 invalid_request` on routes that read the body as a map and `422 validation_failed`
      (first required field) on routes that map it onto a DTO; `[]` counts as an empty object.
    - `PATCH` is partial: only the keys present in the body are changed.
    - Deletes answer `200 {"ok": true}` (also logout and holiday calendars); only `DELETE /api/auth/change-email` and
      `DELETE /api/auth/oauth/{provider}` answer `204 No Content`. `DELETE /api/auth/webauthn/{id}` adds a fresh token pair
      to its `ok` body (it ends all sessions).

    ## Authentication

    - **Access token**: a JWT (RS256, 15 minutes, claim `email`, plus `uid` and `tv` = session version), sent as
      `Authorization: Bearer <token>`. Obtained from login, passkey sign-in, SSO, password change or refresh.
    - **Refresh token**: HMAC-signed JWT with `jti` and `fam` (session), stored server-side (table `refresh_token`),
      exchanged at `POST /api/auth/token` with a **form-encoded** body `grant_type=refresh_token&refresh_token=<token>`
      (OAuth 2.0 style). Every token is single-use and **rotated**: a refresh answers with a new access token AND a
      new refresh token of the same session. A token slides 7 days, but a session ends at the latest
      `REFRESH_TOKEN_ABSOLUTE_LIFETIME` (default 30 days) after login, however often it is refreshed. Presenting a token
      that was already rotated revokes the whole session (`401 invalid_refresh_token`), except within
      `REFRESH_TOKEN_REUSE_GRACE` seconds (default 10) after the rotation: such a retry (lost response, parallel
      tabs) gets a further token of the same session. Legacy tokens without `jti` (issued before rotation) are accepted
      exactly once (a replay is `401`) and replaced by a token of a new session; they are not tracked, so logout does not revoke them. `POST /api/auth/logout` revokes the session of one refresh token,
      `POST /api/auth/logout-all` all sessions of the user.
    - Both tokens die when the account's session version changes (password reset/change, e-mail change, passkey
      deletion, sign out everywhere, SSO takeover of an unconfirmed account): `401` on the next request / refresh. Refresh and passkey sign-in
      refuse accounts whose e-mail address is not confirmed.
    - **One-time login token**: `POST /api/auth/token` with `grant_type=one_time_token&token=<token>` returns the
      usual token pair. The token comes from `POST /api/auth/verify-email` (TTL 30 s) or is the `code` of the SSO
      redirect (TTL env `OAUTH_LOGIN_CODE_TTL`, default 180 s); it is opaque, single use and bound to the user
      and the session version. The purposes are not interchangeable with any other signed token.
    - Every `/api/*` route except `/api/feed/*` passes the JWT firewall. A route marked "no authentication"
      still rejects an *invalid* `Authorization` header with 401 (send none instead).
    - Authorization: club routes require club membership, calendar routes membership in the calendar's club
      (403 otherwise). Members have one of three **roles** (`viewer` < `editor` < `admin`, each includes the
      lower ones): *viewer* reads (club, calendars, events, reference data, members, `events.ics`); *editor* also
      creates, changes and deletes events, series, templates, locations, properties, features, target groups and
      holiday calendars (import, bulk and series included) and reads the feeds of the club (their addresses
      and secrets); *admin* also changes and deletes the club, creates/changes/archives/duplicates/deletes
      calendars, manages feeds, invitations, members and roles. A role too low is 403 (`Forbidden`). Anyone may
      leave a club (`DELETE …/members/{ownId}`). A club never has zero members or zero admins: the last admin can
      neither be demoted, removed nor leave (`422 last_admin`) and cannot delete the account
      (`422 last_admin_of_club`) while other members remain. Writes to an **archived** calendar are 403 (reads
      stay possible). Locations and target groups belong to the club
      (`/api/clubs/{clubId}/…`, shared by all its calendars): reads need membership, writes the editor role, and
      archiving a calendar does not block them. Their names are unique per club. Properties and features stay
      per calendar (`/api/calendars/{calendarId}/…`, names unique per calendar; writes to an archived calendar are 403).
    - **401** is always an RFC 7807 problem with `WWW-Authenticate: Bearer`. For the access token the code is
      `missing_token` (no `Authorization` header on a route that needs a user), `invalid_token` (malformed,
      wrong signature, ended session, user gone) or `token_expired`; the sign-in routes themselves answer
      `invalid_credentials` (login), `invalid_refresh_token` (`POST /api/auth/token`) or `invalid_passkey`.
      Clients may refresh on any 401 of a request that carried an access token.
    - Every route under `/api/clubs`, `/api/calendars`, `/api/invitations`, `/api/map/geocode/` and `/api/mapbox/` needs a signed-in user before the
      id in the path is looked up: without a token it is `401 missing_token` (never 403 or 404, so ids cannot be
      probed). 403 means signed in but not allowed (no member, archived calendar).

    ### SSO (Google, Microsoft, Apple) - brief

    1. Sign-in: the browser navigates to `GET /api/auth/oauth/{provider}`. The API sets a short-lived HttpOnly
       cookie `oauth_state_nonce` (path `/api/auth/oauth`, `Secure; SameSite=None`) and redirects to the
       provider with a signed, single-use `state`.
    2. The provider calls back `GET|POST /api/auth/oauth/{provider}/callback`; the API redirects to
       `{FRONTEND_URL}/auth/callback?code=<one-time code>` (redeemed at `POST /api/auth/token`, `grant_type=one_time_token`; no token in the URL) or `?error=<code>` with one of
       `invalid_state`, `provider_denied`, `provider_error`, `oauth_failed`, `email_missing`, `account_exists`,
       `email_unverified_at_provider`, `email_verification_required` (the provider does not prove the address, Microsoft:
       no tokens are issued, the account is created unverified, the 6-digit code is mailed and the redirect is
       `…/auth/callback?error=email_verification_required&email=<address>`; the frontend asks for the code at
       `POST /api/auth/verify-email` and signs in with the returned login token at `POST /api/auth/token`, or
       signs in with the provider again afterwards). An existing account is linked by e-mail only when the provider vouches
       for the address (`email_verified`, trusted for Google and Apple, never Microsoft).
    3. Linking while signed in: `POST …/{provider}/link-start` (JWT) → `{url}` (one-time ticket, 60 s) → the
       browser opens it (`GET …/{provider}/link?ticket=`) → provider → callback → redirect to
       `{FRONTEND_URL}/profile?link_provider=<p>&link_proof=<proof>` (or `?link_error=<code>`: `invalid_state`,
       `provider_denied`, `provider_error`, `oauth_failed`) → the signed-in frontend calls
       `POST …/{provider}/link-complete {proof}` (JWT). Only the user who started the flow can complete it.

    ### Passkeys (WebAuthn) - brief

    `GET …/webauthn/register/options` (JWT) or `GET …/webauthn/authenticate/options` returns
    `{options, challengeToken}`; the browser runs `navigator.credentials.create/get` with `options`; the result
    goes to `POST …/register/verify` or `POST …/authenticate/verify` together with the signed, single-use
    `challengeToken`. Allowed origin is `FRONTEND_URL`, RP ID `WEBAUTHN_RP_ID`.

    ## Errors

    Errors are RFC 7807 `application/problem+json` bodies `{type, title, status, detail, code?, field?}`
    (schema `Problem`). `detail` is human-readable and **not** a contract; clients match the stable `code`
    (schema `ErrorCode`) and use `field` (path of the input, e.g. `name`, `rule.weekday`, `events[3].date`)
    to place the message. Every error of the API has this shape (also 401 of the JWT check, login 403, holiday
    calendars, the Mapbox proxy). Errors without a `code` are plain HTTP errors (403/404 of access checks,
    405, 502); **every 400 carries a code**: requests the framework rejects are `invalid_request`, and a query
    parameter sent as an array (`?name[]=x`) where a single value is expected is `400 validation_failed` with
    `field` = the parameter name, on every route.

    **Status of input errors** (`validation_failed`):

    - **400**: a malformed input value - missing, wrong JSON type, wrong format (date, time, id list), out of range,
      unknown IANA time zone, location coordinates (type, range, only one of both), times as half a pair. These
      are the typed input checks of all routes that read the body as a map and of all query parameters.
    - **422**: constraint violations of a request DTO (routes that map the body onto a DTO: register, login,
      resend-verification, forgot/reset password, change-password, change-email, create club, add member, create
      calendar, holiday calendar create/update), and well-formed values that conflict with stored state
      (`searchable` on a feed that is not `PUBLIC`, a series rule without events, an e-mail change to the current
      address). Other 422 codes (`unknown_reference`, `duplicate_name`, `too_many_events`, `quota_exceeded`, `ics_fetch_failed`)
      are semantic as well.

    ## Feeds, visibility and robots rules

    A calendar feed (`CalendarFeed`) is published under `/api/feed/{feedId}/…` (web view JSON + ICS) with one
    of three states (`visibility`):

    | State | Access | Search engines |
    | --- | --- | --- |
    | `PUBLIC` | by link, no secret (a sent secret is ignored) | indexable only with `searchable: true` (opt-in) |
    | `CLUB` ("club-internal", **default** for new feeds) | by link, no secret | never indexed |
    | `PRIVATE` | only with `?secret=<sharedSecret>` (403 without or with a wrong one, checked first) | never indexed |

    - `indexable` = `visibility == PUBLIC && searchable`. `searchable: true` with another (resulting) state is
      `422 validation_failed` field `searchable`; leaving `PUBLIC` resets `searchable` to `false`.
    - Every response of `/api/feed/*` (errors included) carries `Referrer-Policy: no-referrer` and
      `X-Robots-Tag: noindex`, **except** successful responses of an indexable feed, which carry no
      `X-Robots-Tag`. The header is set by the backend only (web server configs add nothing).
    - A feed shows the events of **all its selected calendars that are not archived**. An archived calendar
      drops out; when none is left (all archived) the feed is 404 (for `PRIVATE` only after a valid secret).
      Unknown feed: 404.
    - Switching a feed from `PUBLIC`/`CLUB` back to `PRIVATE` always generates a new secret.
    - Feeds only show published events (`isDraft: false`) and, if the feed has target groups, only events
      with one of them (the `targetGroupIds` query can narrow, never widen, that selection).

    ## Event series

    A series (`EventSeries`) is created with `POST /api/calendars/{id}/events/series` from a rule (`SeriesRule`):
    `weekly` / `biweekly` on one weekday, or `monthly` on the n-th (1-4, 5 = last) weekday; it ends `until` a
    date (inclusive) or after `count` events; `skipHolidays` leaves out dates touching a holiday of the
    calendar's holiday calendars. Dates are computed only by the backend. At most **366 events** per series
    (`422 too_many_events`).

    - `PATCH …/events/{id}` with `scope: "this"` (default) changes only that event (it stays in the series);
      `scope: "all"` applies the sent fields to every event of the series, except `date`, `dateEnd`,
      `eventTemplateId` and `externalUid` (each event keeps its own day).
    - `DELETE …/events/{id}?scope=this|all`: one event, or the whole series with its events. A series without
      events is removed automatically (also after bulk deletes).
    - Changing the rule later (`PATCH …/event-series/{seriesId}`) only touches **future** events (date ≥ today
      in the calendar's zone); past events stay. Preview it with `POST …/preview-update`.
    - ICS imports with `RRULE` create single events, never a series.

    ## Import and export limits

    - Import (`…/events/import/preview`, `…/events/import`): at most **5000 events** and 5000 new locations per
      request (`413 too_many_events`). The import is atomic (one transaction): one invalid entry saves nothing.
    - Bulk (`…/events/bulk`): at most **5000 ids** per request (`413 too_many_events`), all or nothing.
    - **Duplicates**: an entry is a duplicate of an existing event of the calendar with the same `externalUid`
      (ICS UID; the UID of our own export `event-<id>@club-calendar` matches that event), else with the same
      name (trimmed, case-insensitive, leading emoji icons ignored) and the same start date. Entries of the same
      request are not compared with each other.
    - Unknown time zones in an import fall back to the calendar's (else the club's) zone and are reported in
      `warnings` (`code: timezone_replaced`).
    - Member ICS export: `GET /api/calendars/{calendarId}/events.ics`, at most 100 `targetGroupIds`.

    ## Quotas and input limits

    Per-account growth is bounded (security audit M7; constants in `App\Service\Quota`, generous on purpose).
    A write that would exceed one answers **422 `quota_exceeded`** with the members `resource` (the name below)
    and `limit`; nothing is written. Counts are checked before the write, so parallel requests may overshoot by
    one batch.

    | `resource` | Limit |
    | --- | --- |
    | `clubsPerUser` | 50 clubs a user is a member of (create club) |
    | `calendarsPerClub` | 100 calendars per club (create, duplicate; archived ones count) |
    | `membersPerClub` | 500 members per club (also checked when an invitation is accepted) |
    | `pendingInvitationsPerClub` | 200 open (pending or expired, not yet answered) invitations per club |
    | `eventsPerCalendar` | 20000 events per calendar (create, from-template, series create/rule change, import) |
    | `locationsPerClub` | 2000 locations per club (also those an import creates) |
    | `templatesPerCalendar` / `propertiesPerCalendar` / `featuresPerCalendar` | 500 each per calendar |
    | `targetGroupsPerClub` | 500 target groups per club |
    | `feedsPerClub` | 50 feeds per club |
    | `holidayCalendarsPerCalendar` | 20 holiday calendars |

    Further limits: an id list field (`propertyIds`, `featureIds`, `targetGroupIds`, also the `targetGroupIds`
    query of the event list) has at most 500 ids (400 `validation_failed`); `from-template` takes at most 366
    `dates` (422 `too_many_events`, field `dates`); a holiday ICS is read at most 1 MB and 5000 events (else
    `ics_fetch_failed`). Strings have maximum lengths (255, or 100/32/20 for short fields; 400 `validation_failed`).
    The public feed is bounded by the event quota (one constant number of queries per request).
  contact:
    name: Club Calendar
servers:
  - url: http://localhost:3001
    description: Local backend (`symfony serve --port=3001`)
  - url: '{appUrl}'
    description: Deployed app (SPA and API share one origin)
    variables:
      appUrl:
        default: https://example.org
tags:
  - name: Health
    description: Liveness check.
  - name: Auth
    description: Registration, sign-in, tokens, account.
  - name: Passkeys
    description: WebAuthn registration and sign-in.
  - name: SSO
    description: OAuth 2.0 / OpenID Connect sign-in and account linking (browser redirects).
  - name: Clubs
    description: Clubs, their members and their invitations.
  - name: Invitations
    description: Club invitations of the signed-in user (list, accept, decline); club members manage them under Clubs.
  - name: Calendars
    description: 'Calendars of a club (create, archive, duplicate).'
  - name: Events
    description: Events of a calendar, bulk actions.
  - name: Event series
    description: Recurring events (rule, preview, change).
  - name: Import & export
    description: Event import (JSON) and ICS export.
  - name: Event templates
    description: Reusable event definitions.
  - name: Properties
    description: Event tags with an emoji icon.
  - name: Features
    description: Optional add-ons of events.
  - name: Target groups
    description: Audience filters of events and feeds.
  - name: Locations
    description: Venues with address and map position.
  - name: Feeds
    description: Feed management (admins; editors may read).
  - name: Public feed
    description: Published feeds (no authentication; `?secret=` for private feeds).
  - name: Holidays
    description: External holiday calendars (ICS) and their holidays.
  - name: Maps
    description: Geocoding, static map images and the Mapbox proxy.
security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------------ Health
  /api/health:
    get:
      tags: [Health]
      summary: Liveness check
      operationId: health
      security: []
      responses:
        '200':
          description: The application is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  # ------------------------------------------------------------------ Auth
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register with e-mail and password
      description: >-
        Creates an unconfirmed account and mails a 6-digit confirmation code (no link, valid 15 minutes). No tokens:
        the client sends the code to `POST /api/auth/verify-email` and signs in with the returned login token.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                email: { type: string, format: email, maxLength: 254 }
                password: { $ref: '#/components/schemas/Password' }
                language: { type: [string, 'null'], examples: [de] }
      responses:
        '201':
          description: Account created, confirmation code mailed.
          content:
            application/json:
              schema:
                type: object
                required: [verificationRequired, email]
                properties:
                  verificationRequired: { type: boolean, const: true }
                  email: { type: string, format: email }
        '400':
          description: '`email_taken` (field `email`) or `invalid_request` (no JSON object).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in with e-mail and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, maxLength: 128 }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401':
          description: '`invalid_credentials` (unknown address, wrong password or SSO-only account alike).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: >-
            `email_not_verified` (extra member `email`): right password, but the address is not confirmed. If no
            valid code is waiting and the resend cooldown allows, a fresh code was mailed. A wrong password stays
            `401 invalid_credentials`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/resend-verification:
    post:
      tags: [Auth]
      summary: Send a new confirmation code
      description: >-
        Mails a new code (the earlier ones die). Allowed when the last code mail of the ACCOUNT is at least 5
        minutes old, else `429 verification_resend_too_early` with `retryAt` (ISO-8601 UTC) and `Retry-After`.
        Also limited to 25 requests per client IP and day (`429 rate_limited`), and per account to 10 codes and 20 wrong guesses per rolling 24 hours (`429 rate_limited` with `Retry-After`, no mail on any path, verify keeps answering `invalid_verification_code`). Unknown and already confirmed
        addresses answer 204 like success. Accepted trade-off: the too-early answer reveals that an unconfirmed
        account exists.
      operationId: resendVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                role:
                  type: string
                  enum: [viewer, editor, admin]
                  default: editor
                  description: The role the invitee gets on accepting. Inviting an address with an open invitation sets the role of that invitation (no second mail).
      responses:
        '204': { description: 'Accepted: a code was mailed, or nothing to do for this address.' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429':
          description: >-
            `verification_resend_too_early` (body member `retryAt`, header `Retry-After` in seconds) or
            `rate_limited` (per IP and day).
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Problem' }
                  - type: object
                    properties:
                      retryAt: { type: string, format: date-time, examples: ['2026-10-16T10:05:00Z'] }

  /api/auth/verify-email:
    post:
      tags: [Auth]
      summary: Confirm the e-mail address with the 6-digit code
      description: >-
        Marks the address confirmed and returns a one-time login token (valid `expiresIn` seconds, default 30,
        env `EMAIL_VERIFICATION_LOGIN_TOKEN_TTL`) that is redeemed once at `POST /api/auth/token` with
        `grant_type=one_time_token`. The code is valid 15 minutes, works once, a newer code invalidates it, and
        after 5 wrong attempts it is dead (request a new one). Every failure is the same
        `422 invalid_verification_code` (wrong, expired, used up, unknown or already confirmed address): no
        account oracle. Whitespace in the code is ignored. Rate limited per client IP.
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                code: { type: string, examples: ['048213'] }
      responses:
        '200':
          description: Confirmed.
          content:
            application/json:
              schema:
                type: object
                required: [loginToken, expiresIn]
                properties:
                  loginToken: { type: string, description: 'Opaque; single use, bound to the user and the session version.' }
                  expiresIn: { type: integer, examples: [30] }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '422':
          description: '`invalid_verification_code` (field `code`), or `validation_failed` for a malformed body.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset link
      description: >-
        Always 204, whether or not the address has an account, and also over the rate limit (per address and per
        IP). The mail with `{FRONTEND_URL}/reset-password?token=…` (valid 60 minutes) is sent after the response.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 255 }
      responses:
        '204': { description: Accepted. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with a reset token
      description: Ends all sessions and confirms the address; SSO-only accounts get a password this way. A waiting e-mail change is discarded.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, maxLength: 255 }
                password: { $ref: '#/components/schemas/Password' }
      responses:
        '204': { description: Password set; the user signs in again. }
        '400':
          description: '`invalid_reset_token` (field `token`; unknown, used or expired alike) or `invalid_request`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Change the password
      description: Returns new tokens for the calling session; all other sessions end. A notice mail goes to the account.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, maxLength: 4096 }
                newPassword: { $ref: '#/components/schemas/Password' }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400':
          description: '`invalid_credentials` (field `currentPassword`) or `invalid_request`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`no_password`: SSO-only account (set a password via forgot-password first).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/auth/change-email:
    post:
      tags: [Auth]
      summary: Request an e-mail address change
      description: >-
        204 whether or not the new address is free (no oracle). A confirmation link goes to the new address only if
        it is free and the rate limit allows; a notice goes to the current address. The change completes with
        `GET /api/auth/verify-new-email`.
      operationId: requestEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 255 }
                password: { type: [string, 'null'], maxLength: 4096, description: Current password. }
      responses:
        '204': { description: Accepted. }
        '400':
          description: '`invalid_credentials` (field `password`) or `invalid_request`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`no_password`: SSO-only account.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`validation_failed` (field `email`, also when it is already the current address).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Auth]
      summary: Cancel a waiting e-mail change
      operationId: cancelEmailChange
      responses:
        '204': { description: Cancelled (also when nothing was waiting). }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/verify-new-email:
    get:
      tags: [Auth]
      summary: Confirm a new e-mail address (link from the mail)
      description: Ends all sessions on success.
      operationId: verifyNewEmail
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          description: >-
            Redirect to `{FRONTEND_URL}/auth/verify-email?status=email_changed` or
            `?status=error&reason=invalid|expired|already_used|email_taken&flow=email_change`.
          headers:
            Location: { $ref: '#/components/headers/Location' }

  /api/auth/token:
    post:
      tags: [Auth]
      summary: Refresh the tokens
      description: >-
        OAuth 2.0 style refresh with a **form-encoded** body. Returns a new access AND refresh token (rotation: the
        presented refresh token is used up; see Authentication for reuse detection, the grace window and the absolute
        session lifetime).
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - type: object
                  required: [grant_type, refresh_token]
                  properties:
                    grant_type: { type: string, const: refresh_token }
                    refresh_token: { type: string }
                - type: object
                  description: >-
                    One-time login token (from `POST /api/auth/verify-email`, or the `code` of the SSO redirect): single use, expires after its own
                    TTL, bound to the user's session version; answers like a login.
                  required: [grant_type, token]
                  properties:
                    grant_type: { type: string, const: one_time_token }
                    token: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400':
          description: >-
            `invalid_grant`: unknown `grant_type`, token missing, or (`one_time_token`) the token is invalid,
            expired, used before or for a user whose sessions ended or whose address is not confirmed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: '`invalid_refresh_token`: invalid, expired, unknown, revoked (logout, reuse), session lifetime over, user gone, sessions ended or the address is not confirmed.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out (end the session of a refresh token)
      description: >-
        Revokes the session (all tokens of the family) of the refresh token in the body. Idempotent and uniform: always
        `200 {"ok": true}`, also for an unknown, expired, already revoked or malformed token, a missing token or a
        body that is not JSON (no oracle). Other sessions stay; access tokens stay valid until they expire. No
        authentication needed; clients leave out the access token (an expired one would be answered with 401).
      operationId: logout
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/logout-all:
    post:
      tags: [Auth]
      summary: Sign out everywhere
      description: >-
        Ends all sessions of the user: the session version is raised (every access token, including the caller's,
        stops working) and all refresh tokens are revoked. The caller signs in again.
      operationId: logoutAll
      responses:
        '204': { description: All sessions ended. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: The signed-in user
      operationId: getMe
      responses:
        '200':
          description: Profile, sign-in methods and preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Auth]
      summary: Update name and preferences
      description: >-
        `lastCalendarId` is also remembered at the membership of the calendar's club (ignored without error when the
        calendar is unknown, belongs to another club than `lastClubId` or the user is no member). A field of the wrong
        JSON type (`dateFormat: 5`, `firstDayOfWeek: "1"` / `1.5` / `true`, `language: null`, `lastClubId: 5`,
        `lastCalendarId: ["x"]`, …) is a 400 `validation_failed` with the `field`; `null` is accepted only for
        `lastClubId` / `lastCalendarId` (clears them). `name` of the wrong type stays a 422.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                dateFormat: { type: string, minLength: 1, maxLength: 20, examples: [dd.MM.yyyy] }
                firstDayOfWeek: { type: integer, minimum: 0, maximum: 6, description: 0 = Sunday. }
                language: { type: string, enum: [en, de] }
                lastClubId: { type: [string, 'null'], maxLength: 36 }
                lastCalendarId: { type: [string, 'null'], maxLength: 36 }
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Auth]
      summary: Delete the account
      description: >-
        Needs re-authentication (AUTH-03): an account with a password sends `password`; an account without one
        (SSO-only, passkey-only) sends the 6-digit `code` that `POST /api/auth/delete-account/code` mailed to its
        address. Every attempt counts against 5 per 15 minutes per user (and the per-IP limit): `429 rate_limited`.
        Nothing is deleted before the proof is valid. Then refused with `422 last_member_of_club` while the user is
        the only member of a club (no club is named): delete that club first (`DELETE /api/clubs/{clubId}`) or add
        another member.
      operationId: deleteMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: [string, 'null'], maxLength: 4096, description: Current password (accounts with a password). }
                code: { type: [string, 'null'], maxLength: 32, description: Mailed 6-digit code (accounts without a password). }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400':
          description: >-
            `invalid_credentials` (field `password`: missing or wrong) for an account with a password;
            `invalid_confirmation_code` (field `code`: missing, wrong, expired or of another account) for one without.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: "`last_member_of_club` or `last_admin_of_club` (the only admin of a club that has other members)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: '`rate_limited` (header `Retry-After`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/auth/delete-account/code:
    post:
      tags: [Auth]
      summary: Mail the confirmation code for the account deletion
      description: >-
        Only for accounts without a password. The code is derived from the user, the session version, the address
        and a 10-minute window (nothing is stored): it is valid for 10 to 20 minutes, repeated requests mail the same
        code within a window, and it ends with a password set, a sign-out of all sessions or an address change.
        At most 5 mails per user and hour.
      operationId: sendDeleteAccountCode
      responses:
        '204': { description: The code went to the account's address. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`has_password`: the account has a password, confirm with it.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: '`rate_limited` (header `Retry-After`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/auth/providers:
    get:
      tags: [SSO]
      summary: Configured SSO providers
      description: Only providers with client id and secret configured are listed.
      operationId: listProviders
      security: []
      responses:
        '200':
          description: Providers for the sign-in buttons.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, icon]
                  properties:
                    id: { type: string, examples: [google] }
                    name: { type: string, examples: [Google] }
                    icon: { type: string, examples: [google] }

  # ------------------------------------------------------------------ Passkeys
  /api/auth/webauthn/register/options:
    get:
      tags: [Passkeys]
      summary: Options to register a passkey
      operationId: passkeyRegistrationOptions
      responses:
        '200':
          description: '`PublicKeyCredentialCreationOptions` (JSON, base64url) and the signed challenge token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnOptions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/webauthn/register/verify:
    post:
      tags: [Passkeys]
      summary: Register a passkey
      operationId: passkeyRegistrationVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, response]
              properties:
                challengeToken: { type: string }
                response: { type: object, description: The `PublicKeyCredential` (attestation) as JSON. }
                deviceName: { type: [string, 'null'], maxLength: 255 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400':
          description: '`invalid_request` (body incomplete), `invalid_passkey_registration`, `passkey_already_registered`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/webauthn/authenticate/options:
    get:
      tags: [Passkeys]
      summary: Options to sign in with a passkey
      operationId: passkeyAuthenticationOptions
      security: []
      responses:
        '200':
          description: '`PublicKeyCredentialRequestOptions` (discoverable credentials, empty `allowCredentials`) and the challenge token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnOptions' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/webauthn/authenticate/verify:
    post:
      tags: [Passkeys]
      summary: Sign in with a passkey
      operationId: passkeyAuthenticationVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, response]
              properties:
                challengeToken: { type: string }
                response: { type: object, description: The `PublicKeyCredential` (assertion) as JSON. }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401':
          description: '`invalid_passkey`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/webauthn/{id}:
    delete:
      tags: [Passkeys]
      summary: Delete one of the user's passkeys
      description: >-
        Ends all sessions (session version, refresh tokens) and answers with `{"ok": true}` plus a fresh token pair
        (`access_token`, `refresh_token`, ... like login), so the calling session continues.
      operationId: deletePasskey
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Done, with a fresh token pair.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - type: object
                    required: [ok]
                    properties:
                      ok: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`passkey_not_found` (unknown or another user''s).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------------ SSO
  /api/auth/oauth/{provider}:
    get:
      tags: [SSO]
      summary: Start SSO sign-in (browser navigation)
      operationId: oauthStart
      security: []
      parameters:
        - { $ref: '#/components/parameters/Provider' }
      responses:
        '302':
          description: Redirect to the provider; sets the `oauth_state_nonce` cookie.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Set-Cookie: { $ref: '#/components/headers/StateCookie' }
        '404': { $ref: '#/components/responses/UnknownProvider' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }
    delete:
      tags: [SSO]
      summary: Unlink an SSO provider
      operationId: oauthUnlink
      parameters:
        - { $ref: '#/components/parameters/Provider' }
      responses:
        '204': { description: Unlinked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`oauth_account_not_found`: the provider is not linked.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`last_login_method`: no sign-in method would remain.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/auth/oauth/{provider}/callback:
    get:
      tags: [SSO]
      summary: SSO callback (from the provider)
      description: >-
        Sign-in mode: redirect to `{FRONTEND_URL}/auth/callback?code=<one-time code>` (no access or refresh token in the URL) or `?error=<code>`. Link
        mode: redirect to `{FRONTEND_URL}/profile?link_provider=…&link_proof=…` or `?link_error=<code>`. Codes: see
        the API description (SSO). The state cookie is cleared.
      operationId: oauthCallback
      security: []
      parameters:
        - { $ref: '#/components/parameters/Provider' }
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string }, description: Provider error (e.g. `access_denied`). }
      responses:
        '302':
          description: Redirect to the frontend.
          headers:
            Location: { $ref: '#/components/headers/Location' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }
    post:
      tags: [SSO]
      summary: SSO callback (form POST, Apple)
      description: Same as the GET callback; Apple returns with a cross-site form POST (`state`, `code`, `error` in the body).
      operationId: oauthCallbackPost
      security: []
      parameters:
        - { $ref: '#/components/parameters/Provider' }
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                state: { type: string }
                code: { type: string }
                error: { type: string }
      responses:
        '302':
          description: Redirect to the frontend.
          headers:
            Location: { $ref: '#/components/headers/Location' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/auth/oauth/{provider}/link-start:
    post:
      tags: [SSO]
      summary: Start linking an SSO provider
      description: Returns a one-time ticket URL on this API (60 s, bound to user and session) that the browser opens.
      operationId: oauthLinkStart
      parameters:
        - { $ref: '#/components/parameters/Provider' }
      responses:
        '200':
          description: Ticket URL.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri, examples: ['https://example.org/api/auth/oauth/google/link?ticket=eyJuIjoi.c2ln'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`unknown_provider`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/auth/oauth/{provider}/link:
    get:
      tags: [SSO]
      summary: Open a link ticket (browser navigation)
      operationId: oauthLinkRedirect
      security: []
      parameters:
        - { $ref: '#/components/parameters/Provider' }
        - { name: ticket, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          description: >-
            Redirect to the provider (sets the state cookie), or to `{FRONTEND_URL}/profile?link_error=invalid_state`
            for an invalid, used or expired ticket.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Set-Cookie: { $ref: '#/components/headers/StateCookie' }
        '404': { $ref: '#/components/responses/UnknownProvider' }

  /api/auth/oauth/{provider}/link-complete:
    post:
      tags: [SSO]
      summary: Complete linking an SSO provider
      operationId: oauthLinkComplete
      parameters:
        - { $ref: '#/components/parameters/Provider' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proof]
              properties:
                proof: { type: string, description: '`link_proof` from the redirect (5 minutes, single use).' }
      responses:
        '204': { description: Linked (also when it already was linked to this user). }
        '400':
          description: '`invalid_state`: proof forged, expired, used, or for another user / session.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`account_in_use` (provider account belongs to another user) or `already_linked` (another account of this provider is linked).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------------ Clubs
  /api/clubs:
    get:
      tags: [Clubs]
      summary: The user's clubs
      operationId: listClubs
      responses:
        '200':
          description: Clubs with counters.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClubListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Clubs]
      summary: Create a club
      description: The creator becomes an admin.
      operationId: createClub
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                timezone: { type: string, default: Europe/Berlin }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/clubs/{clubId}:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
    get:
      tags: [Clubs]
      summary: One club with counters
      description: '`eventCount` includes archived calendars; `feedCount` counts the feeds of the club (what deleting the club removes).'
      operationId: getClub
      responses:
        '200':
          description: The club.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClubDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Clubs]
      summary: Update a club
      description: Admins only.
      operationId: updateClub
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                timezone: { type: string }
      responses:
        '200':
          description: The updated club.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Clubs]
      summary: Delete a club with all calendars
      description: Admins only.
      operationId: deleteClub
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/clubs/{clubId}/members:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
    get:
      tags: [Clubs]
      summary: Members of a club
      operationId: listMembers
      responses:
        '200':
          description: Members.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/clubs/{clubId}/invitations:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
    get:
      tags: [Clubs]
      summary: Open and expired invitations of a club
      description: >-
        Newest first. `status` is `pending` (valid) or `expired` (older than 7 days and unanswered). Accepted,
        declined and revoked invitations are not listed. Only admins may read, create, re-send and revoke
        invitations.
      operationId: listClubInvitations
      responses:
        '200':
          description: Invitations.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClubInvitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Clubs]
      summary: Invite an e-mail address to the club
      description: >-
        Replaces the former direct "add member" route (nobody is added without consent, and the answer no longer
        tells whether an address has an account). **204 with an empty body for every well-formed address**:
        unknown, registered, unconfirmed, already a member, already invited. An address that already is a member
        is ignored silently (nothing stored, no mail); an open invitation of this club for the address is kept
        (idempotent, no second mail); an expired one is renewed like a re-send (new token, new 7 days, new mail);
        otherwise an invitation is stored (address normalized to lower case, valid 7 days, SHA-256 hash of a
        random one-time token) and the mail with `{FRONTEND_URL}/invitations?token=…` plus a link to
        `{FRONTEND_URL}/signup` is sent after the response. The mail names the club and the inviter and contains no
        other club data. Over 5 mails per address and day the mail is dropped silently (same answer).
        Limits: 20 invitations/re-sends per user and day and 50 per club and day (`429 rate_limited`, `Retry-After`),
        at most 200 open invitations per club (`422 quota_exceeded`, resource `pendingInvitationsPerClub`;
        independent of the address). Nobody is auto-accepted: after registering with the address and confirming
        it, the invitee finds the invitation via `GET /api/invitations`.
      operationId: inviteMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '204': { description: Accepted (same answer for every address). }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: '`validation_failed` (field `email`) or `quota_exceeded` (`pendingInvitationsPerClub`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/clubs/{clubId}/invitations/{invitationId}/resend:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { $ref: '#/components/parameters/InvitationId' }
    post:
      tags: [Clubs]
      summary: Send an expired invitation again
      description: >-
        Only after the invitation expired: new token (the old link stops working), new 7 days, new mail after the
        response. Earlier it is `422 invitation_not_expired`. Accepted, declined, revoked and unknown invitations
        (also of another club) are `404 invitation_not_found`. Counts against the invitation rate limits of
        `POST /api/clubs/{clubId}/invitations`.
      operationId: resendClubInvitation
      responses:
        '204': { description: Renewed and mailed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Club unknown (no `code`), or `invitation_not_found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`invitation_not_expired`: the invitation is still valid.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/clubs/{clubId}/invitations/{invitationId}:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { $ref: '#/components/parameters/InvitationId' }
    delete:
      tags: [Clubs]
      summary: Revoke an invitation
      description: >-
        Deletes an open or expired invitation; its link stops working. Answered and unknown invitations are
        `404 invitation_not_found`.
      operationId: revokeClubInvitation
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Club unknown (no `code`), or `invitation_not_found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/invitations:
    get:
      tags: [Invitations]
      summary: Own pending invitations
      description: >-
        The open, not expired invitations for the signed-in user's VERIFIED e-mail address (compared case
        insensitively); a user whose address is not confirmed gets an empty list. Only the club name, the inviter's
        name and the expiry are disclosed (no club id, no other club data). One indexed query; also fine for users
        without any club.
      operationId: listOwnInvitations
      responses:
        '200':
          description: Invitations, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OwnInvitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/invitations/accept:
    post:
      tags: [Invitations]
      summary: Accept an invitation by the token of the mail
      description: >-
        The SPA calls this after sign-in with the `token` of `{FRONTEND_URL}/invitations?token=…`. The token only
        identifies the invitation: the signed-in user's verified address must equal the invited one, otherwise
        (also for unknown tokens, answered invitations and unconfirmed users) the answer is the same
        `404 invitation_not_found`. Creates the membership in a transaction under the club lock (member quota
        respected, a user who already is a member is not added twice) and returns the club.
      operationId: acceptInvitationByToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationToken' }
      responses:
        '200':
          description: The club the user joined.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/InvitationNotFound' }
        '422': { $ref: '#/components/responses/InvitationUnprocessable' }

  /api/invitations/decline:
    post:
      tags: [Invitations]
      summary: Decline an invitation by the token of the mail
      description: Same identification and errors as `POST /api/invitations/accept`; nobody is added and the invitation disappears from the club's list.
      operationId: declineInvitationByToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationToken' }
      responses:
        '204': { description: Declined. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/InvitationNotFound' }
        '422': { $ref: '#/components/responses/InvitationUnprocessable' }

  /api/invitations/{invitationId}/accept:
    parameters:
      - { $ref: '#/components/parameters/InvitationId' }
    post:
      tags: [Invitations]
      summary: Accept an invitation from the own list
      description: Like `POST /api/invitations/accept`, identified by the `id` of `GET /api/invitations`.
      operationId: acceptInvitation
      responses:
        '200':
          description: The club the user joined.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/InvitationNotFound' }
        '422': { $ref: '#/components/responses/InvitationUnprocessable' }

  /api/invitations/{invitationId}/decline:
    parameters:
      - { $ref: '#/components/parameters/InvitationId' }
    post:
      tags: [Invitations]
      summary: Decline an invitation from the own list
      description: Like `POST /api/invitations/decline`, identified by the `id` of `GET /api/invitations`.
      operationId: declineInvitation
      responses:
        '204': { description: Declined. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/InvitationNotFound' }
        '422': { $ref: '#/components/responses/InvitationUnprocessable' }

  /api/clubs/{clubId}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { name: userId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Clubs]
      summary: Change the role of a member
      description: >-
        Admins only (`403`, checked again under the club lock). Demoting the last admin is `422 last_admin`;
        an unknown role is `422 invalid_role` (field `role`). An id that is no member is `404 member_not_found`.
      operationId: changeMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [viewer, editor, admin] }
      responses:
        '200':
          description: The member with the new role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Club unknown (no `code`), or `member_not_found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`invalid_role` or `last_admin`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Clubs]
      summary: Remove a member
      description: >-
        Removes the membership. Leaving the club oneself is open to every role; removing somebody else needs an
        admin (`403`). An id that is no member of the club is
        `404 member_not_found`, the same answer for unknown ids and for users outside the club. The last
        member can neither be removed nor leave: `422 last_member` (a club never has zero members; the
        club row is locked for the check, so concurrent removals cannot empty it). Delete the club instead.
        The last admin cannot be removed or leave while other members remain: `422 last_admin` (promote
        somebody first).
      operationId: removeMember
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Club unknown (no `code`), or `member_not_found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`last_member`: the user is the only member of the club; `last_admin`: the user is the only admin."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------------ Calendars
  /api/clubs/{clubId}/calendars:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
    get:
      tags: [Calendars]
      summary: Calendars of a club
      description: Active calendars first, then by name.
      operationId: listCalendars
      parameters:
        - { name: includeArchived, in: query, schema: { type: string, enum: ['true', 'false'], default: 'false' } }
      responses:
        '200':
          description: Calendars with counters.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Calendar' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Calendars]
      summary: Create a calendar
      operationId: createCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                timezone: { type: [string, 'null'], maxLength: 100, description: Null = the club's zone. }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendar' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/clubs/{clubId}/calendars/{calendarId}:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { $ref: '#/components/parameters/CalendarId' }
    get:
      tags: [Calendars]
      summary: One calendar
      operationId: getCalendar
      responses:
        '200':
          description: The calendar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Calendars]
      summary: Rename a calendar or change its zone
      description: >-
        Denied (403) for archived calendars, which are read-only. Deleting and duplicating an archived
        calendar stays allowed on purpose, as do archive and unarchive.
      operationId: updateCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                timezone: { type: [string, 'null'] }
      responses:
        '200':
          description: The updated calendar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendar' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Calendars]
      summary: Delete a calendar with all its data
      description: >-
        Also allowed for archived calendars (deliberate). Feeds whose only calendar this is are deleted too
        (`exclusiveFeedCount`); feeds that select further calendars just lose this one.
      operationId: deleteCalendar
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/clubs/{clubId}/calendars/{calendarId}/archive:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { $ref: '#/components/parameters/CalendarId' }
    post:
      tags: [Calendars]
      summary: Archive a calendar (read-only, feeds 404)
      operationId: archiveCalendar
      responses:
        '200':
          description: The archived calendar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/clubs/{clubId}/calendars/{calendarId}/unarchive:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { $ref: '#/components/parameters/CalendarId' }
    post:
      tags: [Calendars]
      summary: Restore an archived calendar
      operationId: unarchiveCalendar
      responses:
        '200':
          description: The calendar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/clubs/{clubId}/calendars/{calendarId}/duplicate:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { $ref: '#/components/parameters/CalendarId' }
    post:
      tags: [Calendars]
      summary: Duplicate a calendar
      description: >-
        Copies the properties, features and templates (the copied templates reference the copy's own properties and
        features, but keep the same club-level locations and target groups), but no events, series or feeds. The body is optional. Also allowed for archived calendars (deliberate).
      operationId: duplicateCalendar
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: [string, 'null'], maxLength: 255, description: 'Name of the copy (localized by the client); default "Copy of …".' }
      responses:
        '201':
          description: The copy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendar' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/QuotaExceeded' }

  # ------------------------------------------------------------------ Events
  /api/calendars/{calendarId}/events:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    get:
      tags: [Events]
      summary: Events of a calendar (drafts included)
      description: >-
        Ordered by date and start time. `from`/`to` select by overlap (multi-day events reaching into the range are
        included); both strictly `YYYY-MM-DD` (a real day; `now`, `2026-02-31` or an array are a 400
        `validation_failed` with field `from`/`to`), `to` before `from` is a 400 on `to`, and a range longer than
        1830 days (about five years) a 400 on `to`. At most `limit` (default and maximum 5000) events are returned
        per request; page with `offset`. The body stays a plain list, the number of all matches is in the
        `X-Total-Count` header. Without `from`/`to` the first 5000 events are returned.
      operationId: listEvents
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, description: 'Page size, 1..5000 (default 5000); outside → 400 `validation_failed` field `limit`.', schema: { type: integer, minimum: 1, maximum: 5000, default: 5000 } }
        - { name: offset, in: query, description: 'Events to skip (default 0).', schema: { type: integer, minimum: 0, default: 0 } }
        - { name: targetGroupIds, in: query, description: Comma-separated target group ids (events with at least one)., schema: { type: string } }
      responses:
        '200':
          description: Events.
          headers:
            X-Total-Count:
              description: Number of all events matching `from`/`to`/`targetGroupIds` (before `limit`/`offset`).
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Events]
      summary: Create an event
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnknownReference' }

  /api/calendars/{calendarId}/events/{id}:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Events]
      summary: One event with its series
      operationId: getEvent
      responses:
        '200':
          description: The event; `series` is the series (rule + `eventCount`) or null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventWithSeries' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Events]
      summary: Update an event (or all events of its series)
      description: >-
        Partial. `scope: "this"` (default) changes only this event; `scope: "all"` applies the sent fields to every
        event of the series in one transaction, except `date`, `dateEnd`, `eventTemplateId`, `externalUid` (each
        event keeps its day). A missing or null id list leaves the assignments unchanged. The response is the edited
        event.
      operationId: updateEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventPatch' }
      responses:
        '200':
          description: The updated event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnknownReference' }
    delete:
      tags: [Events]
      summary: Delete an event (or its whole series)
      operationId: deleteEvent
      parameters:
        - name: scope
          in: query
          description: '`this` (default) deletes the event (its series goes once empty); `all` deletes the series with all its events.'
          schema: { $ref: '#/components/schemas/Scope' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/calendars/{calendarId}/events/from-template:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    post:
      tags: [Events]
      summary: Create events from a template on given dates
      description: >-
        One event per date with the template's values (name, zone, times, assignments, location), as drafts unless
        `overrides.isDraft` says otherwise. A template without times creates all-day events (00:00-23:59) unless the
        overrides bring times. Not linked as a series. Without `templateId` / with missing or empty `dates`:
        `400 validation_failed` field `templateId` / `dates`.
      operationId: createEventsFromTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateId, dates]
              properties:
                templateId: { type: string }
                dates: { type: array, minItems: 1, items: { type: string, format: date } }
                overrides:
                  type: object
                  description: Values replacing the template's.
                  properties:
                    name: { type: string }
                    timezone: { type: [string, 'null'] }
                    timeBegin: { $ref: '#/components/schemas/Time' }
                    timeEnd: { $ref: '#/components/schemas/Time' }
                    isAllDay: { type: boolean }
                    isDraft: { type: boolean }
                    locationId: { type: [string, 'null'] }
                    propertyIds: { $ref: '#/components/schemas/IdList' }
                    featureIds: { $ref: '#/components/schemas/IdList' }
                    targetGroupIds: { $ref: '#/components/schemas/IdList' }
      responses:
        '201':
          description: The created events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404':
          description: Calendar or template unknown (no `code`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/UnknownReference' }

  /api/calendars/{calendarId}/events/bulk:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    post:
      tags: [Events]
      summary: Publish, unpublish or delete several events
      description: >-
        All or nothing in one transaction. Every id must belong to the calendar (unknown and foreign ids alike → 422
        `unknown_reference` field `ids`, nothing happens); duplicate ids count once. At most 5000 ids (413
        `too_many_events`). Series left without events are removed.
      operationId: bulkEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids: { type: array, minItems: 1, maxItems: 5000, items: { type: string, maxLength: 36 } }
                action: { type: string, enum: [publish, draft, delete] }
      responses:
        '200':
          description: Number of events of the request (also when a value did not change).
          content:
            application/json:
              schema:
                type: object
                required: [affected]
                properties:
                  affected: { type: integer }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooManyEvents' }
        '422': { $ref: '#/components/responses/UnknownReference' }

  # ------------------------------------------------------------------ Event series
  /api/calendars/{calendarId}/events/series/preview:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    post:
      tags: [Event series]
      summary: Preview the dates of a series rule
      description: Same validation as creating; writes nothing. A rule without dates is no error here (`count` 0).
      operationId: previewSeries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule]
              properties:
                rule: { $ref: '#/components/schemas/SeriesRuleInput' }
                event:
                  type: object
                  properties:
                    durationDays: { $ref: '#/components/schemas/DurationDays' }
      responses:
        '200':
          description: Dates and holidays.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesPreview' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/SeriesTooMany' }

  /api/calendars/{calendarId}/events/series:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    post:
      tags: [Event series]
      summary: Create a series with all its events
      description: >-
        Atomic: an invalid field or a reference of another calendar saves nothing. Template values are taken like
        `from-template` (template without times → all-day); `event` fields override them. Events are drafts unless
        `isDraft` / `event.isDraft` is false. `event.date`/`event.dateEnd` are not allowed (set by the rule and
        `event.durationDays`). Errors of event fields carry `field: event.<name>`.
      operationId: createSeries
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeriesCreateInput' }
      responses:
        '201':
          description: The series and its events.
          content:
            application/json:
              schema:
                type: object
                required: [series, events]
                properties:
                  series: { $ref: '#/components/schemas/Series' }
                  events: { type: array, items: { $ref: '#/components/schemas/Event' } }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: >-
            `too_many_events` (more than 366), `validation_failed` field `rule` (the rule creates no events) or
            `unknown_reference` (e.g. `templateId`, `event.locationId`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/calendars/{calendarId}/event-series/{seriesId}:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
      - { $ref: '#/components/parameters/SeriesId' }
    get:
      tags: [Event series]
      summary: Rule and event count of a series
      description: Also readable in archived calendars. A series of another calendar is 404.
      operationId: getSeries
      responses:
        '200':
          description: The series.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Event series]
      summary: Change the rule of a series (future events only)
      description: >-
        Applies the new rule to the future events (date ≥ today in the calendar's zone); past events stay. The new
        rule yields its full set of dates from its start (`count`/`until` count over the whole series). Future
        events on a date of the set stay unchanged (also individually edited ones), missing dates get new events
        with the values of the prototype (earliest future event, else the latest one), future events on other dates
        are deleted. `durationDays` keeps the series' value. One transaction with the series row locked.
      operationId: updateSeries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule]
              properties:
                rule: { $ref: '#/components/schemas/SeriesRuleInput' }
      responses:
        '200':
          description: The series and counts of the change.
          content:
            application/json:
              schema:
                type: object
                required: [series, created, deleted, kept]
                properties:
                  series: { $ref: '#/components/schemas/Series' }
                  created: { type: integer }
                  deleted: { type: integer }
                  kept: { type: integer }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SeriesConflict' }
        '422': { $ref: '#/components/responses/SeriesTooMany' }

  /api/calendars/{calendarId}/event-series/{seriesId}/preview-update:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
      - { $ref: '#/components/parameters/SeriesId' }
    post:
      tags: [Event series]
      summary: Preview a rule change
      description: What `PATCH` with the same rule would do now; writes nothing.
      operationId: previewSeriesUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule]
              properties:
                rule: { $ref: '#/components/schemas/SeriesRuleInput' }
      responses:
        '200':
          description: Planned changes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesUpdatePreview' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SeriesConflict' }
        '422': { $ref: '#/components/responses/SeriesTooMany' }

  # ------------------------------------------------------------------ Import & export
  /api/calendars/{calendarId}/events/import/preview:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    post:
      tags: [Import & export]
      summary: Dry run of an import
      description: >-
        Status per entry (`new`, `duplicate`, `invalid`) with the same validation as the import; writes nothing.
        The ICS file is parsed in the browser; the API gets the reviewed events as JSON.
      operationId: previewImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportInput' }
      responses:
        '200':
          description: Result per entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportPreview' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooManyEvents' }
        '422': { $ref: '#/components/responses/UnknownReference' }

  /api/calendars/{calendarId}/events/import:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    post:
      tags: [Import & export]
      summary: Import events (atomic)
      description: >-
        All or nothing in one transaction. New places in `locations` are referenced by `locationTempId` and only
        created when an imported event uses them. With `skipDuplicates` duplicates are skipped (still validated).
        The first invalid entry fails the request with `field: events[n].<field>`.
      operationId: importEvents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportInput' }
      responses:
        '201':
          description: Imported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooManyEvents' }
        '422': { $ref: '#/components/responses/UnknownReference' }

  /api/calendars/{calendarId}/events.ics:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    get:
      tags: [Import & export]
      summary: ICS download of a calendar's events (members)
      description: >-
        Built like the feeds (VTIMEZONE, property icons, Apple location); series events are single VEVENTs. Drafts
        only with `includeDrafts` (as `STATUS:TENTATIVE`). Allowed for archived calendars.
      operationId: exportIcs
      parameters:
        - { name: from, in: query, description: Events ending on or after this day., schema: { type: string, format: date } }
        - { name: to, in: query, description: Events starting on or before this day (not before `from`)., schema: { type: string, format: date } }
        - { name: includeDrafts, in: query, schema: { type: string, enum: ['true', 'false', '1', '0'], default: 'false' } }
        - name: 'targetGroupIds[]'
          in: query
          description: Ids of target groups of this calendar (at most 100); a comma-separated `targetGroupIds` is accepted too.
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
      responses:
        '200':
          description: 'iCalendar file (`Content-Disposition: attachment; filename="<calendar-slug>.ics"`).'
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            text/calendar:
              schema: { type: string }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnknownReference' }

