                        usage: { $ref: '#/components/schemas/LinkUsage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Features]
      summary: Create an extra (feature)
      operationId: createFeature
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feature' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DuplicateName' }

  /api/calendars/{calendarId}/features/{id}:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Features]
      summary: Rename an extra (feature)
      operationId: updateFeature
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamePatch' }
      responses:
        '200':
          description: The updated extra (feature).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feature' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DuplicateName' }
    delete:
      tags: [Features]
      summary: Delete an extra (feature; detached from events and templates)
      operationId: deleteFeature
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ Target groups
  /api/clubs/{clubId}/target-groups:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
    get:
      tags: [Target groups]
      summary: Audiences (target groups) of a club
      operationId: listTargetGroups
      responses:
        '200':
          description: Audiences (target groups) with `usage` (incl. feeds that selected them).
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - { $ref: '#/components/schemas/TargetGroup' }
                    - type: object
                      required: [usage]
                      properties:
                        usage: { $ref: '#/components/schemas/TargetGroupUsage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Target groups]
      summary: Create an audience (target group)
      operationId: createTargetGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetGroup' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DuplicateName' }

  /api/clubs/{clubId}/target-groups/{id}:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Target groups]
      summary: Rename an audience (target group)
      operationId: updateTargetGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamePatch' }
      responses:
        '200':
          description: The updated audience (target group).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetGroup' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DuplicateName' }
    delete:
      tags: [Target groups]
      summary: Delete an audience (target group; detached from events, templates and feeds)
      operationId: deleteTargetGroup
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ Locations
  /api/clubs/{clubId}/locations:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
    get:
      tags: [Locations]
      summary: Locations of a club
      operationId: listLocations
      responses:
        '200':
          description: Locations with `usage`.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - { $ref: '#/components/schemas/Location' }
                    - type: object
                      required: [usage]
                      properties:
                        usage: { $ref: '#/components/schemas/LocationUsage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Locations]
      summary: Create a location
      description: All fields are optional (a place may have only coordinates or only a name).
      operationId: createLocation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/QuotaExceeded' }

  /api/clubs/{clubId}/locations/{id}:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Locations]
      summary: Update a location
      operationId: updateLocation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationInput' }
      responses:
        '200':
          description: The updated location.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Locations]
      summary: Delete a location (events and templates lose it)
      operationId: deleteLocation
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ Feeds (management)
  /api/clubs/{clubId}/feeds:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
    get:
      tags: [Feeds]
      summary: Feeds of a club
      description: >-
        Editors and admins only (a viewer is 403: the addresses and secrets). Without `includeSecret` the feeds
        carry no `sharedSecret`.
      operationId: listFeeds
      parameters:
        - { $ref: '#/components/parameters/IncludeSecret' }
      responses:
        '200':
          description: Feeds (with `sharedSecret` only when `includeSecret` is set).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Feed' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Feeds]
      summary: Create a feed
      description: >-
        Admin only. `calendarIds` (required, at least one calendar of the club, archived ones allowed) selects what the
        feed publishes. `visibility` defaults to `CLUB`; every feed gets a secret (only `PRIVATE` requires it),
        returned only with `includeSecret`. Quota `feedsPerClub`.
      operationId: createFeed
      parameters:
        - { $ref: '#/components/parameters/IncludeSecret' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/FeedInput' }
                - { required: [name, calendarIds] }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feed' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/FeedInputRejected' }

  /api/clubs/{clubId}/feeds/{feedId}:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { $ref: '#/components/parameters/FeedId' }
    get:
      tags: [Feeds]
      summary: One feed
      description: Editors and admins. A feed of another club is 404 like an unknown id.
      operationId: getFeed
      parameters:
        - { $ref: '#/components/parameters/IncludeSecret' }
      responses:
        '200':
          description: The feed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feed' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Feeds]
      summary: Update a feed
      description: >-
        Switching from
        `PUBLIC`/`CLUB` to `PRIVATE` generates a new secret. `targetGroupIds` and `calendarIds` replace the selection when present (`calendarIds` must then be non-empty).
      operationId: updateFeed
      parameters:
        - { $ref: '#/components/parameters/IncludeSecret' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedInput' }
      responses:
        '200':
          description: The updated feed (including `indexable`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feed' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/FeedInputRejected' }
    delete:
      tags: [Feeds]
      summary: Delete a feed
      operationId: deleteFeed
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/clubs/{clubId}/feeds/{feedId}/regenerate-secret:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { $ref: '#/components/parameters/FeedId' }
    post:
      tags: [Feeds]
      summary: Generate a new secret (old links stop working for private feeds)
      description: >-
        The new secret is returned only with `includeSecret`. The old secret stops working in every case. The optional
        body `{revokeClaimed: bool}` (default false; an empty body is fine) also deletes all stored accesses with
        source `claimed` of the feed (people who opened it with the old secret); `assigned` accesses stay. Staff are
        unaffected.
      operationId: regenerateFeedSecret
      parameters:
        - { $ref: '#/components/parameters/IncludeSecret' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                revokeClaimed: { type: boolean, default: false }
      responses:
        '200':
          description: The feed (with its new `sharedSecret` when `includeSecret` is set).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feed' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/clubs/{clubId}/feeds/{feedId}/members:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { $ref: '#/components/parameters/FeedId' }
    get:
      tags: [Feeds]
      summary: People with access to a feed (paginated, searchable)
      description: >-
        Editors and admins. Ordered by name, then id; the body is a plain list of one page, the number of all matches
        is in `X-Total-Count`. `q` matches name or e-mail (case-insensitive, at most 100 characters). Works for any
        feed (rows that remain after a visibility change stay listed and removable); rows only matter while the feed
        is `PRIVATE`, and are kept if it is switched to another visibility.
      operationId: listFeedMembers
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, description: '1..100 (default 10).', schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: source, in: query, schema: { type: string, enum: [assigned, claimed] } }
      responses:
        '200':
          description: One page.
          headers:
            X-Total-Count: { description: 'Number of all matches.', schema: { type: integer } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FeedMember' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Feeds]
      summary: Give club members access to a PRIVATE feed
      description: >-
        Editors and admins. `userIds` (at most 500) must all be members of the club (422 `unknown_reference`, nothing
        written). Idempotent; the source becomes `assigned` (a `claimed` row is upgraded). Only for `PRIVATE` feeds
        (422 `invalid_request` otherwise). Quota `feedMembersPerFeed`. `added` counts people newly assigned or upgraded.
      operationId: addFeedMembers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds: { type: array, maxItems: 500, items: { type: string } }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [added]
                properties:
                  added: { type: integer }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/FeedInputRejected' }

  /api/clubs/{clubId}/feeds/{feedId}/members/by-email:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { $ref: '#/components/parameters/FeedId' }
    post:
      tags: [Feeds]
      summary: Give club members access to a PRIVATE feed by e-mail address
      description: >-
        Editors and admins. `emails` (at most 500) are normalized; only addresses of existing members of the club are
        added, the others are returned in `unknown` and ignored (staff can see member addresses anyway). Same rules as
        `POST …/members`.
      operationId: addFeedMembersByEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emails]
              properties:
                emails: { type: array, maxItems: 500, items: { type: string } }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [added, unknown]
                properties:
                  added: { type: integer }
                  unknown: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/FeedInputRejected' }

  /api/clubs/{clubId}/feeds/{feedId}/members/bulk-delete:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { $ref: '#/components/parameters/FeedId' }
    post:
      tags: [Feeds]
      summary: Remove the access of several people
      description: Editors and admins. `userIds` (at most 500); ids without a stored access are ignored. Staff keep reading through their role.
      operationId: bulkDeleteFeedMembers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds: { type: array, maxItems: 500, items: { type: string } }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: { type: integer }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/clubs/{clubId}/feeds/{feedId}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { $ref: '#/components/parameters/FeedId' }
      - { name: userId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Feeds]
      summary: Remove the access of one person
      description: Editors and admins. Idempotent (no stored access is fine).
      operationId: deleteFeedMember
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ Personal subscription
  /api/clubs/{clubId}/my-subscription:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
    get:
      tags: [Clubs]
      summary: The own personal subscription ("Mein Abo")
      description: >-
        Every club member (any role incl. `member`), own data only. One subscription per (user, club), created on the
        first call without feeds (`selectedFeedIds` empty). `secret` is the personal secret of the subscription
        address and always included. Selected feeds the user can no longer access (or whose calendars are all
        archived) are left out. Empty `targetGroupIds` = all groups.
      operationId: getMySubscription
      responses:
        '200':
          description: The subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Clubs]
      summary: Replace the selection of the personal subscription
      description: >-
        Replace semantics; both keys are required (400 otherwise), at most 500 distinct ids each. `feedIds` must be
        feeds the user may include now (`PUBLIC`/`CLUB`, `PRIVATE` for staff or with stored access, with an active
        calendar), `targetGroupIds` must belong to the club; any other id is 422 `unknown_reference` (field
        `feedIds` / `targetGroupIds`) and nothing is written. Stale selections are dropped by the replace.
      operationId: replaceMySubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedIds, targetGroupIds]
              properties:
                feedIds: { type: array, maxItems: 500, items: { type: string } }
                targetGroupIds: { type: array, maxItems: 500, items: { type: string } }
      responses:
        '200':
          description: The subscription after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberSubscription' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: "`unknown_reference`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/clubs/{clubId}/my-subscription/rotate-secret:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
    post:
      tags: [Clubs]
      summary: Issue a new secret for the personal subscription
      description: Every club member, own subscription only. The old address stops working at once. 10 per user and hour (429 `rate_limited`).
      operationId: rotateMySubscriptionSecret
      responses:
        '200':
          description: The subscription with the new secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/clubs/{clubId}/my-events:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
    get:
      tags: [Clubs]
      summary: Calendar view of the personal subscription
      description: >-
        Every club member (also plain `member`). Same payload and limits as the public web view `/api/feed/{feedId}/events`,
        over the effective feeds of the personal subscription (selected feeds the user may access now, non-archived
        calendars, published events only; holidays de-duplicated by uid; the club time zone). `feed` is a header with
        `name` "Mein Abo", `visibility` PRIVATE, `indexable` false; it never contains a secret (`id` is the subscription id, empty while none exists). Without `targetGroupIds`
        the subscription's own target groups apply; a given list (also empty = all groups) overrides it. Does not create the
        subscription (none = empty result).
      operationId: listMyEvents
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: targetGroupIds, in: query, description: 'Target group ids (`targetGroupIds[]=` or comma-separated); present but empty = all groups.', schema: { type: array, items: { type: string } } }
      responses:
        '200':
          description: Header, events and holidays.
          content:
            application/json:
              schema:
                type: object
                required: [feed, events, holidays]
                properties:
                  feed: { $ref: '#/components/schemas/PublicFeedHeader' }
                  events: { type: array, items: { $ref: '#/components/schemas/PublicEvent' } }
                  holidays: { type: array, items: { $ref: '#/components/schemas/HolidayEvent' } }
        '400': { description: Invalid or too wide date range, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/clubs/{clubId}/my-events/{eventId}:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
      - { name: eventId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Clubs]
      summary: One event of the personal subscription
      description: A published event of the effective feeds; drafts, events of other feeds and unknown ids are the same 404.
      operationId: getMyEvent
      responses:
        '200':
          description: Header and event.
          content:
            application/json:
              schema:
                type: object
                required: [feed, event]
                properties:
                  feed: { $ref: '#/components/schemas/PublicFeedHeader' }
                  event: { $ref: '#/components/schemas/PublicEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/clubs/{clubId}/my-feeds:
    parameters:
      - { $ref: '#/components/parameters/ClubId' }
    get:
      tags: [Clubs]
      summary: Feeds the user may select for the personal subscription
      description: >-
        Every club member. Only feeds the user may include (see `PUT …/my-subscription`) and that have at least one
        non-archived calendar; never a feed secret. Also the club's target groups (names only).
      operationId: listMyFeeds
      responses:
        '200':
          description: Selectable feeds and target groups.
          content:
            application/json:
              schema:
                type: object
                required: [feeds, targetGroups]
                properties:
                  feeds:
                    type: array
                    items:
                      type: object
                      required: [id, name, visibility, calendarNames, accessReason, selected]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        visibility: { type: string, enum: [PUBLIC, CLUB, PRIVATE] }
                        calendarNames: { type: array, items: { type: string }, description: 'Non-archived calendars of the feed.' }
                        accessReason: { type: string, enum: [club, public, staff, assigned, claimed], description: 'Why the user may select it: `club`/`public` by visibility, `staff` (viewer or above, PRIVATE feeds), `assigned`/`claimed` stored access.' }
                        selected: { type: boolean }
                  targetGroups:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: string }
                        name: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ Public feed
  /api/feed/{feedId}/claim:
    parameters:
      - { $ref: '#/components/parameters/FeedId' }
    post:
      tags: [Public feed]
      summary: Join the club / gain access through a feed (signed in)
      description: >-
        The only feed route that is NOT public: it needs a JWT, a confirmed e-mail address and current consent
        (plain `member` accounts may call it). Body `{secret?}`, required for `PRIVATE` feeds (compared in constant
        time). Unknown feed, wrong or missing secret and a feed whose calendars are all archived give the same 404
        `feed_not_found`. In one transaction under the club lock: a user who is not a member becomes a member (role
        `member`) if the club setting `feedSignup` allows the feed's visibility (else 403 `member_signup_disabled`;
        quotas `membersPerClub`, `clubsPerUser`); for a `PRIVATE` feed a non-staff user gets a stored access with source
        `claimed` (idempotent, an `assigned` one is never downgraded; staff need none). Existing members may always
        claim. 20 per user and hour and 60 per client IP and hour (429 `rate_limited`).
      operationId: claimFeed
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                secret: { type: string }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedClaimResult' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Not allowed: `member_signup_disabled`, `email_verification_required` or `consent_required`.' }
        '404': { description: '`feed_not_found`.' }
        '422': { $ref: '#/components/responses/QuotaExceeded' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/feed/{feedId}/membership:
    parameters:
      - { $ref: '#/components/parameters/FeedId' }
    get:
      tags: [Public feed]
      summary: What the feed page offers the signed-in user
      description: >-
        JWT required (confirmed e-mail). `?secret=` is required for `PRIVATE` feeds; without a valid secret the answer is
        404 `feed_not_found`, so a private feed's existence is not revealed. Used to choose the button text (join,
        add to the account). Same per-IP and per-feed rate limit as the other feed routes.
      operationId: feedMembership
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/FeedSecret' }
      responses:
        '200':
          description: The state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedMembership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: '`feed_not_found`.' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/feed/{feedId}/events:
    parameters:
      - { $ref: '#/components/parameters/FeedId' }
    get:
      tags: [Public feed]
      summary: Web view of a feed (header, events, holidays)
      description: >-
        All three feed routes are rate-limited before any lookup: `FEED_RATE_LIMIT_PER_IP` (default 120) per client IP and `FEED_RATE_LIMIT_PER_FEED` (default 600) per `feedId` of the URL (unchecked, so unknown ids behave like known ones) per minute, 0 = off; over a limit `429 rate_limited` + `Retry-After`.
        Published events of all non-archived calendars of the feed, merged and sorted by date and start time
        (optionally limited to `from`/`to` by overlap), and the holidays of those calendars in the same range.
        Holidays are de-duplicated by their `uid` (the same non-empty uid is listed once, the first in
        date-then-id order wins; holidays without uid are never collapsed). Access (secret) is checked before the range. See "Feeds, visibility and robots
        rules" for the headers.
      operationId: publicFeedEvents
      security: [{}, { feedSecret: [] }]
      parameters:
        - { $ref: '#/components/parameters/FeedSecret' }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/FeedTargetGroupIds' }
      responses:
        '200':
          description: Feed header, events and holidays.
          headers:
            Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
            X-Robots-Tag: { $ref: '#/components/headers/XRobotsTag' }
          content:
            application/json:
              schema:
                type: object
                required: [feed, events, holidays]
                properties:
                  feed: { $ref: '#/components/schemas/PublicFeedHeader' }
                  events: { type: array, items: { $ref: '#/components/schemas/PublicEvent' } }
                  holidays: { type: array, items: { $ref: '#/components/schemas/HolidayEvent' } }
        '400': { $ref: '#/components/responses/FeedBadRequest' }
        '403': { $ref: '#/components/responses/FeedForbidden' }
        '404': { $ref: '#/components/responses/FeedNotFound' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/feed/{feedId}/events/{eventId}:
    parameters:
      - { $ref: '#/components/parameters/FeedId' }
      - { name: eventId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Public feed]
      summary: One published event of a feed
      description: Drafts, events of calendars that are not (or no longer, archived) part of the feed or outside the feed's audiences (target groups) and unknown ids are all 404. The secret is checked first.
      operationId: publicFeedEvent
      security: [{}, { feedSecret: [] }]
      parameters:
        - { $ref: '#/components/parameters/FeedSecret' }
      responses:
        '200':
          description: Feed header and the event.
          headers:
            Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
            X-Robots-Tag: { $ref: '#/components/headers/XRobotsTag' }
          content:
            application/json:
              schema:
                type: object
                required: [feed, event]
                properties:
                  feed: { $ref: '#/components/schemas/PublicFeedHeader' }
                  event: { $ref: '#/components/schemas/PublicEvent' }
        '400': { $ref: '#/components/responses/FeedBadRequest' }
        '403': { $ref: '#/components/responses/FeedForbidden' }
        '404': { $ref: '#/components/responses/FeedNotFound' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/feed/{feedId}/events/{eventId}/ics:
    parameters:
      - { $ref: '#/components/parameters/FeedId' }
      - { name: eventId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Public feed]
      summary: ICS download of one published event of a feed
      description: Same access and 404 rules as `/api/feed/{feedId}/events/{eventId}` (secret first). The VEVENT and VTIMEZONE are rendered exactly like in the feed ICS (summary, description, location, geo). No ETag; `Cache-Control` is `private, no-store`.
      operationId: publicFeedEventIcs
      security: [{}, { feedSecret: [] }]
      parameters:
        - { $ref: '#/components/parameters/FeedSecret' }
      responses:
        '200':
          description: 'iCalendar with one event (`Content-Disposition: attachment; filename="event-<name>.ics"`).'
          headers:
            Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
            X-Robots-Tag: { $ref: '#/components/headers/XRobotsTag' }
          content:
            text/calendar:
              schema: { type: string }
        '403': { $ref: '#/components/responses/FeedForbidden' }
        '404': { $ref: '#/components/responses/FeedNotFound' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/feed/me/{subscriptionId}/ics:
    parameters:
      - { name: subscriptionId, in: path, required: true, description: 'Id of the personal subscription (`GET …/my-subscription`).', schema: { type: string } }
    get:
      tags: [Public feed]
      summary: ICS of the personal subscription ("Mein Abo")
      description: >-
        No sign-in; the personal `secret` in the query is the credential. The calendar holds the published events of
        the EFFECTIVE feeds: the selected feeds the member may access right now (re-evaluated on every request, so a
        revoked assignment, a demotion or leaving the club takes effect at once), each with its own calendars (non-archived),
        feed target group filter and the subscription's target groups (an event of several feeds appears once; with
        a target group filter, events without a group are not delivered). No holidays. Same window
        (`FEED_ICS_*`), cap, time zone handling and event rendering as the feed ICS; `X-WR-CALNAME` is
        `<club name> – Mein Abo`. No effective feed gives a valid empty calendar (200). Unknown id, wrong or missing
        secret and a member who is gone are the same `404` (checked before any other work). Rate limits: the feed limits
        (`FEED_RATE_LIMIT_PER_IP` per client IP and `FEED_RATE_LIMIT_PER_FEED` per subscription id).

        Conditional requests like the feed ICS: strong `ETag` computed without loading events (subscription and its
        configuration, effective feeds with their configuration and filters, content versions of their calendars, window
        and cap, club name and zone, ICS format version; never the secret). A 304 requires the valid secret.
        Always `Cache-Control: no-cache, private`, `X-Robots-Tag: noindex`, `Referrer-Policy: no-referrer`.
      operationId: personalSubscriptionIcs
      security: [{}]
      parameters:
        - { name: secret, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: 'iCalendar (`Content-Disposition: attachment; filename="my-subscription.ics"`, `ETag`).'
          headers:
            ETag: { description: 'Strong validator, quoted hex.', schema: { type: string } }
            Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
            X-Robots-Tag: { $ref: '#/components/headers/XRobotsTag' }
          content:
            text/calendar:
              schema: { type: string }
        '304':
          description: '`If-None-Match` matches the current `ETag`; no body.'
          headers:
            ETag: { description: 'Current validator.', schema: { type: string } }
            Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
            X-Robots-Tag: { $ref: '#/components/headers/XRobotsTag' }
        '404': { $ref: '#/components/responses/FeedNotFound' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/feed/{feedId}/ics:
    parameters:
      - { $ref: '#/components/parameters/FeedId' }
    get:
      tags: [Public feed]
      summary: ICS subscription of a feed
      description: >-
        Published events of all non-archived calendars of the feed. Holidays are never part of the ICS. The event `note` is the first lines of `DESCRIPTION`. The `SUMMARY` is `<badge emojis> <name> (<extras>)` (emojis and parentheses omitted when there are none); `DESCRIPTION` holds the `note`, the extras, the audiences and a legend `<emoji> <badge name>` of the emojis used. Only a default time window is delivered: events overlapping `[today - FEED_ICS_PAST_DAYS days, today + FEED_ICS_FUTURE_MONTHS months]` (defaults 180 days / 24 months, days in the club's time zone); `FEED_ICS_WINDOW_ENABLED=false` delivers everything. `FEED_ICS_MAX_EVENTS` > 0 additionally caps the output to the first N events by date and start time (protection only, no error; default 0 = unlimited). Operator settings, no query parameter overrides them; the authenticated member export and the web view `/events` are unaffected.

        Conditional requests: the response carries a strong `ETag` that is computed without loading events (feed, `updated_at`, feed configuration, the content versions of the active calendars, the effective target group filter, the resolved window and cap, the club time zone and the ICS format version; never the secret). `If-None-Match` (several values, `*` and `W/` prefixes accepted) answers `304 Not Modified` without body, with the same `Cache-Control`/`X-Robots-Tag`/`Referrer-Policy` headers. Access (secret, archived) is always checked first, so a 304 never happens without valid access. Because the window moves with the date, the ETag changes at midnight (club zone). `targetGroupIds` is trimmed, de-duplicated and sorted; equivalent filters (`a,b` / `b,a,a`, or ids outside the feed's own groups) give the same ETag.
      operationId: publicFeedIcs
      security: [{}, { feedSecret: [] }]
      parameters:
        - { $ref: '#/components/parameters/FeedSecret' }
        - { $ref: '#/components/parameters/FeedTargetGroupIds' }
      responses:
        '200':
          description: 'iCalendar (`Content-Disposition: attachment; filename="feed-<feedId>.ics"`, `ETag`; `Cache-Control: no-cache, public` for PUBLIC/CLUB feeds, `no-cache, private` for PRIVATE feeds; no `max-age`: clients always revalidate).'
          headers:
            ETag: { description: 'Strong validator, quoted hex.', schema: { type: string } }
            Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
            X-Robots-Tag: { $ref: '#/components/headers/XRobotsTag' }
          content:
            text/calendar:
              schema: { type: string }
        '304':
          description: '`If-None-Match` matches the current `ETag`; no body.'
          headers:
            ETag: { description: 'Current validator.', schema: { type: string } }
            Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
            X-Robots-Tag: { $ref: '#/components/headers/XRobotsTag' }
        '400': { $ref: '#/components/responses/FeedBadRequest' }
        '403': { $ref: '#/components/responses/FeedForbidden' }
        '404': { $ref: '#/components/responses/FeedNotFound' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  # ------------------------------------------------------------------ Holidays
  /api/calendars/{calendarId}/holiday-calendars:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    get:
      tags: [Holidays]
      summary: Holiday calendars (external ICS sources) of a calendar
      operationId: listHolidayCalendars
      responses:
        '200':
          description: Holiday calendars.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HolidayCalendar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Holidays]
      summary: Add a holiday calendar and fetch it
      description: >-
        The ICS URL is fetched immediately, before anything is written (no private networks; at most 3 redirects,
        each target is checked the same way); a failing fetch stores nothing. 20 fetches (create and refresh together)
        per user and hour: 429 `rate_limited` + `Retry-After`.
      operationId: createHolidayCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HolidayCalendarInput' }
      responses:
        '201':
          description: Created and fetched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayCalendar' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/HolidayFetchFailed' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/calendars/{calendarId}/holiday-calendars/predefined:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    post:
      tags: [Holidays]
      summary: Add predefined public and/or school holiday calendars
      description: >-
        Creates one holiday calendar (source `openholidays`) per requested kind and imports its holidays from
        openholidaysapi.org with ONE request per kind for the window 1 January of the current year to 31 December
        two years later. Names are "<regionName> – Feiertage|Schulferien" (German user) or "<regionName> – Public
        holidays|School holidays"; the language of the holiday names is the user's language (`de`|`en`). Multi-day
        school holidays are stored with `dateEnd`. A failing request stores nothing (422 `holiday_source_failed`).
        Quota `holidayCalendarsPerCalendar` counts every created calendar.
      operationId: createPredefinedHolidayCalendars
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PredefinedHolidayCalendarsInput' }
      responses:
        '201':
          description: The created holiday calendars, one per kind in request order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HolidayCalendar' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/HolidaySourceFailed' }

  /api/holiday-sources/countries:
    get:
      tags: [Holidays]
      summary: Countries offered by the holiday source
      description: >-
        Proxy of openholidaysapi.org `/Countries`, names in the user's language, cached for 7 days. Requires the
        editor (or admin) role in at least one club (403 `forbidden`).
      operationId: listHolidaySourceCountries
      responses:
        '200':
          description: Countries.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [isoCode, name]
                  properties:
                    isoCode: { type: string, examples: [DE] }
                    name: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/HolidaySourceFailed' }

  /api/holiday-sources/countries/{iso}/subdivisions:
    parameters:
      - name: iso
        in: path
        required: true
        description: ISO 3166-1 alpha-2 country code.
        schema: { type: string, pattern: '^[A-Za-z]{2}$' }
    get:
      tags: [Holidays]
      summary: Subdivisions (states, regions) of a country
      description: Proxy of openholidaysapi.org `/Subdivisions`, cached for 7 days; same access rule as the country list.
      operationId: listHolidaySourceSubdivisions
      responses:
        '200':
          description: Subdivisions with optional children.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HolidaySubdivision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/HolidaySourceFailed' }

  /api/calendars/{calendarId}/holiday-calendars/{hcId}:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
      - { $ref: '#/components/parameters/HolidayCalendarId' }
    patch:
      tags: [Holidays]
      summary: Change name, URL and/or type of a holiday calendar
      description: >-
        Partial: `name`, `url` and/or `type`, at least one (else `422 validation_failed` field `name`); a sent value has
        the rules of create (422 `validation_failed` with the field, also for a non-string). Does not refetch.
        `url` and `type` of a predefined (`openholidays`) calendar cannot be changed (422 `validation_failed`).
      operationId: updateHolidayCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HolidayCalendarPatch' }
      responses:
        '200':
          description: The updated holiday calendar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayCalendar' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Holidays]
      summary: Remove a holiday calendar with its holidays
      operationId: deleteHolidayCalendar
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/calendars/{calendarId}/holiday-calendars/{hcId}/refresh:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
      - { $ref: '#/components/parameters/HolidayCalendarId' }
    post:
      tags: [Holidays]
      summary: Fetch a holiday calendar again
      description: >-
        Re-fetches the ICS URL, or for `openholidays` calendars the holiday source (failure: 422
        `holiday_source_failed`). Predefined calendars are also refreshed automatically when `GET …/holiday-events`
        finds the last fetch older than 3 months (non-fatal, at most one attempt per hour per calendar), and by the
        console command `app:holidays:refresh [--all] [--calendar=id]`. The fetch happens before the stored holidays are
        replaced (a failure keeps them); at most 3 redirects. 20 fetches per user and hour (shared with creating a holiday
        calendar by URL; 429 `rate_limited` + `Retry-After`); the automatic refresh and the console command are not throttled.
      operationId: refreshHolidayCalendar
      responses:
        '200':
          description: The refreshed holiday calendar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayCalendar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenWrite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/HolidaySourceOrFetchFailed' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }

  /api/calendars/{calendarId}/holiday-events:
    parameters:
      - { $ref: '#/components/parameters/CalendarId' }
    get:
      tags: [Holidays]
      summary: Holidays of a calendar in a range
      description: >-
        `from` and `to` are required, strictly `YYYY-MM-DD`; missing, invalid or `to` before `from` is a 400
        `validation_failed` with field `from`/`to`.
      operationId: listHolidayEvents
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Holidays overlapping the range.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HolidayEvent' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ Maps
  /api/map/geocode/suggest:
    get:
      tags: [Maps]
      summary: Address suggestions (geocoding)
      operationId: geocodeSuggest
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 'Search text: a street address (no places or POIs); empty → no suggestions.' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 6 } }
      responses:
        '200':
          description: Suggestions.
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        lat: { type: number }
                        lng: { type: number }
                        street: { type: [string, 'null'] }
                        zip: { type: [string, 'null'] }
                        city: { type: [string, 'null'] }
                        country: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitedProblem' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/map/geocode/reverse:
    get:
      tags: [Maps]
      summary: Address of coordinates (reverse geocoding)
      operationId: geocodeReverse
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
      responses:
        '200':
          description: The address.
          content:
            application/json:
              schema:
                type: object
                properties:
                  label: { type: string }
                  street: { type: [string, 'null'] }
                  zip: { type: [string, 'null'] }
                  city: { type: [string, 'null'] }
                  country: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitedProblem' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/map/image/location/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Maps]
      summary: Static map image of a location
      description: >-
        Public (used by feed pages and mails), cached; 404 when the location has no coordinates. The optional
        cache-buster `v` (the SPA sends the location's `updatedAt`) selects long-lived caching, see `MapImage`.
      operationId: locationMapImage
      security: []
      parameters:
        - name: v
          in: query
          required: false
          description: >-
            Cache-buster, ignored by the server except that a non-empty value turns on 30-day `immutable` caching.
            Change it whenever the location changes.
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/MapImage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/MapImageUnavailable' }

  /api/map/image/event/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Maps]
      summary: Static map image of an event's location
      description: Public; drafts and events without a located place are 404.
      operationId: eventMapImage
      security: []
      responses:
        '200': { $ref: '#/components/responses/MapImage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/MapImageUnavailable' }

  /api/mapbox/{domain}/{path}:
    parameters:
      - name: domain
        in: path
        required: true
        description: Upstream host; only `api.mapbox.com` is allowed.
        schema: { type: string, enum: [api.mapbox.com] }
      - name: path
        in: path
        required: true
        description: >-
          Upstream path, may contain slashes (route requirement `.+`). Allowed: `v4/<tileset>/<z>/<x>/<y>…`
          (rate-limited), `styles/…`, `fonts/…`. Dot segments are rejected.
          Limits per hour: tiles 1800 per user and 3600 per client IP, styles and fonts 900 per user and 60000 per day for the whole instance (cache hits count; 429 `rate_limited` with `Retry-After`).
        schema: { type: string }
    get:
      tags: [Maps]
      summary: Mapbox proxy (adds the server token)
      description: >-
        Forwards to Mapbox with the server's token (an `access_token` in the query is dropped); GET responses are
        cached. Needs a signed-in user (access token as `Authorization: Bearer`; without one `401 missing_token` before anything else; the public static images `/api/map/image/*` stay anonymous). Upstream status, body and headers are passed through. GET only: other methods
        are `405` (`Allow: GET`).
      operationId: mapboxProxyGet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Upstream response (tiles, styles, glyphs).
          content:
            '*/*':
              schema: {}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400':
          description: '`invalid_request` field `domain`: the upstream host is not allowed.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Path not allowed (no `code`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimitedProblem' }
        '502':
          description: Mapbox could not be reached (no `code`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/MapUnavailable' }
        default:
          description: Any other upstream status (e.g. 401, 404 from Mapbox) is passed through with the upstream body.
          content:
            '*/*':
              schema: {}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (15 minutes) from login, passkey, SSO, password change or `POST /api/auth/token`.
    feedSecret:
      type: apiKey
      in: query
      name: secret
      description: Shared secret of a `PRIVATE` feed (`sharedSecret` of the feed). Ignored for `PUBLIC`/`CLUB` feeds.

  parameters:
    IncludeSecret:
      name: includeSecret
      in: query
      description: 'Return `sharedSecret` in the feed(s). Default `false` (omitted). Anything else than `true`/`false`/`1`/`0` is `400 validation_failed` (field `includeSecret`).'
      schema: { type: string, enum: ['true', 'false', '1', '0'], default: 'false' }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    ClubId:
      name: clubId
      in: path
      required: true
      schema: { type: string }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string }
    CalendarId:
      name: calendarId
      in: path
      required: true
      schema: { type: string }
    SeriesId:
      name: seriesId
      in: path
      required: true
      schema: { type: string }
    FeedId:
      name: feedId
      in: path
      required: true
      schema: { type: string }
    HolidayCalendarId:
      name: hcId
      in: path
      required: true
      schema: { type: string }
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, examples: [google, microsoft, apple] }
    FeedSecret:
      name: secret
      in: query
      description: Required for `PRIVATE` feeds, ignored otherwise.
      schema: { type: string }
    FeedTargetGroupIds:
      name: targetGroupIds
      in: query
      description: Comma-separated audience (target group) ids; narrows the feed's own selection (intersection), never widens it.
      schema: { type: string }

  headers:
    Location:
      description: Redirect target.
      schema: { type: string, format: uri }
    StateCookie:
      description: '`oauth_state_nonce=<nonce>; Path=/api/auth/oauth; Secure; HttpOnly; SameSite=None` (10 minutes).'
      schema: { type: string }
    ReferrerPolicy:
      description: Always `no-referrer` on `/api/feed/*` (errors included).
      schema: { type: string, const: no-referrer }
    XRobotsTag:
      description: '`noindex` unless the response is successful and the feed is indexable (`PUBLIC`); then absent.'
      schema: { type: string, const: noindex }

  responses:
    InvitationNotFound:
      description: '`invitation_not_found`: unknown token or id, an invitation for another address, an answered one, or the user has no confirmed address (always the same answer).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvitationUnprocessable:
      description: '`invitation_expired` (the invitation is for this user but older than 7 days), `validation_failed` (field `token`; token routes only) or `quota_exceeded` (resource `membersPerClub`, accept only).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Ok:
      description: Done.
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: { type: boolean, const: true }
    Tokens:
      description: Access and refresh token with the user.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TokenResponse' }
    Unauthorized:
      description: '`missing_token` (no access token), `invalid_token` (malformed, wrong signature, session ended, user gone) or `token_expired`.'
      headers:
        WWW-Authenticate: { schema: { type: string, const: Bearer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LegalDocumentNotFound:
      description: '`legal_document_not_found`: the type is not provided / unknown, or the id is unknown.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Signed in, but not a member of the club / the calendar's club (no `code`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ForbiddenWrite:
      description: Signed in, but not a member, or the calendar is archived (read-only); no `code`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Unknown id, or an id of another calendar/club (no `code`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: '`validation_failed` with the `field` of the query parameter (invalid value, or sent as an array).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidRequest:
      description: '`invalid_request`: the body is no JSON object (or not of the expected shape).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidInput:
      description: >-
        `invalid_request` (body is no JSON object) or `validation_failed` with the input `field` (wrong type, missing
        required value, invalid date/time/time zone, coordinates, times as half a pair, `scope`, a query parameter
        sent as an array, ...).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: '`validation_failed` (constraint violation of the request DTO) with the first violating `field`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnknownReference:
      description: '`unknown_reference`: an id of the body is unknown or belongs to another calendar (`field` names it).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    DuplicateName:
      description: '`duplicate_name` (field `name`): the name exists in this calendar (trimmed, case-insensitive).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyEvents:
      description: '`too_many_events`: more than 5000 events/locations (import, field `events`/`locations`) or ids (bulk, field `ids`).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    QuotaExceeded:
      description: '`quota_exceeded`: a per-club/calendar/user quota is used up; members `resource` and `limit` (see "Quotas and input limits").'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SeriesTooMany:
      description: '`too_many_events` (more than 366 events, field `rule` or `rule.count`) or `validation_failed` field `rule` (the series would have no events).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SeriesConflict:
      description: '`series_empty` (the series has no events to serve as prototype) or `series_changed` (changed concurrently; nothing changed, try again).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    FeedInputRejected:
      description: '`validation_failed` field `calendarIds` (empty), `unknown_reference` field `targetGroupIds` or `calendarIds` (not a calendar / audience of this club), `quota_exceeded` (`feedsPerClub`).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    FeedBadRequest:
      description: >-
        `validation_failed` field `from`/`to` (not a real day as `YYYY-MM-DD`, or `to` before `from`), or
        `validation_failed` with the parameter as `field` when a query parameter is sent as an array (`?secret[]=`,
        `?targetGroupIds[]=`).
      headers:
        Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
        X-Robots-Tag: { $ref: '#/components/headers/XRobotsTag' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    FeedForbidden:
      description: Private feed without or with a wrong secret (no `code`; indistinguishable on purpose).
      headers:
        Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
        X-Robots-Tag: { $ref: '#/components/headers/XRobotsTag' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    FeedNotFound:
      description: Unknown feed, no non-archived calendar left or (single event) unknown/unpublished event; no `code`.
      headers:
        Referrer-Policy: { $ref: '#/components/headers/ReferrerPolicy' }
        X-Robots-Tag: { $ref: '#/components/headers/XRobotsTag' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    HolidayFetchFailed:
      description: '`validation_failed` (name/url constraints) or `ics_fetch_failed` field `url` (the ICS feed could not be fetched or parsed; nothing was stored).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    HolidaySourceFailed:
      description: '`validation_failed` (country, subdivision, kinds) or `holiday_source_failed` (the holiday source could not be reached or answered with an error; nothing was stored).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    HolidaySourceOrFetchFailed:
      description: '`ics_fetch_failed` (ICS calendar) or `holiday_source_failed` (predefined calendar): the fetch failed, stored holidays are unchanged.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnknownProvider:
      description: '`unknown_provider`: the SSO provider is unknown or not configured (no redirect).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: >-
        Map images: per-IP limit (360 per hour, `rate_limited` problem body with `Retry-After`) or the provider's
        budget reached (empty body).
    AuthRateLimited:
      description: >-
        `rate_limited`: too many requests from this client IP (all routes of this kind) or, for login and
        registration, for this e-mail address (login: 5 per 15 minutes, registration: 3 per hour; checked
        identically for known and unknown addresses). `Retry-After` gives the seconds to wait.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 }, description: Seconds until a new request is accepted. }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimitedProblem:
      description: '`rate_limited`: rate limit of the map provider reached.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: >-
        `map_unavailable`: no map service configured (`MAPBOX_TOKEN` empty; checked after authentication), or the
        geocoding provider failed (no `code`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MapImage:
      description: >-
        JPEG with a strong `ETag` (hash of the image); `If-None-Match` is answered with 304. `Cache-Control` is
        `public, max-age=2592000, s-maxage=2592000, immutable` (30 days) when the location route carries a non-empty
        `v`, otherwise (no `v`, event route) `public, max-age=86400, s-maxage=86400`. A rate-limited request is an
        empty 429 with `Cache-Control: no-store`.
      headers:
        Cache-Control: { schema: { type: string } }
        ETag: { schema: { type: string } }
      content:
        image/jpeg:
          schema: { type: string, contentMediaType: image/jpeg }
    MapImageUnavailable:
      description: >-
        No map service configured (`MAPBOX_TOKEN` empty): a static placeholder (a blurred map without text,
        `backend/assets/map-unavailable.png`, 400×144) as the body, so an `<img>` still shows a map
        (`Cache-Control: no-store`). Only after the checks of the route (unknown / draft / no position → 404).
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        image/png:
          schema: { type: string, contentMediaType: image/png }
    MapUnavailable:
      description: '`map_unavailable`: no Mapbox token configured (RFC 7807 body).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    OAuthError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        error_description: { type: string }
    # ---------------------------------------------------------------- errors
    Problem:
      type: object
      description: 'RFC 7807 problem details (`Content-Type: application/problem+json`).'
      required: [type, title, status, detail]
      properties:
        type: { type: string, const: 'https://tools.ietf.org/html/rfc2616#section-10' }
        title: { type: string, examples: [Unprocessable Entity] }
        status: { type: integer, examples: [422] }
        detail: { type: string, description: Human-readable; not a contract. }
        code: { $ref: '#/components/schemas/ErrorCode' }
        retryAt: { type: string, format: date-time, description: 'Only `verification_resend_too_early`.' }
        documents:
          type: array
          description: 'Only `consent_required` / `consent_outdated`: the current documents to consent to.'
          items:
            type: object
            required: [type, id]
            properties:
              type: { type: string, enum: [privacy, terms] }
              id: { type: string }
        email: { type: string, description: 'Only `email_not_verified` and `email_verification_required`.' }
        resource: { type: string, description: 'Only `quota_exceeded`: the quota that is used up.' }
        limit: { type: integer, description: 'Only `quota_exceeded`: its limit.' }
        field:
          type: string
          description: Path of the offending input, e.g. `name`, `rule.weekday`, `event.locationId`, `events[3].date`, `locations[0].tempId`, `ids`.
      examples:
        - type: 'https://tools.ietf.org/html/rfc2616#section-10'
          title: Unprocessable Entity
          status: 422
          detail: 'name: "Jugend" already exists in this calendar'
          code: duplicate_name
          field: name
    ErrorCode:
      type: string
      description: |
        Stable, machine-readable error code (`App\Exception\ApiProblemException`). Clients match this, never `detail`.

        | Code | Status | Where |
        | --- | --- | --- |
        | `validation_failed` | 400 / 422 | Input errors with `field`. **400** = malformed input (typed input checks): wrong JSON types (also `PATCH /api/auth/me`), date parameters `from`/`to` (events, holidays, public feed, export), any query parameter sent as an array, import `events[n].<field>`, export parameters, bulk, series rule `rule.*`, `scope`, feeds `visibility`, invalid time zone, location coordinates, template times as half a pair, `from-template` without `templateId`/`dates`. **422** = DTO constraints (register, login, password/e-mail routes, create club/calendar, invite member, invitation token, holiday calendars) and conflicts with stored state: series without events (field `rule`), e-mail change to the current address |
        | `invalid_request` | 400 | Body is no JSON object; passkey body incomplete; any other 400 the framework rejects; Mapbox proxy with a host other than `api.mapbox.com` (field `domain`) |
        | `missing_token` | 401 | No access token on a route that needs a user (all of `/api/clubs`, `/api/calendars`, `/api/map/geocode/`, `/api/mapbox/` before the id is looked up) |
        | `invalid_token` | 401 | Access token malformed, wrongly signed, of an ended session or of a deleted user |
        | `token_expired` | 401 | Access token expired (refresh it) |
        | `consent_required` | 403 / 422 | **403** on any gated `/api/*` route (see the consent gate in the overview): the user has not consented to the current privacy policy / terms; member `documents` = `[{type, id}]`. **422** `POST /api/auth/register`: a current document is missing in `acceptedDocuments` (field `acceptedDocuments`, `documents` = the missing ones) |
        | `consent_outdated` | 422 | `POST /api/auth/register` (field `acceptedDocuments`) or `POST /api/auth/consents`: an older version / a non-consent document was sent; `documents` = the current documents to accept (the client reloads `GET /api/legal`) |
        | `legal_document_not_found` | 404 | `GET /api/legal/{type}` (not provided, unknown type) and `GET /api/legal/documents/{id}` |
        | `member_not_found` | 404 | `DELETE /api/clubs/{clubId}/members/{userId}`: no member of the club (unknown ids alike) |
        | `last_member` | 422 | `DELETE /api/clubs/{clubId}/members/{userId}`: the user is the only member of the club (also when leaving it); a club never has zero members |
        | `last_member_of_club` | 422 | `DELETE /api/auth/me`: the user is the only member of at least one club; delete the club first |
        | `last_admin` | 422 | `DELETE /api/clubs/{clubId}/members/{userId}`, `PATCH …`: the user is the only admin (removing, leaving, demoting); promote another member first |
        | `last_admin_of_club` | 422 | `DELETE /api/auth/me`: the user is the only admin of a club with other members |
        | `forbidden` | 403 | Member routes: the role is too low for the service check (removing another member or changing a role without being admin) |
        | `invalid_role` | 422 | `PATCH /api/clubs/{clubId}/members/{userId}`: role is none of member, viewer, editor, admin (field `role`) |
        | `invitation_not_found` | 404 | Club invitation routes: unknown, answered or revoked invitation, or one of another club; `/api/invitations/*`: unknown token or id, an invitation for another address, or an unconfirmed user (all the same answer) |
        | `feed_not_found` | 404 | `POST /api/feed/{feedId}/claim`, `GET /api/feed/{feedId}/membership`: unknown feed, wrong or missing secret of a `PRIVATE` feed, or all calendars archived (one answer, no oracle) |
        | `member_signup_disabled` | 403 | `POST /api/feed/{feedId}/claim`: the user is no member and the club setting `feedSignup` does not allow this feed's visibility |
        | `invitation_expired` | 422 | Accept/decline of an invitation that is addressed to the signed-in user but older than 7 days; the club can re-send it |
        | `authorization_request_not_found` | 404 | `GET /api/oauth/authorization-request/{id}`, `POST /api/oauth/authorize/decision`: unknown, expired (10 min), already answered, or not started in this browser (binding cookie missing or wrong) request |
        | `mcp_grant_not_found` | 404 | `DELETE /api/auth/mcp-grants/{id}`: unknown id or a grant of another user |
        | `ics_fetch_failed` | 422 | Holiday calendar create/refresh: the ICS URL could not be fetched or parsed (field `url`) |
        | `holiday_source_failed` | 422 | Predefined holiday calendars / source lists / refresh: the holiday source (openholidaysapi.org) failed |
        | `rate_limited` | 429 | Geocoding and Mapbox proxy: rate limit of the map provider, plus per-user/IP Mapbox limits (tiles 1800 per user and 3600 per IP per hour, styles/fonts 900 per user per hour, anonymous `/api/map/image/*` 360 per IP per hour, with `Retry-After`; an exhausted provider budget on map images answers an empty 429); sign-in, registration, refresh, e-mail confirmation, passkey and SSO routes: per-IP / per-address limits with `Retry-After`; club invitations (create, re-send): 20 per user and 50 per club and day; account deletion (`DELETE /api/auth/me`, `POST /api/auth/delete-account/code`): per user and per IP; `GET …/events.pdf`: 10 per user and 30 per IP in 10 minutes |
        | `unknown_reference` | 422 | Id unknown or of another calendar (references of events/templates/feeds, bulk `ids`, export `targetGroupIds`, import `locationTempId`, series `templateId`) |
        | `event_not_draft` | 409 | MCP tool `update_event_draft` only: the event is published (not a draft) and stays unchanged |
        | `duplicate_name` | 422 | Name of a badge (property) or extra (feature) already used in the calendar, or of an audience (target group) in the club |
        | `too_many_events` | 413 / 422 | 413: import > 5000 events/locations, bulk > 5000 ids; 422: series > 366 events (preview, create, rule change) |
        | `quota_exceeded` | 422 | A create/import would exceed a quota (clubs per user, calendars/members/open invitations per club, events/templates/properties/features/holiday calendars per calendar, locations/target groups/feeds per club); extra members `resource`, `limit`. List: "Quotas and input limits" |
        | `series_empty` | 409 | Rule change preview/PATCH: the series has no events |
        | `series_changed` | 409 | Rule change PATCH: prototype/reference deleted concurrently or deadlock; nothing changed |
        | `email_taken` | 400 | Registration, field `email` |
        | `registration_restricted` | 403 | `POST /api/auth/register` with `RESTRICT_REGISTRATION` and no open invitation for the address, field `email` (SSO: redirect error code) |
        | `club_creation_restricted` | 403 | `POST /api/clubs` with `RESTRICT_CLUB_CREATION` (except the bootstrap: `RESTRICT_REGISTRATION` and no club yet) |
        | `invalid_credentials` | 401 / 400 | Login 401; 400 for `change-password` (field `currentPassword`), `change-email` and `DELETE /api/auth/me` (field `password`) |
        | `invalid_reset_token` | 400 | `reset-password`: unknown, used or expired (same answer), field `token` |
        | `no_password` | 409 | `change-password` / `change-email` of SSO-only accounts |
        | `invalid_confirmation_code` | 400 | `DELETE /api/auth/me` of an account without password: code missing, wrong, expired or of another account, field `code` |
        | `has_password` | 409 | `POST /api/auth/delete-account/code` for an account with a password |
        | `last_login_method` | 409 | `DELETE /api/auth/oauth/{provider}`: no sign-in method would remain |
        | `oauth_account_not_found` | 404 | `DELETE /api/auth/oauth/{provider}`: provider not linked |
        | `unknown_provider` | 404 | `POST /api/auth/oauth/{provider}/link-start` and the browser routes `GET /api/auth/oauth/{provider}`, `GET …/{provider}/link` |
        | `invalid_state` | 400 | `POST …/oauth/{provider}/link-complete`: proof invalid |
        | `account_in_use` | 409 | `link-complete`: provider account belongs to another user |
        | `already_linked` | 409 | `link-complete`: another account of this provider is linked |
        | `email_not_verified` | 403 | OAuth consent decision / MCP token of an unconfirmed address (extra member `email`) |
        | `email_verification_required` | 403 | **Any gated `/api/*` route** (see the e-mail verification gate in the overview): the session belongs to a user whose address is not confirmed; extra member `email` |
        | `invalid_verification_code` | 422 | `POST /api/auth/verify-email`: wrong, expired, used up or already confirmed (same answer), field `code` |
        | `verification_resend_too_early` | 429 | `POST /api/auth/resend-verification` less than 5 minutes after the last code mail of the account; extra member `retryAt` (ISO-8601 UTC), header `Retry-After` |
        | `invalid_mfa_token` | 401 | MFA routes `/api/auth/mfa/verify`, `…/passkey/options`, `…/passkey/verify`: the signed `mfaToken` is expired, used, invalid or the account changed since the sign-in |
        | `invalid_mfa_code` | 401 | `POST /api/auth/mfa/verify`: wrong or used authenticator or backup code (field `code`; same answer for both) |
        | `invalid_mfa_setup` | 400 | `POST /api/auth/mfa/enable`: setup token expired, used, or not matching the secret/codes sent |
        | `invalid_totp_code` | 422 | `POST /api/auth/mfa/enable`: the 6-digit code of the new authenticator app is wrong (field `code`) |
        | `totp_already_set` | 409 | `POST /api/auth/mfa/setup` and `…/enable` (method `totp`): an authenticator app is already set up |
        | `mfa_already_enabled` | 409 | `POST /api/auth/mfa/setup` and `…/enable` (method `passkeys`): MFA is already on |
        | `mfa_passkey_required` | 422 | `POST /api/auth/mfa/setup` and `…/enable` (method `passkeys`): no passkey is registered yet |
        | `backup_codes_not_acknowledged` | 422 | `POST /api/auth/mfa/enable`: backup codes were issued but `backupCodesAcknowledged` is not `true` |
        | `mfa_not_enabled` | 409 | `POST /api/auth/mfa/disable` and `…/backup-codes`: MFA is not on |
        | `mfa_last_passkey` | 422 | `DELETE /api/auth/webauthn/{id}`: the last passkey while MFA is on |
        | `invalid_code_verifier` | 400 | `POST /api/auth/token` `one_time_token`: `code_verifier` missing or wrong (the code is consumed) |
        | `invalid_grant` | 400 | `POST /api/auth/token` with an unknown `grant_type`, a missing token or an unusable one-time token |
        | `invalid_refresh_token` | 401 | Refresh token invalid, expired, unknown, revoked, reused after rotation (revokes the session), session lifetime over, user gone or sessions ended |
        | `invalid_passkey` | 401 | Passkey sign-in failed |
        | `invalid_passkey_registration` | 400 | Passkey registration failed |
        | `passkey_already_registered` | 400 | Passkey registration: credential exists |
        | `passkey_not_found` | 404 | Delete passkey (unknown or another user's) |
        | `map_unavailable` | 503 | No map service configured (`MAPBOX_TOKEN` empty): geocoding (`/api/map/geocode/*`) and the Mapbox proxy; the map image routes answer 503 with a placeholder image instead |

        Not error codes: import warnings use `timezone_replaced`; redirects use `?error=` / `?link_error=` /
        `?reason=` values (see the API description).
      enum:
        - validation_failed
        - invalid_request
        - unknown_reference
        - duplicate_name
        - event_not_draft
        - too_many_events
        - quota_exceeded
        - series_empty
        - series_changed
        - email_taken
        - registration_restricted
        - club_creation_restricted
        - invalid_credentials
        - invalid_reset_token
        - no_password
        - invalid_confirmation_code
        - has_password
        - last_login_method
        - oauth_account_not_found
        - unknown_provider
        - invalid_state
        - account_in_use
        - already_linked
        - email_not_verified
        - email_verification_required
        - invalid_verification_code
        - verification_resend_too_early
        - invalid_grant
        - invalid_code_verifier
        - invalid_refresh_token
        - invalid_passkey
        - invalid_passkey_registration
        - passkey_already_registered
        - passkey_not_found
        - invalid_mfa_token
        - invalid_mfa_code
        - invalid_totp_code
        - invalid_mfa_setup
        - totp_already_set
        - mfa_already_enabled
        - mfa_passkey_required
        - backup_codes_not_acknowledged
        - mfa_not_enabled
        - mfa_last_passkey
        - map_unavailable
        - missing_token
        - invalid_token
        - token_expired
        - consent_required
        - consent_outdated
        - legal_document_not_found
        - member_not_found
        - last_member
        - last_member_of_club
        - last_admin
        - last_admin_of_club
        - forbidden
        - invalid_role
        - invitation_not_found
        - invitation_expired
        - feed_not_found
        - member_signup_disabled
        - ics_fetch_failed
        - holiday_source_failed
        - authorization_request_not_found
        - mcp_grant_not_found
        - rate_limited

    # ---------------------------------------------------------------- primitives
    Date:
      type: string
      format: date
      examples: ['2026-10-15']
    Time:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d(:[0-5]\d)?$'
      description: '`HH:MM` (seconds accepted on input and dropped).'
      examples: ['19:30']
    IdList:
      type: [array, 'null']
      description: Ids of the same calendar (duplicates are ignored).
      items: { type: string }
    Password:
      type: string
      minLength: 8
      maxLength: 128
      description: Password policy (8-128 characters).
    Scope:
      type: string
      enum: [this, all]
      default: this
    DurationDays:
      type: integer
      minimum: 0
      maximum: 31
      default: 0
      description: Extra days of each event (0 = single-day).

    # ---------------------------------------------------------------- auth
    UserSummary:
      type: object
      required: [id, name, email, dateFormat, firstDayOfWeek, lastClubId, lastCalendarId, language]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        dateFormat: { type: string, examples: [dd.MM.yyyy] }
        firstDayOfWeek: { type: integer, minimum: 0, maximum: 6 }
        lastClubId: { type: [string, 'null'] }
        lastCalendarId: { type: [string, 'null'] }
        language: { type: string, examples: [de] }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, emailVerificationRequired, user]
      properties:
        access_token: { type: string, description: 'JWT, 15 minutes.' }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, const: 900 }
        refresh_token: { type: string, description: 'Single-use, 7 days (never past the session''s absolute end); exchange at `POST /api/auth/token`, which rotates it.' }
        emailVerificationRequired: { type: boolean, description: 'True for a restricted session: the e-mail address is not confirmed yet (see the e-mail verification gate).' }
        user: { $ref: '#/components/schemas/UserSummary' }
    LegalDocumentSummary:
      type: object
      required: [id, title, url, publishedAt]
      properties:
        id: { type: string, description: 'UUID of this version (changes with every new text; a link version keeps its id when only the URL changes).' }
        title: { type: [string, 'null'], description: First `# ` heading of the Markdown source; null for a link. }
        url: { type: [string, 'null'], description: 'External address (absolute http(s) URL) when the operator provides the document as a link (`LEGAL_IMPRINT_URL|LEGAL_PRIVACY_URL|LEGAL_TERMS_URL`, only when no Markdown file exists for the type); null for a Markdown document. Clients open the link instead of rendering `html`.' }
        publishedAt: { type: string, format: date-time }
    LegalDocument:
      type: object
      required: [id, type, title, url, html, publishedAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [imprint, privacy, terms] }
        title: { type: [string, 'null'] }
        url: { type: [string, 'null'], description: 'External address of a link document (then `html` is an empty string); null for a Markdown document.' }
        html: { type: string, description: 'Sanitised HTML (raw HTML of the source is escaped, unsafe links removed); empty for a link document.' }
        publishedAt: { type: string, format: date-time }
    Consent:
      type: object
      required: [id, type, documentId, documentTitle, documentUrl, documentPublishedAt, consentedAt, current, ipAddress, userAgent]
      properties:
        id: { type: string }
        type: { type: string, enum: [privacy, terms] }
        documentId: { type: string, description: 'Version consented to; readable at `GET /api/legal/documents/{id}`.' }
        documentTitle: { type: [string, 'null'] }
        documentUrl: { type: [string, 'null'], description: 'External address when the consented document is a link document.' }
        documentPublishedAt: { type: string, format: date-time }
        consentedAt: { type: string, format: date-time }
        current: { type: boolean, description: 'The document is still the current one of its type.' }
        ipAddress: { type: [string, 'null'] }
        userAgent: { type: [string, 'null'] }
    Me:
      allOf:
        - { $ref: '#/components/schemas/UserSummary' }
        - type: object
          required: [hasPassword, pendingConsents, consentRequired, emailVerificationRequired, pendingEmail, passkeys, oauthAccounts, mfa]
          properties:
            hasPassword: { type: boolean }
            mfa: { $ref: '#/components/schemas/MfaStatus' }
            pendingConsents:
              type: array
              description: Current privacy / terms documents the user has not consented to yet.
              items:
                type: object
                required: [type, id, title, url, publishedAt]
                properties:
                  type: { type: string, enum: [privacy, terms] }
                  id: { type: string }
                  title: { type: [string, 'null'] }
                  url: { type: [string, 'null'], description: 'External address for a link document, else null.' }
                  publishedAt: { type: string, format: date-time }
            consentRequired: { type: boolean, description: 'True only if the consent gate blocks THIS session: `pendingConsents` is not empty AND the session started without up-to-date consents. A session that was compliant when it started sees `pendingConsents` but `consentRequired` false.' }
            emailVerificationRequired: { type: boolean, description: 'True while the e-mail address is not confirmed (the user has a restricted session).' }
            pendingEmail: { type: [string, 'null'], description: New address of a waiting e-mail change. }
            passkeys:
              type: array
              items:
                type: object
                required: [id, deviceName, createdAt, lastUsedAt]
                properties:
                  id: { type: string }
                  deviceName: { type: [string, 'null'] }
                  createdAt: { type: string, format: date-time }
                  lastUsedAt: { type: [string, 'null'], format: date-time }
            oauthAccounts:
              type: array
              description: Linked providers (neither the provider's account id nor its address).
              items:
                type: object
                required: [provider]
                properties:
                  provider: { type: string, examples: [google] }
    WebAuthnOptions:
      type: object
      required: [options, challengeToken]
      properties:
        options:
          type: object
          description: >-
            WebAuthn options for `navigator.credentials.create()` (registration: `challenge`, `rp`, `user`,
            `pubKeyCredParams` ES256/RS256, `authenticatorSelection`, `timeout`, `excludeCredentials`,
            `attestation: none`) or `.get()` (`challenge`, `rpId`, `timeout`, `userVerification`,
            `allowCredentials: []`). Binary values are base64url.
        challengeToken: { type: string, description: 'Signed, single-use token carrying the challenge; send it back with the response.' }
    MfaChallenge:
      type: object
      description: Answer of `POST /api/auth/login` for an account with MFA. No tokens yet.
      required: [mfaRequired, mfaToken, expiresIn, methods]
      properties:
        mfaRequired: { type: boolean, const: true }
        mfaToken: { type: string, description: 'Signed sign-in token, single use, consumed only by a successful second factor.' }
        expiresIn: { type: integer, const: 300, description: Seconds the token is valid. }
        methods:
          type: array
          description: 'Second factors usable now: `totp` with an authenticator app, `backup_code` always, `passkey` with a registered passkey.'
          items: { type: string, enum: [totp, backup_code, passkey] }
    MfaStatus:
      type: object
      description: MFA state of the account (`mfa` in `GET /api/auth/me` and in the management answers).
      required: [enforced, totp, backupCodes, canEnforce]
      properties:
        enforced: { type: boolean, description: 'MFA is on: sign-in asks for a second factor.' }
        totp:
          type: [object, 'null']
          description: Set when an authenticator app is set up.
          required: [createdAt]
          properties:
            createdAt: { type: string, format: date-time }
        backupCodes:
          type: [object, 'null']
          description: Set when backup codes exist.
          required: [remaining, createdAt]
          properties:
            remaining: { type: integer, minimum: 0 }
            createdAt: { type: string, format: date-time }
        canEnforce: { type: boolean, description: 'MFA can be turned on with passkeys: it is off and at least one passkey is registered.' }
    MfaSetupResponse:
      type: object
      description: Result of `POST /api/auth/mfa/setup`. Nothing is stored until `POST /api/auth/mfa/enable`.
      required: [setupToken, backupCodes]
      properties:
        setupToken: { type: string, description: 'Signed, single-use token for 15 minutes, bound to the secret and backup codes.' }
        backupCodes:
          type: [array, 'null']
          description: Ten backup codes, shown once; `null` while MFA is already on (the existing codes stay).
          items: { type: string }
        secret: { type: string, description: 'Authenticator app only: the secret to enter manually.' }
        otpauthUri: { type: string, description: 'Authenticator app only: `otpauth://` URI for the QR code.' }

    # ---------------------------------------------------------------- clubs and calendars
    ClubRole:
      type: string
      enum: [member, viewer, editor, admin]
      description: Role of the signed-in user in the club (see "Authorization").
    Club:
      type: object
      required: [id, name, timezone]
      properties:
        id: { type: string }
        name: { type: string }
        timezone: { type: string, examples: [Europe/Berlin] }
        feedSignup: { allOf: [{ $ref: '#/components/schemas/FeedSignup' }], description: 'Only in responses for staff (club list, detail, create, update); not for plain members.' }
    FeedSignup:
      type: string
      enum: [off, internal, public]
      default: internal
      description: >-
        Who may become a club member (role `member`) by opening a feed while signed in (`POST /api/feed/{feedId}/claim`):
        `off` nobody, `internal` through `CLUB` and `PRIVATE` feeds, `public` additionally through `PUBLIC` feeds.
        It only gates NEW membership; existing members may always claim.
    ClubListItem:
      allOf:
        - { $ref: '#/components/schemas/Club' }
        - type: object
          required: [role]
          properties:
            role: { $ref: '#/components/schemas/ClubRole' }
            calendarCount: { type: integer, description: Active calendars. }
            archivedCalendarCount: { type: integer }
            memberCount: { type: integer }
            lastCalendarId: { type: [string, 'null'], description: Last calendar the user opened in this club (only while it exists in this club). }
            _count:
              type: object
              description: Legacy counter (all calendars).
              required: [calendars]
              properties:
                calendars: { type: integer }
    ClubDetail:
      allOf:
        - { $ref: '#/components/schemas/Club' }
        - type: object
          required: [role]
          properties:
            role: { $ref: '#/components/schemas/ClubRole' }
            calendarCount: { type: integer }
            archivedCalendarCount: { type: integer }
            memberCount: { type: integer }
            eventCount: { type: integer, description: All calendars incl. archived. }
            feedCount: { type: integer }
    ClubInvitation:
      type: object
      required: [id, email, status, role, invitedByName, createdAt, expiresAt]
      properties:
        id: { type: string }
        email: { type: string, format: email, description: Normalized (lower case) address that was invited. }
        status: { type: string, enum: [pending, expired] }
        role: { $ref: '#/components/schemas/ClubRole' }
        invitedByName: { type: [string, 'null'], description: Name of the (last) inviter; null after that account was deleted. }
        createdAt: { type: string, format: date-time, description: Creation or last re-send (UTC). }
        expiresAt: { type: string, format: date-time, description: Seven days after `createdAt` (UTC). }
    OwnInvitation:
      type: object
      required: [id, clubName, role, invitedByName, expiresAt]
      properties:
        id: { type: string }
        clubName: { type: string }
        role: { $ref: '#/components/schemas/ClubRole' }
        invitedByName: { type: [string, 'null'] }
        expiresAt: { type: string, format: date-time }
    InvitationToken:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 128, description: The `token` query parameter of the link in the invitation mail. }
    Member:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/ClubRole' }
    Calendar:
      type: object
      required: [id, clubId, name, timezone, archivedAt, eventCount, templateCount, feedCount, exclusiveFeedCount]
      properties:
        id: { type: string }
        clubId: { type: string }
        name: { type: string }
        timezone: { type: [string, 'null'], description: Null = the club's zone. }
        archivedAt: { type: [string, 'null'], format: date-time }
        eventCount: { type: integer }
        templateCount: { type: integer }
        feedCount: { type: integer, description: Number of feeds of the club that select this calendar. }
        exclusiveFeedCount: { type: integer, description: 'Feeds whose only calendar is this one; deleting the calendar deletes them (shared feeds just lose the calendar).' }

    # ---------------------------------------------------------------- reference data
    LocationRef:
      type: object
      required: [id, name, street, zip, city, country, latitude, longitude]
      properties:
        id: { type: string }
        name: { type: [string, 'null'] }
        street: { type: [string, 'null'] }
        zip: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        country: { type: [string, 'null'] }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
    Location:
      allOf:
        - { $ref: '#/components/schemas/LocationRef' }
        - type: object
          required: [clubId, updatedAt]
          properties:
            clubId: { type: string }
            updatedAt: { type: integer, description: Unix timestamp (cache key of map images). }
    LocationInput:
      type: object
      properties:
        name: { type: [string, 'null'], maxLength: 255 }
        street: { type: [string, 'null'], maxLength: 255 }
        zip: { type: [string, 'null'], maxLength: 20 }
        city: { type: [string, 'null'], maxLength: 255 }
        country: { type: [string, 'null'], maxLength: 100 }
        latitude: { type: [number, 'null'], minimum: -90, maximum: 90, description: 'Degrees (JSON number). Only together with `longitude` (both or none); otherwise, out of range or not a number: 400 `validation_failed` with the field. On update the pair is checked after merging with the stored value, and only when a coordinate is sent.' }
        longitude: { type: [number, 'null'], minimum: -180, maximum: 180, description: Degrees (JSON number); see `latitude`. }
    LocationUsage:
      type: object
      required: [events, templates, templateNames]
      properties:
        events: { type: integer }
        templates: { type: integer }
        templateNames: { type: array, items: { type: string }, description: Only when at most 3 templates use it. }
    LinkUsage:
      type: object
      description: What deleting the item detaches it from.
      required: [events, templates, eventNames]
      properties:
        events: { type: integer }
        templates: { type: integer }
        eventNames: { type: array, items: { type: string }, description: Only when at most 3 events use it. }
    TargetGroupUsage:
      allOf:
        - { $ref: '#/components/schemas/LinkUsage' }
        - type: object
          required: [feeds]
          properties:
            feeds: { type: integer }
    Property:
      type: object
      required: [id, calendarId, name, icon]
      properties:
        id: { type: string }
        calendarId: { type: string }
        name: { type: string }
        icon: { type: [string, 'null'], description: Emoji. }
    PropertyInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        icon: { type: [string, 'null'], maxLength: 32 }
    Feature:
      type: object
      required: [id, calendarId, name]
      properties:
        id: { type: string }
        calendarId: { type: string }
        name: { type: string }
    TargetGroup:
      type: object
      required: [id, clubId, name]
      properties:
        id: { type: string }
        clubId: { type: string }
        name: { type: string }
    NameInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
    NamePatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
    PropertyLink:
      type: object
      required: [propertyId, property]
      properties:
        propertyId: { type: string }
        property:
          type: object
          required: [id, name, icon]
          properties:
            id: { type: string }
            name: { type: string }
            icon: { type: [string, 'null'] }
    FeatureLink:
      type: object
      required: [featureId, feature]
      properties:
        featureId: { type: string }
        feature:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
    TargetGroupLink:
      type: object
      required: [targetGroupId, targetGroup]
      properties:
        targetGroupId: { type: string }
        targetGroup:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }

    # ---------------------------------------------------------------- templates
    TemplateInput:
      type: object
      description: '`timeBegin`/`timeEnd` only as a pair (otherwise 400 `validation_failed`, field = the missing half); without times events from the template are all-day.'
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        timezone: { type: [string, 'null'] }
        timeBegin: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d(:[0-5]\d)?$' }
        timeEnd: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d(:[0-5]\d)?$' }
        note: { type: [string, 'null'], maxLength: 2000, description: 'Plain-text note (multi-line). Trimmed; empty or whitespace-only becomes null; more than 2000 characters is 422 `validation_failed`, field `note`. PATCH: omitted = unchanged, null or empty clears.' }
        locationId: { type: [string, 'null'] }
        propertyIds: { $ref: '#/components/schemas/IdList' }
        featureIds: { $ref: '#/components/schemas/IdList' }
        targetGroupIds: { $ref: '#/components/schemas/IdList' }
    Template:
      type: object
      required: [id, calendarId, locationId, name, timezone, timeBegin, timeEnd, note, location, properties, features, targetGroups]
      properties:
        id: { type: string }
        calendarId: { type: string }
        locationId: { type: [string, 'null'] }
        name: { type: string }
        timezone: { type: [string, 'null'] }
        timeBegin: { type: [string, 'null'], examples: ['19:00'] }
        timeEnd: { type: [string, 'null'] }
        note: { type: [string, 'null'], description: Plain-text note copied into events created from the template. }
        location:
          oneOf:
            - { $ref: '#/components/schemas/LocationRef' }
            - { type: 'null' }
        properties: { type: array, items: { $ref: '#/components/schemas/PropertyLink' } }
        features: { type: array, items: { $ref: '#/components/schemas/FeatureLink' } }
        targetGroups: { type: array, items: { $ref: '#/components/schemas/TargetGroupLink' } }
    TemplateWithCount:
      allOf:
        - { $ref: '#/components/schemas/Template' }
        - type: object
          required: [eventCount]
          properties:
            eventCount: { type: integer }

    # ---------------------------------------------------------------- events
    EventFields:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        timezone: { type: [string, 'null'], description: IANA zone; null = calendar zone. }
        date: { $ref: '#/components/schemas/Date' }
        dateEnd: { type: [string, 'null'], format: date, description: Last day of a multi-day event (not before `date`). }
        timeBegin: { $ref: '#/components/schemas/Time' }
        timeEnd: { $ref: '#/components/schemas/Time' }
        isAllDay: { type: [boolean, 'null'] }
        isDraft: { type: [boolean, 'null'] }
        note: { type: [string, 'null'], maxLength: 2000, description: 'Plain-text note (multi-line). Trimmed; empty or whitespace-only becomes null; more than 2000 characters is 422 `validation_failed`, field `note`. PATCH: omitted = unchanged, null or empty clears.' }
        locationId: { type: [string, 'null'] }
        eventTemplateId: { type: [string, 'null'] }
        propertyIds: { $ref: '#/components/schemas/IdList' }
        featureIds: { $ref: '#/components/schemas/IdList' }
        targetGroupIds: { $ref: '#/components/schemas/IdList' }
    EventInput:
      allOf:
        - { $ref: '#/components/schemas/EventFields' }
        - type: object
          required: [name, date, timeBegin, timeEnd]
          description: All-day events are sent with `isAllDay` and times `00:00`-`23:59`.
    EventPatch:
      allOf:
        - { $ref: '#/components/schemas/EventFields' }
        - type: object
          properties:
            scope: { $ref: '#/components/schemas/Scope' }
    Event:
      type: object
      required: [id, calendarId, eventTemplateId, seriesId, locationId, name, timezone, date, dateEnd, timeBegin, timeEnd, isAllDay, isDraft, externalUid, note, location, template, properties, features, targetGroups]
      properties:
        id: { type: string }
        calendarId: { type: string }
        eventTemplateId: { type: [string, 'null'] }
        seriesId: { type: [string, 'null'] }
        locationId: { type: [string, 'null'] }
        name: { type: string }
        timezone: { type: [string, 'null'], description: 'Stored zone (null = calendar, then club zone).' }
        date: { $ref: '#/components/schemas/Date' }
        dateEnd: { type: [string, 'null'], format: date }
        timeBegin: { type: string, examples: ['19:30'] }
        timeEnd: { type: string }
        isAllDay: { type: boolean }
        isDraft: { type: boolean }
        externalUid: { type: [string, 'null'], description: ICS UID of imported events. }
        note: { type: [string, 'null'], description: Plain-text note (also written as ICS `DESCRIPTION`). }
        location:
          oneOf:
            - { $ref: '#/components/schemas/LocationRef' }
            - { type: 'null' }
        template:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
            - { type: 'null' }
        properties: { type: array, items: { $ref: '#/components/schemas/PropertyLink' } }
        features: { type: array, items: { $ref: '#/components/schemas/FeatureLink' } }
        targetGroups: { type: array, items: { $ref: '#/components/schemas/TargetGroupLink' } }
    EventWithSeries:
      allOf:
        - { $ref: '#/components/schemas/Event' }
        - type: object
          required: [series]
          properties:
            series:
              oneOf:
                - { $ref: '#/components/schemas/Series' }
                - { type: 'null' }

    # ---------------------------------------------------------------- series
    SeriesRuleInput:
      type: object
      description: >-
        Exactly one of `until` and `count` (else 400 field `rule`). Errors: 400 `validation_failed` field `rule.<name>`;
        `count` > 366 → 422 `too_many_events` field `rule.count`.
      required: [frequency, weekday, startDate]
      properties:
        frequency: { type: string, enum: [weekly, biweekly, monthly] }
        weekday: { type: integer, minimum: 0, maximum: 6, description: 0 = Sunday … 6 = Saturday. }
        nth: { type: [integer, 'null'], minimum: 1, maximum: 5, description: Required for `monthly`; 5 = last. }
        startDate: { $ref: '#/components/schemas/Date' }
        until: { type: [string, 'null'], format: date, description: Inclusive; not before `startDate`. }
        count: { type: [integer, 'null'], minimum: 1, maximum: 366, description: Number of created events (skipped holidays do not count). }
        skipHolidays: { type: boolean, default: false }
        holidayCalendarIds:
          type: [array, 'null']
          maxItems: 20
          items: { type: string }
          description: >-
            Holiday calendars of THIS calendar that count for `skipHolidays` and the returned `holidays`.
            Absent/null = all holiday calendars; empty list = none. Unknown or foreign id → 422 `unknown_reference`
            field `rule.holidayCalendarIds`.
    SeriesRule:
      type: object
      required: [frequency, weekday, nth, startDate, until, count, skipHolidays, durationDays, holidayCalendarIds]
      properties:
        frequency: { type: string, enum: [weekly, biweekly, monthly] }
        weekday: { type: integer, minimum: 0, maximum: 6 }
        nth: { type: [integer, 'null'] }
        startDate: { $ref: '#/components/schemas/Date' }
        until: { type: [string, 'null'], format: date }
        count: { type: [integer, 'null'] }
        skipHolidays: { type: boolean }
        durationDays: { $ref: '#/components/schemas/DurationDays' }
        holidayCalendarIds: { type: [array, 'null'], items: { type: string }, description: 'null = all holiday calendars of the calendar.' }
    Series:
      type: object
      required: [id, calendarId, templateId, rule, eventCount, createdAt]
      properties:
        id: { type: string }
        calendarId: { type: string }
        templateId: { type: [string, 'null'] }
        rule: { $ref: '#/components/schemas/SeriesRule' }
        eventCount: { type: integer }
        createdAt: { type: string, format: date-time, examples: ['2026-10-13T12:00:00Z'] }
    DatedName:
      type: object
      required: [date, name]
      properties:
        date: { $ref: '#/components/schemas/Date' }
        name: { type: string }
    SeriesPreview:
      type: object
      required: [dates, count, skippedHolidays, holidays]
      properties:
        dates: { type: array, items: { $ref: '#/components/schemas/Date' } }
        count: { type: integer }
        skippedHolidays: { type: array, items: { $ref: '#/components/schemas/DatedName' }, description: Dates left out because of `skipHolidays`. }
        holidays: { type: array, items: { $ref: '#/components/schemas/DatedName' }, description: All dates of the rule touching a holiday (skipped or kept). }
    SeriesCreateInput:
      type: object
      required: [rule]
      properties:
        rule: { $ref: '#/components/schemas/SeriesRuleInput' }
        templateId: { type: [string, 'null'] }
        isDraft: { type: boolean, default: true }
        event:
          type: object
          description: Event values (override the template's); `date`/`dateEnd` are not allowed.
          properties:
            name: { type: string }
            timeBegin: { $ref: '#/components/schemas/Time' }
            timeEnd: { $ref: '#/components/schemas/Time' }
            isAllDay: { type: boolean }
            timezone: { type: [string, 'null'] }
            locationId: { type: [string, 'null'] }
            propertyIds: { $ref: '#/components/schemas/IdList' }
            featureIds: { $ref: '#/components/schemas/IdList' }
            targetGroupIds: { $ref: '#/components/schemas/IdList' }
            isDraft: { type: boolean }
            durationDays: { $ref: '#/components/schemas/DurationDays' }
    SeriesUpdatePreview:
      type: object
      required: [toCreate, toDelete, kept, past, skippedHolidays]
      properties:
        toCreate:
          type: array
          items:
            type: object
            required: [date]
            properties:
              date: { $ref: '#/components/schemas/Date' }
        toDelete:
          type: array
          items:
            type: object
            required: [id, date, name, isDraft]
            properties:
              id: { type: string }
              date: { $ref: '#/components/schemas/Date' }
              name: { type: string }
              isDraft: { type: boolean }
        kept: { type: integer, description: Future events that stay. }
        past: { type: integer, description: Past events (never changed). }
        skippedHolidays: { type: array, items: { $ref: '#/components/schemas/DatedName' } }

    # ---------------------------------------------------------------- import
    ImportInput:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 5000
          items: { $ref: '#/components/schemas/ImportEvent' }
        locations:
          type: array
          maxItems: 5000
          description: New places, referenced by `locationTempId`; created only if an imported event uses them.
          items:
            allOf:
              - { $ref: '#/components/schemas/LocationInput' }
              - type: object
                required: [tempId]
                properties:
                  tempId: { type: string, minLength: 1, maxLength: 1000 }
        skipDuplicates: { type: boolean, default: false }
    ImportEvent:
      allOf:
        - { $ref: '#/components/schemas/EventInput' }
        - type: object
          properties:
            externalUid: { type: [string, 'null'], maxLength: 255, description: ICS UID (duplicate detection). }
            locationTempId: { type: [string, 'null'], description: '`tempId` of an entry of `locations` (not together with `locationId`).' }
    ImportWarning:
      type: object
      required: [index, field, code, message, value, replacement]
      properties:
        index: { type: integer }
        field: { type: string, const: timezone }
        code: { type: string, const: timezone_replaced }
        message: { type: string }
        value: { type: string, description: The unknown zone (max. 100 characters). }
        replacement: { type: [string, 'null'], description: 'Calendar zone, else club zone.' }
    ImportPreview:
      type: object
      required: [events, summary, warnings]
      properties:
        events:
          type: array
          items:
            type: object
            required: [index, status]
            properties:
              index: { type: integer }
              status: { type: string, enum: [new, duplicate, invalid] }
              errors:
                type: array
                description: Only for `invalid`.
                items:
                  type: object
                  required: [field, code, message]
                  properties:
                    field: { type: [string, 'null'], examples: ['events[2].date'] }
                    code: { $ref: '#/components/schemas/ErrorCode' }
                    message: { type: string }
              duplicate:
                type: object
                description: Only for `duplicate`; the existing event and the matching rule.
                required: [id, name, date, rule]
                properties:
                  id: { type: string }
                  name: { type: string }
                  date: { $ref: '#/components/schemas/Date' }
                  rule: { type: string, enum: [externalUid, nameDate] }
        summary:
          type: object
          required: [total, new, duplicate, invalid]
          properties:
            total: { type: integer }
            new: { type: integer }
            duplicate: { type: integer }
            invalid: { type: integer }
        warnings: { type: array, items: { $ref: '#/components/schemas/ImportWarning' } }
    ImportResult:
      type: object
      required: [imported, skipped, createdLocations, ids, warnings]
      properties:
        imported: { type: integer }
        skipped: { type: integer, description: Duplicates skipped with `skipDuplicates`. }
        createdLocations:
          type: array
          items:
            type: object
            required: [tempId, id]
            properties:
              tempId: { type: string }
              id: { type: string }
        ids: { type: array, items: { type: string }, description: Ids of the created events in input order. }
        warnings: { type: array, items: { $ref: '#/components/schemas/ImportWarning' } }

    # ---------------------------------------------------------------- feeds
    FeedVisibility:
      type: string
      enum: [PUBLIC, CLUB, PRIVATE]
      description: '`PUBLIC` and `CLUB` ("Club-internal") are reachable by link without the secret and differ only for search engines; `PRIVATE` requires the secret in the link or an assignment (signed-in club access).'
    Feed:
      type: object
      required: [id, clubId, calendarIds, name, visibility, indexable, assignedCount, targetGroups]
      properties:
        id: { type: string }
        clubId: { type: string }
        calendarIds: { type: array, items: { type: string }, description: 'Calendars of the club the feed publishes (at least one; archived ones contribute nothing while archived).' }
        name: { type: string }
        visibility: { $ref: '#/components/schemas/FeedVisibility' }
        indexable: { type: boolean, description: '`visibility == PUBLIC`.' }
        assignedCount: { type: integer, description: 'People with a stored access to the feed (assigned and claimed; see "Feed members"). Counted in one grouped query for the list.' }
        sharedSecret: { type: string, description: '32 hex characters; only `PRIVATE` feeds require it. Present only when the request sets `includeSecret` (omitted by default).' }
        targetGroups:
          type: array
          description: Selected audiences (target groups) (empty = all events).
          items:
            type: object
            required: [feedId, targetGroupId]
            properties:
              feedId: { type: string }
              targetGroupId: { type: string }
    MemberSubscription:
      type: object
      required: [id, secret, selectedFeedIds, targetGroupIds, updatedAt]
      properties:
        id: { type: string, description: 'Subscription id (part of the personal subscription address).' }
        secret: { type: string, description: 'Personal secret, 64 hex characters; changes with `rotate-secret`.' }
        selectedFeedIds: { type: array, items: { type: string } }
        targetGroupIds: { type: array, items: { type: string }, description: 'Empty = all target groups.' }
        updatedAt: { type: string, format: date-time }
    FeedMember:
      type: object
      required: [userId, name, email, source, createdAt]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        source: { type: string, enum: [assigned, claimed], description: '`assigned` by staff, `claimed` by the person opening the feed with its secret.' }
        createdAt: { type: string, format: date-time }
    FeedMembership:
      type: object
      required: [clubId, clubName, isClubMember, hasFeedAccess, canJoin, canClaim]
      properties:
        clubId: { type: string, nullable: true, description: 'Id of the club, only when the signed-in user is a member of it; `null` for outsiders (no club id leak).' }
        clubName: { type: string }
        isClubMember: { type: boolean }
        hasFeedAccess: { type: boolean, description: 'Club member who may include this feed in the personal account: any member for `PUBLIC`/`CLUB`, staff or a `FeedMember` row for `PRIVATE`.' }
        canJoin: { type: boolean, description: 'Not a member yet and the club setting `feedSignup` allows this feed visibility.' }
        canClaim: { type: boolean, description: 'Member without access to this `PRIVATE` feed (the request had its secret): `POST …/claim` gives access.' }
    FeedClaimResult:
      type: object
      required: [clubId, clubName, feedId, joined]
      properties:
        clubId: { type: string }
        clubName: { type: string }
        feedId: { type: string }
        joined: { type: boolean, description: True when the call made the user a club member (role `member`). }
    FeedInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        visibility:
          allOf: [{ $ref: '#/components/schemas/FeedVisibility' }]
          description: 'Default `CLUB` on create. Invalid or empty → 400 `validation_failed` field `visibility`.'
        targetGroupIds: { $ref: '#/components/schemas/IdList' }
        calendarIds: { allOf: [{ $ref: '#/components/schemas/IdList' }], description: 'Required on create; optional on update but non-empty when sent. Every id must be a calendar of the club (422 `unknown_reference`; empty: 422 `validation_failed`).' }
    PublicFeedHeader:
      type: object
      required: [id, name, clubName, timezone, visibility, indexable, eventCount, audiences]
      properties:
        id: { type: string }
        name: { type: string, description: The feed name (replaces the former calendar name in the page title). }
        clubName: { type: string }
        timezone: { type: string, description: 'Time zone of the club (else UTC). An event without its own zone falls back to its calendar zone, then the club zone.' }
        visibility: { $ref: '#/components/schemas/FeedVisibility' }
        indexable: { type: boolean, description: Drives the `<meta name="robots">` of the SPA page. }
        eventCount: { type: integer, description: All published events of the feed (not only the range). }
        audiences:
          type: array
          description: Audiences (target groups) used by the feed's published events.
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
    PublicEvent:
      type: object
      required: [id, calendarId, name, date, dateEnd, timeBegin, timeEnd, isAllDay, note, timezone, location, properties, features, targetGroups]
      properties:
        id: { type: string }
        calendarId: { type: string }
        name: { type: string }
        date: { $ref: '#/components/schemas/Date' }
        dateEnd: { type: [string, 'null'], format: date }
        timeBegin: { type: string }
        timeEnd: { type: string }
        isAllDay: { type: boolean }
        note: { type: [string, 'null'] }
        timezone: { type: string, description: 'Effective zone (event, else calendar, else club).' }
        location:
          oneOf:
            - allOf:
                - { $ref: '#/components/schemas/LocationRef' }
                - type: object
                  required: [updatedAt]
                  properties:
                    updatedAt: { type: integer }
            - { type: 'null' }
        properties: { type: array, items: { $ref: '#/components/schemas/PropertyLink' } }
        features: { type: array, items: { $ref: '#/components/schemas/FeatureLink' } }
        targetGroups: { type: array, items: { $ref: '#/components/schemas/TargetGroupLink' } }

    # ---------------------------------------------------------------- holidays
    HolidayCalendar:
      type: object
      required: [id, name, url, type, source, sourceCountry, sourceSubdivision, sourceLanguage, lastFetchedAt, eventCount]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: [string, 'null'], format: uri, description: Null for predefined (`openholidays`) calendars. }
        type: { $ref: '#/components/schemas/HolidayType' }
        source: { type: string, enum: [ics, openholidays] }
        sourceCountry: { type: [string, 'null'], description: 'ISO country code of an `openholidays` calendar.' }
        sourceSubdivision: { type: [string, 'null'], description: 'Subdivision code, e.g. `DE-BY`.' }
        sourceLanguage: { type: [string, 'null'], enum: [de, en, null] }
        lastFetchedAt: { type: [string, 'null'], format: date-time }
        eventCount: { type: integer, description: Stored holidays (also in the response of create and refresh). }
    HolidayType:
      type: string
      enum: [public, school, other]
      description: Kind of holidays; `other` for ICS imports unless set.
    HolidayCalendarInput:
      type: object
      required: [name, url]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        url: { type: string, format: uri, maxLength: 2048 }
        type: { $ref: '#/components/schemas/HolidayType' }
    HolidayCalendarPatch:
      type: object
      minProperties: 1
      description: At least one of `name`, `url` and `type`.
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        url: { type: string, format: uri, maxLength: 2048 }
        type: { $ref: '#/components/schemas/HolidayType' }
    PredefinedHolidayCalendarsInput:
      type: object
      required: [country, kinds]
      properties:
        country: { type: string, pattern: '^[A-Za-z]{2}$' }
        subdivision: { type: [string, 'null'], description: 'Subdivision code from the subdivision list, e.g. `DE-BY`; omitted = nationwide data.' }
        regionName: { type: string, maxLength: 150, description: 'Display name for the calendar names; default the subdivision or country code.' }
        kinds:
          type: array
          minItems: 1
          items: { type: string, enum: [public, school] }
    HolidaySubdivision:
      type: object
      required: [code, name, children]
      properties:
        code: { type: string, examples: [DE-BY] }
        name: { type: string }
        children:
          type: array
          items: { $ref: '#/components/schemas/HolidaySubdivision' }
    HolidayEvent:
      type: object
      required: [id, holidayCalendarId, name, date, dateEnd]
      properties:
        id: { type: string }
        holidayCalendarId: { type: string }
        name: { type: string }
        date: { $ref: '#/components/schemas/Date' }
        dateEnd: { type: [string, 'null'], format: date }
