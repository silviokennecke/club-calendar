[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisor/supervisord.pid
childlogdir=/tmp/supervisor

[unix_http_server]
file=/tmp/supervisor/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor/supervisor.sock

[eventlistener:crash-guard]
command=python3 /usr/local/share/supervisord/crash-guard.py
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED
autorestart=true
stdout_logfile=NONE
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
