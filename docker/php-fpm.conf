[www]
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; hand the container environment (APP_SECRET, DATABASE_URL, ...) to PHP
clear_env = no
; no access log (Caddy logs requests); see the Dockerfile for the base image's access.log
catch_workers_output = yes
decorate_workers_output = no
