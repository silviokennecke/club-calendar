parameters:
    app.data_export_ip_per_day: 1000

services:
    # Counts SQL statements in tests (N+1 checks, e.g. CountersTest)
    App\Tests\Helper\QueryCounter:
        tags: ['doctrine.middleware']

    # Not yet used by a controller everywhere; tests fetch it from the container
    App\Service\MfaService:
        autowire: true
        public: true

    App\Tests\Support\StepUpProbeController:
        autowire: true
        tags: ['controller.service_arguments']

    # Tests replace it with a failing one
    App\Export\UserDataExportService:
        autowire: true
        public: true

    # Telemetry tests read what would be exported (enabled by setting OTEL_EXPORTER_OTLP_ENDPOINT in the test)
    test.telemetry.storage:
        class: ArrayObject
        public: true

    test.telemetry.exporter:
        class: OpenTelemetry\SDK\Metrics\MetricExporter\InMemoryExporter
        arguments: ['@test.telemetry.storage', 'delta']

    test.telemetry.log_storage:
        class: ArrayObject
        public: true

    test.telemetry.log_exporter:
        class: OpenTelemetry\SDK\Logs\Exporter\InMemoryExporter
        arguments: ['@test.telemetry.log_storage']

    App\Telemetry\Telemetry:
        autowire: true
        public: true
        arguments:
            $exporter: '@test.telemetry.exporter'
            $logExporter: '@test.telemetry.log_exporter'
