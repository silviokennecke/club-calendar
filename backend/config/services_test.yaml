parameters:
    app.data_export_ip_per_day: 1000

services:
    # Counts SQL statements in tests (N+1 checks, e.g. CountersTest)
    App\Tests\Helper\QueryCounter:
        tags: ['doctrine.middleware']

    # Not yet used by a controller everywhere; tests fetch it from the container
    App\Service\MfaService:
        autowire: true
        public: true

    App\Tests\Support\StepUpProbeController:
        autowire: true
        tags: ['controller.service_arguments']

    # Tests replace it with a failing one
    App\Export\UserDataExportService:
        autowire: true
        public: true
