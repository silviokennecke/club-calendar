# The dev environment is shared by E2E test runs, which register and log in
# dozens of users from one IP. The auth limits are raised like in the test
# environment so E2E and local development don't hit the production
# thresholds. The verification resend, password reset and e-mail change limits
# stay at their production values.
framework:
    rate_limiter:
        verification_resend_ip:
            policy: fixed_window
            limit: 25
            interval: 24h
            cache_pool: app.auth_limiter_pool
        auth_login_ip:
            policy: sliding_window
            limit: 100
            interval: 15m
            cache_pool: app.auth_limiter_pool
        auth_login_email:
            policy: sliding_window
            limit: 5
            interval: 15m
            cache_pool: app.auth_limiter_pool
        auth_register_ip:
            policy: sliding_window
            limit: 100
            interval: 1h
            cache_pool: app.auth_limiter_pool
        auth_register_email:
            policy: sliding_window
            limit: 3
            interval: 1h
            cache_pool: app.auth_limiter_pool
        auth_refresh_ip:
            policy: sliding_window
            limit: 100
            interval: 1m
            cache_pool: app.auth_limiter_pool
        auth_other_ip:
            policy: sliding_window
            limit: 1000
            interval: 1m
            cache_pool: app.auth_limiter_pool

services:
    app.auth_limiter_pool:
        class: Symfony\Component\Cache\Adapter\FilesystemAdapter
        arguments: ['auth', 0, '%kernel.project_dir%/var/dev-auth-limiter']
