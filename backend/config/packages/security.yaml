security:
    password_hashers:
        App\Entity\User:
            algorithm: auto
        # E-mail confirmation codes (EmailVerificationService); the input is peppered with APP_SECRET there.
        verification_code:
            algorithm: bcrypt
            cost: 12

    providers:
        jwt_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Public feed routes carry no authentication; claim and membership need the signed-in user (api firewall).
        public_feed:
            pattern: ^/api/feed/(?![^/]+/(claim|membership)$)
            security: false

        # MCP endpoint: opaque OAuth access tokens only (App\Mcp\Security\McpAuthenticator); must precede `api`.
        mcp:
            pattern: ^/api/mcp(/|$)
            stateless: true
            provider: jwt_user_provider
            custom_authenticators:
                - App\Mcp\Security\McpAuthenticator

        api:
            pattern: ^/api/
            stateless: true
            provider: jwt_user_provider
            jwt: ~

    # Member routes need a signed-in user before their entity is loaded or the member check runs: without
    # a token they answer 401 `missing_token` (ExceptionListener), never 403/404 (no probing of ids).
    access_control:
        # Invitation preview for signed-out visitors: the mail token is the credential (IP-rate-limited).
        - { path: ^/api/invitations/preview$, roles: PUBLIC_ACCESS }
        - { path: ^/api/(clubs|calendars|invitations)(/|$), roles: IS_AUTHENTICATED }
        # E-mail confirmation belongs to the restricted session of the signed-in user (EmailVerificationGateListener).
        - { path: ^/api/auth/(verify-email|resend-verification)$, roles: IS_AUTHENTICATED }
        - { path: ^/api/holiday-sources(/|$), roles: IS_AUTHENTICATED }
        - { path: ^/api/map/geocode/, roles: IS_AUTHENTICATED }
        # Tile/style/font proxy: signed-in users only (the public feed uses the static images /api/map/image/*).
        - { path: ^/api/mapbox/, roles: IS_AUTHENTICATED }
        # Consent API of the OAuth flow: a signed-in user (401 missing_token otherwise)
        - { path: '^/api/oauth/(authorize/decision|authorization-request/)', roles: IS_AUTHENTICATED }
        # OAuth server for MCP clients: metadata, registration, token, revocation (and the authorize redirect) are public;
        # the tokens/credentials in the request are the authentication.
        - { path: ^/api/oauth/, roles: PUBLIC_ACCESS }
        # Explicit public allow-list; every other /api route falls through to the deny-by-default rule below.
        # A new public route must be added here AND to PUBLIC_PATTERNS in tests/Unit/AccessControlCoverageTest.php.
        - { path: ^/api/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/legal(/|$), roles: PUBLIC_ACCESS }
        - { path: ^/api/map/image/, roles: PUBLIC_ACCESS }
        - { path: '^/api/feed/[^/]+/(claim|membership)$', roles: IS_AUTHENTICATED }
        - { path: ^/api/feed/, roles: PUBLIC_ACCESS }
        # The MCP firewall authenticates (McpAuthenticator answers 401 with resource metadata; OPTIONS passes).
        - { path: ^/api/mcp(/|$), roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/(login|register|registration|identify|token|logout|forgot-password|reset-password|providers|verify-new-email)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/webauthn/authenticate/(options|verify)$, roles: PUBLIC_ACCESS }
        # Second factor of the password sign-in: the signed mfaToken is the credential.
        - { path: ^/api/auth/mfa/(verify|passkey/(options|verify))$, roles: PUBLIC_ACCESS }
        # SSO start/callback/link redirect (state/ticket is the credential); DELETE /oauth/{provider} stays authenticated.
        - { path: ^/api/auth/oauth/[^/]+/(callback|link)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/oauth/[^/]+$, methods: [GET], roles: PUBLIC_ACCESS }
        # Deny by default: any other /api route needs a signed-in user.
        - { path: ^/api, roles: IS_AUTHENTICATED }

when@test:
    security:
        password_hashers:
            # Cheap `auto` (bcrypt cost 5, so the tests can build a weaker cost-4 hash that needs a rehash).
            App\Entity\User:
                algorithm: auto
                cost: 5
            # Lowest bcrypt cost keeps the suite fast.
            verification_code:
                algorithm: bcrypt
                cost: 4
