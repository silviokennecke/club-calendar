security:
    password_hashers:
        App\Entity\User:
            algorithm: bcrypt
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: auto
        # E-mail confirmation codes (EmailVerificationService); the input is peppered with APP_SECRET there.
        verification_code:
            algorithm: bcrypt
            cost: 12

    providers:
        jwt_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        public_feed:
            pattern: ^/api/feed/
            security: false

        api:
            pattern: ^/api/
            stateless: true
            provider: jwt_user_provider
            jwt: ~

    # Member routes need a signed-in user before their entity is loaded or the member check runs: without
    # a token they answer 401 `missing_token` (ExceptionListener), never 403/404 (no probing of ids).
    access_control:
        - { path: ^/api/(clubs|calendars)(/|$), roles: IS_AUTHENTICATED }
        - { path: ^/api/map/geocode/, roles: IS_AUTHENTICATED }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: plaintext
            # Lowest bcrypt cost keeps the suite fast.
            verification_code:
                algorithm: bcrypt
                cost: 4
