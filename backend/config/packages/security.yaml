security:
    password_hashers:
        App\Entity\User:
            algorithm: bcrypt
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: auto

    providers:
        jwt_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        public_feed:
            pattern: ^/api/feed/
            security: false

        api:
            pattern: ^/api/
            stateless: true
            provider: jwt_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/token$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/providers$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/oauth/, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/webauthn/authenticate/, roles: PUBLIC_ACCESS }
        - { path: ^/api/feed/, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: plaintext
