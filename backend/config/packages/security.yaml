security:
    password_hashers:
        App\Entity\User:
            algorithm: bcrypt
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: auto

    providers:
        jwt_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        public_feed:
            pattern: ^/api/feed/
            security: false

        api:
            pattern: ^/api/
            stateless: true
            provider: jwt_user_provider
            jwt: ~

    access_control: []

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: plaintext
