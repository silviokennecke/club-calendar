security:
    password_hashers:
        App\Entity\User:
            algorithm: bcrypt
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: auto
        # E-mail confirmation codes (EmailVerificationService); the input is peppered with APP_SECRET there.
        verification_code:
            algorithm: bcrypt
            cost: 12

    providers:
        jwt_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        public_feed:
            pattern: ^/api/feed/
            security: false

        # MCP endpoint: opaque OAuth access tokens only (App\Mcp\Security\McpAuthenticator); must precede `api`.
        mcp:
            pattern: ^/api/mcp(/|$)
            stateless: true
            provider: jwt_user_provider
            custom_authenticators:
                - App\Mcp\Security\McpAuthenticator

        api:
            pattern: ^/api/
            stateless: true
            provider: jwt_user_provider
            jwt: ~

    # Member routes need a signed-in user before their entity is loaded or the member check runs: without
    # a token they answer 401 `missing_token` (ExceptionListener), never 403/404 (no probing of ids).
    access_control:
        # Invitation preview for signed-out visitors: the mail token is the credential (IP-rate-limited).
        - { path: ^/api/invitations/preview$, roles: PUBLIC_ACCESS }
        - { path: ^/api/(clubs|calendars|invitations)(/|$), roles: IS_AUTHENTICATED }
        # E-mail confirmation belongs to the restricted session of the signed-in user (EmailVerificationGateListener).
        - { path: ^/api/auth/(verify-email|resend-verification)$, roles: IS_AUTHENTICATED }
        - { path: ^/api/holiday-sources(/|$), roles: IS_AUTHENTICATED }
        - { path: ^/api/map/geocode/, roles: IS_AUTHENTICATED }
        # Tile/style/font proxy: signed-in users only (the public feed uses the static images /api/map/image/*).
        - { path: ^/api/mapbox/, roles: IS_AUTHENTICATED }
        # Consent API of the OAuth flow: a signed-in user (401 missing_token otherwise)
        - { path: '^/api/oauth/(authorize/decision|authorization-request/)', roles: IS_AUTHENTICATED }
        # OAuth server for MCP clients: metadata, registration, token, revocation (and the authorize redirect) are public;
        # the tokens/credentials in the request are the authentication.
        - { path: ^/api/oauth/, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: plaintext
            # Lowest bcrypt cost keeps the suite fast.
            verification_code:
                algorithm: bcrypt
                cost: 4
