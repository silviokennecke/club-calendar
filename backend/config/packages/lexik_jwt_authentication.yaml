parameters:
    env(JWT_PASSPHRASE): '%env(APP_SECRET)%'
    env(JWT_PRIVATE_KEY): '%kernel.project_dir%/config/jwt/private.pem'
    env(JWT_PUBLIC_KEY): '%kernel.project_dir%/config/jwt/public.pem'

lexik_jwt_authentication:
    secret_key: '%env(JWT_PRIVATE_KEY)%'
    public_key: '%env(JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: 900    # 15 minutes
    user_id_claim: email
    token_extractors:
        authorization_header:
            enabled: true
            prefix: Bearer
            name: Authorization
