framework:
    rate_limiter:
        # Geocoding service rate limiters (high limits for testing)
        geocoder_daily:
            policy: fixed_window
            limit: 100000
            interval: '24 hours'
        geocoder_system:
            policy: compound
            limiters: [geocoder_daily]
        geocoder_hourly:
            policy: fixed_window
            limit: 10000
            interval: '1 hour'
        geocoder_user:
            policy: compound
            limiters: [geocoder_hourly]
        # Mapbox image service rate limiters (high limits for testing)
        mapbox_image_daily:
            policy: fixed_window
            limit: 100000
            interval: '24 hours'
        mapbox_image_weekly:
            policy: fixed_window
            limit: 500000
            interval: '7 days'
        mapbox_image_monthly:
            policy: fixed_window
            limit: 1000000
            interval: '30 days'
        mapbox_image_system:
            policy: compound
            limiters: [mapbox_image_daily, mapbox_image_weekly, mapbox_image_monthly]
        verification_resend_ip:
            policy: fixed_window
            limit: 25
            interval: '24 hours'
            cache_pool: app.auth_limiter_pool
        # The suite signs in and registers from one client IP, so the per-IP auth limits are high here;
        # the throttling tests (RateLimitTest) work against these values. State lives in the process
        # (directory var/test-auth-limiter, emptied by DatabaseResetter::reset), the per-address limits keep their production values.
        auth_login_ip:
            policy: sliding_window
            limit: 100
            interval: '15 minutes'
            cache_pool: app.auth_limiter_pool
        auth_login_email:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
            cache_pool: app.auth_limiter_pool
        auth_identify_ip:
            policy: sliding_window
            limit: 100
            interval: '15 minutes'
            cache_pool: app.auth_limiter_pool
        auth_identify_email:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
            cache_pool: app.auth_limiter_pool
        auth_register_ip:
            policy: sliding_window
            limit: 100
            interval: '1 hour'
            cache_pool: app.auth_limiter_pool
        auth_register_email:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
            cache_pool: app.auth_limiter_pool
        auth_refresh_ip:
            policy: sliding_window
            limit: 100
            interval: '1 minute'
            cache_pool: app.auth_limiter_pool
        auth_other_ip:
            policy: sliding_window
            limit: 1000
            interval: '1 minute'
            cache_pool: app.auth_limiter_pool
        account_delete_attempt:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
            cache_pool: app.auth_limiter_pool
        account_delete_code:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
            cache_pool: app.auth_limiter_pool
        invitation_user:
            policy: sliding_window
            limit: 20
            interval: '24 hours'
            cache_pool: app.auth_limiter_pool
        invitation_club:
            policy: sliding_window
            limit: 50
            interval: '24 hours'
            cache_pool: app.auth_limiter_pool
        invitation_email:
            policy: sliding_window
            limit: 5
            interval: '24 hours'
            cache_pool: app.auth_limiter_pool
        oauth_register_ip:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
            cache_pool: app.auth_limiter_pool
        oauth_token_ip:
            policy: sliding_window
            limit: 100
            interval: '1 minute'
            cache_pool: app.auth_limiter_pool
        mcp_grant:
            policy: sliding_window
            limit: 120
            interval: '1 minute'
            cache_pool: app.auth_limiter_pool
        mcp_ip:
            policy: sliding_window
            limit: 1000
            interval: '1 minute'
            cache_pool: app.auth_limiter_pool

services:
    app.auth_limiter_pool:
        class: Symfony\Component\Cache\Adapter\FilesystemAdapter
        arguments: ['auth', 0, '%kernel.project_dir%/var/test-auth-limiter']
