framework:
    rate_limiter:
        geocoder_daily:
            policy: fixed_window
            limit: 3000
            interval: '24 hours'
        geocoder_system:
            policy: compound
            limiters: [geocoder_daily]
        geocoder_hourly:
            policy: fixed_window
            limit: 50
            interval: '1 hour'
        geocoder_user:
            policy: compound
            limiters: [geocoder_hourly]
        mapbox_image_daily:
            policy: fixed_window
            limit: 2500
            interval: '24 hours'
        mapbox_image_weekly:
            policy: fixed_window
            limit: 13000
            interval: '7 days'
        mapbox_image_monthly:
            policy: fixed_window
            limit: 45000
            interval: '30 days'
        mapbox_image_system:
            policy: compound
            limiters: [mapbox_image_daily, mapbox_image_weekly, mapbox_image_monthly]
        mapbox_proxy_daily:
            policy: fixed_window
            limit: 2500
            interval: '24 hours'
        mapbox_proxy_weekly:
            policy: fixed_window
            limit: 13000
            interval: '7 days'
        mapbox_proxy_monthly:
            policy: fixed_window
            limit: 45000
            interval: '30 days'
        mapbox_proxy_system:
            policy: compound
            limiters: [mapbox_proxy_daily, mapbox_proxy_weekly, mapbox_proxy_monthly]
        email_verification_resend:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        # Forgot password: per normalized e-mail address and per client IP. Over the limit the endpoint
        # still answers 204, only no mail is sent (no oracle).
        password_reset_email:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        password_reset_ip:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        # Change e-mail: confirmation mails per account.
        email_change_request:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # Auth endpoints (AuthRateLimiter). Login: every attempt per client IP, only failed ones per
        # normalized e-mail address (a successful sign-in clears them).
        auth_login_ip:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        auth_login_email:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        auth_register_ip:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        auth_register_email:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        auth_refresh_ip:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
        # E-mail confirmation link, passkey ceremonies, SSO start/callback.
        auth_other_ip:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
