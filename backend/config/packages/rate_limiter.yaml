parameters:
    # Per-IP limits of the sign-in, registration and token refresh endpoints. The defaults are the production
    # values; only the Playwright suite (docs/ops/E2E.md, CI) raises them, because it registers and signs in
    # far more often than that from one IP. The test environment has its own limits (config/packages/test).
    env(AUTH_LOGIN_IP_LIMIT): '10'
    env(AUTH_REGISTER_IP_LIMIT): '5'
    env(AUTH_REFRESH_IP_LIMIT): '60'
    env(AUTH_IDENTIFY_IP_LIMIT): '30'
    env(AUTH_IDENTIFY_EMAIL_LIMIT): '10'
    # Public feed endpoints, requests per minute: per client IP and per feed id. 0 switches a limit off.
    env(FEED_RATE_LIMIT_PER_IP): '120'
    env(FEED_RATE_LIMIT_PER_FEED): '600'

framework:
    rate_limiter:
        geocoder_daily:
            policy: fixed_window
            limit: 3000
            interval: '24 hours'
        geocoder_system:
            policy: compound
            limiters: [geocoder_daily]
        geocoder_hourly:
            policy: fixed_window
            limit: 50
            interval: '1 hour'
        geocoder_user:
            policy: compound
            limiters: [geocoder_hourly]
        mapbox_image_daily:
            policy: fixed_window
            limit: 2500
            interval: '24 hours'
        mapbox_image_weekly:
            policy: fixed_window
            limit: 13000
            interval: '7 days'
        mapbox_image_monthly:
            policy: fixed_window
            limit: 45000
            interval: '30 days'
        mapbox_image_system:
            policy: compound
            limiters: [mapbox_image_daily, mapbox_image_weekly, mapbox_image_monthly]
        mapbox_proxy_daily:
            policy: fixed_window
            limit: 2500
            interval: '24 hours'
        mapbox_proxy_weekly:
            policy: fixed_window
            limit: 13000
            interval: '7 days'
        mapbox_proxy_monthly:
            policy: fixed_window
            limit: 45000
            interval: '30 days'
        mapbox_proxy_system:
            policy: compound
            limiters: [mapbox_proxy_daily, mapbox_proxy_weekly, mapbox_proxy_monthly]
        # Resend of the e-mail confirmation code: per client IP (the per-account cooldown is in AuthService).
        verification_resend_ip:
            policy: fixed_window
            limit: 25
            interval: '24 hours'
        # Forgot password: per normalized e-mail address and per client IP. Over the limit the endpoint
        # still answers 204, only no mail is sent (no oracle).
        password_reset_email:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        password_reset_ip:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        # Change e-mail: confirmation mails per account.
        email_change_request:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # Auth endpoints (AuthRateLimiter). Login: every attempt per client IP, only failed ones per
        # normalized e-mail address (a successful sign-in clears them).
        auth_login_ip:
            policy: sliding_window
            limit: '%env(int:AUTH_LOGIN_IP_LIMIT)%'
            interval: '15 minutes'
        auth_login_email:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # Identify (e-mail-first sign-in; an intended account-existence oracle, hence tight limits)
        auth_identify_ip:
            policy: sliding_window
            limit: '%env(int:AUTH_IDENTIFY_IP_LIMIT)%'
            interval: '15 minutes'
        auth_identify_email:
            policy: sliding_window
            limit: '%env(int:AUTH_IDENTIFY_EMAIL_LIMIT)%'
            interval: '15 minutes'
        auth_register_ip:
            policy: sliding_window
            limit: '%env(int:AUTH_REGISTER_IP_LIMIT)%'
            interval: '1 hour'
        auth_register_email:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        auth_refresh_ip:
            policy: sliding_window
            limit: '%env(int:AUTH_REFRESH_IP_LIMIT)%'
            interval: '1 minute'
        # E-mail confirmation code, passkey ceremonies, SSO start/callback.
        auth_other_ip:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
        # Account deletion (AUTH-03): failed/any confirmation attempts and code mails per user.
        account_delete_attempt:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        account_delete_code:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # Club invitations (mail sending): per user, per club and per invited address, 24 hours each.
        passkey_register_attempt:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        passkey_register_code:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        invitation_user:
            policy: sliding_window
            limit: 20
            interval: '24 hours'
        invitation_club:
            policy: sliding_window
            limit: 50
            interval: '24 hours'
        invitation_resend:
            policy: fixed_window
            limit: 1
            interval: '60 seconds'
        invitation_email:
            policy: sliding_window
            limit: 5
            interval: '24 hours'
        # Public invitation preview (token lookup, unauthenticated): per client IP.
        invitation_preview_ip:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
        # OAuth dynamic client registration (unauthenticated): per client IP.
        oauth_register_ip:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # OAuth token and revoke endpoints (shared bucket): per client IP.
        oauth_token_ip:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
        # OAuth consent decisions (signed-in user): per user.
        oauth_decision_user:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
        # Remote MCP endpoint: per grant and per client IP.
        mcp_grant:
            policy: sliding_window
            limit: 120
            interval: '1 minute'
        mcp_ip:
            policy: sliding_window
            limit: 120
            interval: '1 minute'
        # Public feed endpoints (FeedRateLimiter): per client IP and per feed id (taken unchecked from the URL).
        # A configured limit of 0 disables the check in AuthRateLimiter::assertFeedAllowed (the limiter is then unused).
        feed_ip:
            policy: sliding_window
            limit: '%env(int:FEED_RATE_LIMIT_PER_IP)%'
            interval: '1 minute'
        feed_id:
            policy: sliding_window
            limit: '%env(int:FEED_RATE_LIMIT_PER_FEED)%'
            interval: '1 minute'
        # PDF export (expensive to render): per user and per client IP.
        pdf_export_user:
            policy: sliding_window
            limit: 10
            interval: '10 minutes'
        pdf_export_ip:
            policy: sliding_window
            limit: 30
            interval: '10 minutes'
        # Mapbox spending paths (per user / IP, outer cap stays mapbox_proxy_* / mapbox_image_*). Cache hits count too.
        mapbox_tiles_user:
            policy: sliding_window
            limit: 1800
            interval: '1 hour'
        mapbox_tiles_ip:
            policy: sliding_window
            limit: 3600
            interval: '1 hour'
        mapbox_style_user:
            policy: sliding_window
            limit: 900
            interval: '1 hour'
        mapbox_style_global:
            policy: sliding_window
            limit: 60000
            interval: '1 day'
        map_image_ip:
            policy: sliding_window
            limit: 360
            interval: '1 hour'
