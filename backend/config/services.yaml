parameters:
    env(APP_URL): 'http://localhost:8080'
    env(FRONTEND_URL): '%env(APP_URL)%'
    env(BACKEND_URL): '%env(APP_URL)%'
    env(WEBAUTHN_RP_ID): '%env(string:key:host:url:APP_URL)%'
    env(WEBAUTHN_RP_NAME): 'Club Calendar'
    env(WEBAUTHN_USER_VERIFICATION): 'preferred'

    env(MICROSOFT_TENANT_ID): 'common'
    microsoft_oidc_issuer: 'https://login.microsoftonline.com/%env(MICROSOFT_TENANT_ID)%/v2.0'

    # Seconds the login token of POST /api/auth/verify-email stays valid
    env(EMAIL_VERIFICATION_LOGIN_TOKEN_TTL): '30'

    env(MAP_IMAGE_CACHE_TTL): '2592000'  # 30 days
    env(GEOCODER_CACHE_TTL): '3600'       # 1 hour
    env(MAPBOX_PROXY_CACHE_TTL): '2592000' # 30 days

    env(MAPBOX_TOKEN): ''
    map.image.zoom: 14
    map.image.width: 800
    map.image.height: 288
    mapbox.allowed_patterns:
        - pattern: '^/v4/[^/]+/[0-9]+/[0-9]+/[0-9]+'
          methods: ['GET']
          rate_limited: true
        - pattern: '^/styles/'
          methods: ['GET']
          rate_limited: false
        - pattern: '^/fonts/'
          methods: ['GET']
          rate_limited: false

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Holiday feed URLs come from users: the client checks every resolved address and every redirect
    # target (IPv4 and IPv6) against private networks; assertSafeUrl() only sees the first host.
    holiday_calendar.http_client:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments: ['@http_client']

    App\Service\HolidayCalendarService:
        arguments:
            $httpClient: '@holiday_calendar.http_client'

    geocoder.mapbox_de:
        class: Geocoder\StatefulGeocoder
        arguments:
            $provider: '@bazinga_geocoder.provider.mapbox'
            $locale: 'de'

    App\Service\Map\BazingaGeocoderAdapter:
        arguments:
            $geocoder: '@geocoder.mapbox_de'

    App\Service\Map\MapboxMapImageProvider:
        arguments:
            $mapboxToken: '%env(MAPBOX_TOKEN)%'

    App\Service\Map\CachingGeocoderDecorator:
        arguments:
            $inner: '@App\Service\Map\RateLimitedGeocoderDecorator'
            $geocoderResponsesCache: '@geocoder_responses'

    App\Service\Map\RateLimitedGeocoderDecorator:
        arguments:
            $inner: '@App\Service\Map\BazingaGeocoderAdapter'

    App\Service\Map\CachingMapImageProvider:
        arguments:
            $inner: '@App\Service\Map\RateLimitedMapImageProvider'
            $mapImagesCache: '@map_images'

    App\Service\Map\RateLimitedMapImageProvider:
        arguments:
            $inner: '@App\Service\Map\MapboxMapImageProvider'

    App\Service\Map\MapboxProxyService:
        arguments:
            $allowedPatterns: '%mapbox.allowed_patterns%'
            $mapboxProxyCache: '@mapbox_proxy'
            $mapboxToken: '%env(MAPBOX_TOKEN)%'

    App\EventListener\LocationMapCacheInvalidator:
        arguments:
            $mapImagesCache: '@map_images'
            $imageZoom: '%map.image.zoom%'
            $imageWidth: '%map.image.width%'
            $imageHeight: '%map.image.height%'

    App\Controller\MapController:
        arguments:
            $imageZoom: '%map.image.zoom%'
            $imageWidth: '%map.image.width%'
            $imageHeight: '%map.image.height%'

    GeocoderInterface:
        alias: App\Service\Map\CachingGeocoderDecorator
        public: true

    App\Service\Map\GeocoderInterface:
        alias: App\Service\Map\CachingGeocoderDecorator
        public: true

    MapImageProviderInterface:
        alias: App\Service\Map\CachingMapImageProvider
        public: true

    App\Service\Map\MapImageProviderInterface:
        alias: App\Service\Map\CachingMapImageProvider
        public: true

    App\Service\TokenService:
        arguments:
            $refreshSecret: '%env(JWT_REFRESH_SECRET)%'

    App\Service\WebAuthnService:
        arguments:
            $rpId:      '%env(WEBAUTHN_RP_ID)%'
            $rpName:    '%env(WEBAUTHN_RP_NAME)%'
            # Only the frontend origin may complete a WebAuthn ceremony (clientDataJSON.origin).
            $allowedOrigin: '%env(FRONTEND_URL)%'
            # preferred | required | discouraged ("required" rejects responses without the UV flag)
            $userVerification: '%env(WEBAUTHN_USER_VERIFICATION)%'

    App\Controller\OAuthController:
        arguments:
            $frontendUrl: '%env(FRONTEND_URL)%'

    App\EventListener\ExceptionListener:
        arguments:
            $httpErrorListener: '@exception_listener'
