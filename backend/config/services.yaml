parameters:
    app.data_export_ip_per_day: 10
    env(APP_URL): 'http://localhost:8080'
    env(FRONTEND_URL): '%env(APP_URL)%'
    env(BACKEND_URL): '%env(APP_URL)%'
    env(TRUSTED_HOSTS): ''

    # Older APP_SECRET values (comma-separated) still accepted for decrypting stored secrets while rotating APP_SECRET
    env(APP_SECRET_PREVIOUS): ''

    env(MESSENGER_TRANSPORT_DSN): 'doctrine://default?auto_setup=0'

    # Scheduler: SCHEDULER_ENABLED=false leaves the schedule empty. LOCK_DSN empty = the application database.
    env(SCHEDULER_ENABLED): 'true'
    env(LOCK_DSN): ''

    env(LEGAL_DOCUMENTS_PATH): '%kernel.project_dir%/legal'
    app.legal_documents_path: '%env(resolve:LEGAL_DOCUMENTS_PATH)%'
    # External documents (absolute http(s) URL) used when the Markdown file of the type is missing
    env(LEGAL_IMPRINT_URL): ''
    env(LEGAL_PRIVACY_URL): ''
    env(LEGAL_TERMS_URL): ''
    app.legal_imprint: '%env(LEGAL_IMPRINT_URL)%'
    app.legal_privacy: '%env(LEGAL_PRIVACY_URL)%'
    app.legal_terms: '%env(LEGAL_TERMS_URL)%'

    # Header with the client's ISO country code set by a trusted proxy/CDN (empty = off)
    env(CLIENT_COUNTRY_HEADER): ''

    # Offline GeoIP (city + country in security notices): with a licence key MaxMind is the only source,
    # `app:geoip:update` downloads GeoLite2-City to GEOIP_DB_PATH
    env(MAXMIND_ACCOUNT_ID): ''
    env(MAXMIND_LICENSE_KEY): ''
    env(GEOIP_DB_PATH): '%kernel.project_dir%/var/geoip/GeoLite2-City.mmdb'

    env(WEBAUTHN_RP_ID): '%env(string:key:host:url:APP_URL)%'
    env(APP_NAME): 'Club Calendar'
    env(WEBAUTHN_RP_NAME): '%env(APP_NAME)%'
    env(WEBAUTHN_USER_VERIFICATION): 'preferred'

    env(MICROSOFT_TENANT_ID): 'common'
    microsoft_oidc_issuer: 'https://login.microsoftonline.com/%env(MICROSOFT_TENANT_ID)%/v2.0'

    # Seconds the one-time code in the SSO redirect (`/auth/callback?code=`) stays valid
    env(OAUTH_LOGIN_CODE_TTL): '180'

    # Refresh tokens: seconds a session lasts at most (however often refreshed; each token slides 7 days) and
    # seconds in which an already rotated token may be presented again (retry / parallel tabs) without
    # revoking the session
    env(REFRESH_TOKEN_ABSOLUTE_LIFETIME): '2592000' # 30 days
    env(REFRESH_TOKEN_REUSE_GRACE): '10'

    # MCP / OAuth: access token lifetime (s); refresh token lifetime (sliding, s), absolute end of a grant (s) and
    # the grace (s) in which a rotated refresh token may be presented again. MCP_ALLOWED_CLIENTS: comma-separated
    # client families allowed to register (`*` alone = all clients, empty = none)
    env(MCP_ACCESS_TOKEN_TTL): '3600'
    env(MCP_REFRESH_TOKEN_LIFETIME): '604800' # 7 days
    env(MCP_REFRESH_TOKEN_ABSOLUTE_LIFETIME): '2592000' # 30 days
    env(MCP_REFRESH_TOKEN_REUSE_GRACE): '10'
    env(MCP_ALLOWED_CLIENTS): 'claude,openai,gemini'

    # Only addresses with an open (pending, not expired) club invitation may create an account
    env(RESTRICT_REGISTRATION): 'false'
    app.restrict_registration: '%env(bool:RESTRICT_REGISTRATION)%'

    # The API creates no clubs (only the bootstrap with RESTRICT_REGISTRATION=true and no club yet); app:club:create bypasses
    env(RESTRICT_CLUB_CREATION): 'false'
    app.restrict_club_creation: '%env(bool:RESTRICT_CLUB_CREATION)%'

    # Public feed ICS (/api/feed/:id/ics) default window: events overlapping [today - PAST_DAYS, today + FUTURE_MONTHS]
    # in the club's zone. WINDOW_ENABLED=false = whole history. MAX_EVENTS > 0 caps the output (first N by date/time,
    # protection only, no error), 0 = unlimited. Does not affect the member export or the web view.
    env(FEED_ICS_WINDOW_ENABLED): 'true'
    env(FEED_ICS_PAST_DAYS): '180'
    env(FEED_ICS_FUTURE_MONTHS): '24'
    env(FEED_ICS_MAX_EVENTS): '0'

    env(MAP_IMAGE_CACHE_TTL): '2592000'  # 30 days
    env(GEOCODER_CACHE_TTL): '3600'       # 1 hour
    env(MAPBOX_PROXY_CACHE_TTL): '2592000' # 30 days

    # File storage (app.storage): STORAGE_SOURCE = storage.local | storage.s3. S3_* only matter for storage.s3.
    # S3_SSE_C_KEY: base64 of 32 random bytes (server-side encryption with a customer key, needs https);
    # S3_SSE_C_KEY_PREVIOUS: comma-separated older keys and/or the word "plain", only while rotating.
    env(STORAGE_SOURCE): 'storage.local'
    env(STORAGE_LOCAL_PATH): '%kernel.project_dir%/var/storage'
    env(S3_ENDPOINT): ''
    env(S3_REGION): 'us-east-1'
    env(S3_KEY): ''
    env(S3_SECRET): ''
    env(S3_BUCKET): ''
    env(S3_PREFIX): ''
    env(S3_USE_PATH_STYLE): 'false'
    env(S3_SSE_C_KEY): ''
    env(S3_SSE_C_KEY_PREVIOUS): ''

    env(MAPBOX_TOKEN): ''
    map.image.zoom: 14
    map.image.width: 800
    map.image.height: 288
    mapbox.allowed_patterns:
        - pattern: '^/v4/[^/]+/[0-9]+/[0-9]+/[0-9]+'
          methods: ['GET']
          rate_limited: true
        - pattern: '^/styles/'
          methods: ['GET']
          rate_limited: false
        - pattern: '^/fonts/'
          methods: ['GET']
          rate_limited: false

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Public so the Doctrine encrypted types (static) can reach it lazily, see Kernel::boot()
    App\Security\Secret\SecretCipher:
        public: true

    App\Messenger\EncryptingSerializer:
        arguments:
            $inner: '@messenger.transport.native_php_serializer'

    # Holiday feed URLs come from users: the client checks every resolved address and every redirect
    # target (IPv4 and IPv6) against private networks; assertSafeUrl() only sees the first host.
    holiday_calendar.http_client:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments: ['@http_client']

    App\Service\HolidayCalendarService:
        arguments:
            $httpClient: '@holiday_calendar.http_client'
            $refreshAttemptsCache: '@holiday_refresh_attempts'

    App\Service\OpenHolidaysClient:
        arguments:
            $httpClient: '@holiday_calendar.http_client'
            $cache: '@holiday_sources'

    geocoder.mapbox_de:
        class: Geocoder\StatefulGeocoder
        arguments:
            $provider: '@bazinga_geocoder.provider.mapbox'
            $locale: 'de'

    App\Service\Map\MapboxMapImageProvider:
        arguments:
            $mapboxToken: '%env(MAPBOX_TOKEN)%'

    App\Service\Map\CachingGeocoderDecorator:
        public: true
        arguments:
            $inner: '@App\Service\Map\RateLimitedGeocoderDecorator'
            $geocoderResponsesCache: '@geocoder_responses'

    App\Service\Map\RateLimitedGeocoderDecorator:
        arguments:
            $inner: '@geocoder.mapbox_de'

    App\Service\Map\CachingMapImageProvider:
        arguments:
            $inner: '@App\Service\Map\RateLimitedMapImageProvider'
            $mapImagesCache: '@map_images'

    App\Service\Map\RateLimitedMapImageProvider:
        arguments:
            $inner: '@App\Service\Map\MapboxMapImageProvider'

    App\Service\Map\MapboxProxyService:
        arguments:
            $allowedPatterns: '%mapbox.allowed_patterns%'
            $mapboxProxyCache: '@mapbox_proxy'
            $mapboxToken: '%env(MAPBOX_TOKEN)%'

    app.lock_store:
        class: Symfony\Component\Lock\PersistingStoreInterface
        factory: ['App\Scheduler\LockStoreFactory', 'create']
        arguments: ['@doctrine.dbal.default_connection', '%env(LOCK_DSN)%']

    app.scheduler_lock_factory:
        class: Symfony\Component\Lock\LockFactory
        arguments: ['@app.lock_store']

    app.s3_client:
        class: Aws\S3\S3Client
        factory: ['@App\Storage\S3ClientFactory', 'create']

    # Same bucket without the automatic SSE-C parameters: the key rotation sets old and new keys per request
    app.s3_client_raw:
        class: Aws\S3\S3Client
        factory: ['@App\Storage\S3ClientFactory', 'createRaw']

    App\Storage\S3ClientFactory:
        arguments:
            $endpoint: '%env(S3_ENDPOINT)%'
            $region: '%env(S3_REGION)%'
            $accessKey: '%env(S3_KEY)%'
            $secretKey: '%env(S3_SECRET)%'
            $pathStyle: '%env(bool:S3_USE_PATH_STYLE)%'
            $sseCKey: '%env(S3_SSE_C_KEY)%'

    App\Storage\StorageConfig:
        arguments:
            $source: '%env(storage_source:STORAGE_SOURCE)%'
            $endpoint: '%env(S3_ENDPOINT)%'
            $bucket: '%env(S3_BUCKET)%'
            $prefix: '%env(S3_PREFIX)%'
            $sseCKey: '%env(S3_SSE_C_KEY)%'
            $sseCPrevious: '%env(S3_SSE_C_KEY_PREVIOUS)%'

    App\Storage\S3KeyRotator:
        arguments:
            $client: '@app.s3_client_raw'
            $lockFactory: '@app.scheduler_lock_factory'

    App\Security\LocationResolver:
        factory: ['@App\Security\LocationResolverFactory', 'create']
        arguments: ['%env(MAXMIND_LICENSE_KEY)%']

    App\EventListener\LocationMapCacheInvalidator:
        arguments:
            $mapImagesCache: '@map_images'
            $imageZoom: '%map.image.zoom%'
            $imageWidth: '%map.image.width%'
            $imageHeight: '%map.image.height%'

    App\Controller\MapController:
        arguments:
            $geocoder: '@App\Service\Map\CachingGeocoderDecorator'
            $imageZoom: '%map.image.zoom%'
            $imageWidth: '%map.image.width%'
            $imageHeight: '%map.image.height%'

    MapImageProviderInterface:
        alias: App\Service\Map\CachingMapImageProvider
        public: true

    App\Service\Map\MapImageProviderInterface:
        alias: App\Service\Map\CachingMapImageProvider
        public: true

    App\Service\TokenService:
        arguments:
            $refreshSecret: '%env(JWT_REFRESH_SECRET)%'

    App\Service\WebAuthnService:
        arguments:
            $rpId:      '%env(WEBAUTHN_RP_ID)%'
            $rpName:    '%env(WEBAUTHN_RP_NAME)%'
            # Only the frontend origin may complete a WebAuthn ceremony (clientDataJSON.origin).
            $allowedOrigin: '%env(FRONTEND_URL)%'
            # preferred | required | discouraged ("required" rejects responses without the UV flag)
            $userVerification: '%env(WEBAUTHN_USER_VERIFICATION)%'

    App\Controller\OAuthController:
        arguments:
            $frontendUrl: '%env(FRONTEND_URL)%'

    App\EventListener\ExceptionListener:
        arguments:
            $httpErrorListener: '@exception_listener'

    # MCP DNS-rebinding protection: Host = same hosts as framework.trusted_hosts; Origin = same origin or the frontend.
    mcp.server.app.middleware_factory:
        class: Symfony\AI\McpBundle\Http\MiddlewareFactory
        arguments:
            - '%env(trusted_host_list:TRUSTED_HOSTS)%'
            - ['%env(FRONTEND_URL)%']
