parameters:
    env(MICROSOFT_TENANT_ID): 'common'
    microsoft_oidc_issuer: 'https://login.microsoftonline.com/%env(MICROSOFT_TENANT_ID)%/v2.0'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\TokenService:
        arguments:
            $refreshSecret: '%env(JWT_REFRESH_SECRET)%'

    App\Service\WebAuthnService:
        arguments:
            $rpId:      '%env(WEBAUTHN_RP_ID)%'
            $rpName:    '%env(WEBAUTHN_RP_NAME)%'
            $appSecret: '%env(APP_SECRET)%'
            $appUrl:    '%env(FRONTEND_URL)%'

    App\Controller\OAuthController:
        arguments:
            $frontendUrl: '%env(FRONTEND_URL)%'

    App\EventListener\ExceptionListener:
        arguments:
            $httpErrorListener: '@exception_listener'
